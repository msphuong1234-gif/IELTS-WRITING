<style>:root{font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;color:#183044;background:#f2f6fa}*{box-sizing:border-box}body{margin:0}header{background:#143a57;color:white;padding:24px max(18px,calc((100vw - 1100px)/2))}h1{font-size:clamp(1.5rem,3vw,2.2rem);margin:.1em 0}h2{font-size:1.4rem;margin:0 0 10px}h3{font-size:1.08rem;margin:0 0 8px}main{max-width:1100px;margin:auto;padding:22px 18px 70px}.card{background:white;border:1px solid #dce6ee;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 4px 18px #173c5b0a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:12px}.grid .card{margin:0}button{font:inherit;border:0;border-radius:9px;background:#17699a;color:white;padding:10px 17px;cursor:pointer;min-height:44px}button.secondary{background:#e7eff5;color:#163d5e}button.danger{background:#a23a3a}button:disabled{opacity:.55;cursor:wait}label{display:block;font-weight:650;margin:10px 0 5px}input,select,textarea{font:inherit;border:1px solid #9db1c0;border-radius:8px;padding:10px;width:100%;background:white;color:#183044}textarea{min-height:180px;resize:vertical;white-space:pre-wrap}select{max-width:260px}.source{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f9fc;border-left:4px solid #8ab5d0;padding:16px;border-radius:5px;max-width:100%;line-height:1.8}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.muted{color:#536b7d}.badge{display:inline-block;background:#e5f1f6;color:#1b5677;border-radius:20px;padding:2px 11px;font-size:.86rem}.answer{white-space:pre-wrap;overflow-wrap:anywhere}.review{border-top:1px solid #dce6ee;padding-top:16px;margin-top:18px}.q{border:1px solid #e2eaf0;border-radius:9px;padding:13px;margin:12px 0}.status{font-weight:650}#notice{position:sticky;top:0;background:#fff6d9;color:#633f00;padding:10px;z-index:5}#notice:empty{display:none}@media(max-width:600px){main{padding:14px 12px 60px}.card{padding:16px}.actions button{flex:1 1 120px}.source{padding:11px}}:focus-visible{outline:3px solid #e6a33d;outline-offset:2px}</style></head><body><header><div>IELTS WRITING TASK 1 · STATIC CHARTS</div><h1>Comparison Language</h1><div>MAX · MORE · SAME · TIMES · 30 Exercises</div></header><div id="notice" role="status"></div><main id="app"></main>
<script id="lesson-data" type="application/json">{"id": "WRITING_TASK1_STATIC_COMPARISON_01", "title": "Static Charts · Comparison Language", "theory": "6. STATIC CHARTS - 4 CẤU TRÚC SO SÁNH\nNHỚ 4 TỪ: MAX - MORE - SAME - TIMES / MAX = cao nhất / thấp nhất / MORE = cao hơn / thấp hơn / SAME = bằng / xấp xỉ bằng / TIMES = gấp nhiều lần\n6.1. So sánh hơn nhất - MAX\nThe percentage/proportion/quantity of A + be + (by far) highest/lowest + [data]\nA + be + (the) most/least + common/popular/frequent/vital... (+ Noun) + [data]\nMost / Fewest / Least + Noun + Verb\n6.2. So sánh hơn/kém - MORE\nThe percentage/number/quantity of A + be higher/lower than the figure for / that of B + [data]\nA + be more/less + adjective (+ noun) + than B + [data]\nMore / Fewer / Less + Noun + ... + than ...\nMức độ chênh lệch:\nChênh lệch lớn: much / a lot / far / significantly + comparative\nChênh lệch nhỏ: a little / slightly + comparative\n6.3. So sánh bằng - SAME\nThe percentages/numbers/quantities of A and B + be (nearly/roughly) equal/identical/the same + [data]\nA + be as + adjective + as B + [data]\n6.4. So sánh gấp - TIMES\nA + halve / double / triple / quadruple / quintuple + the figure for / that of B\nA + be twofold / threefold / fourfold / fivefold as high as B\nCó thể thêm around / nearly khi giá trị chỉ xấp xỉ.\n7. STATIC CHARTS - MÔ TẢ & LÀM TRÒN SỐ LIỆU\n7.1. Cách diễn đạt số liệu\n1) S + be + number\n2) S + account for / constitute / occupy / represent / make up + number (%)\n3) Number + Verb\n4) There + be + number + noun\nCHÚ Ý HÒA HỢP CHỦ - VỊ / Khi số liệu đứng đầu câu, động từ chia theo danh từ đứng sau số liệu. / Danh từ số nhiều -> động từ số nhiều; danh từ không đếm được -> động từ số ít.\n7.2. Làm tròn / mô tả số gần đúng\nQuan hệ với số mốc | Từ/cụm thường dùng\nCao hơn mốc | over; above; more than; higher than; just over; slightly over; well over; considerably more than\nThấp hơn mốc | under; below; less than; lower than; just under; slightly under; well under; considerably less than; nearly; almost; close to\nXấp xỉ mốc | about; around; approximately\n7.3. “Respectively”\nDùng khi đưa hai hoặc nhiều số liệu theo đúng thứ tự của các đối tượng vừa nêu. Đây là cách giúp câu so sánh gọn hơn.", "exercises": [{"id": "EX01", "number": 1, "title": "Identify MAX – MORE – SAME – TIMES", "body": "Instructions: Write MAX, MORE, SAME, or TIMES.\nJapan had the highest percentage, at 68%. ______\nThe figure for France was higher than that for Germany. ______\nThe percentages for men and women were roughly equal. ______\nThe figure for Australia was approximately twice that for India. ______\nCars were the most popular form of transport. ______\nFewer people chose buses than trains. ______\nThe figures for Canada and France were both approximately 45%. ______\nSpending on housing was three times the figure for clothing. ______\nThe lowest proportion was recorded for cycling. ______\nSlightly more women than men attended university. ______\nCoffee and tea accounted for nearly identical proportions. ______\nThe number of domestic tourists was roughly double that of international tourists. ______", "key": "1  Đáp án: MAX\nGiải thích: highest/lowest hoặc superlative.\n2  Đáp án: MORE\nGiải thích: so sánh hơn/kém giữa hai đối tượng.\n3  Đáp án: SAME\nGiải thích: hai số bằng hoặc gần bằng.\n4  Đáp án: TIMES\nGiải thích: quan hệ gấp nhiều lần.\n5  Đáp án: MAX\nGiải thích: highest/lowest hoặc superlative.\n6  Đáp án: MORE\nGiải thích: so sánh hơn/kém giữa hai đối tượng.\n7  Đáp án: SAME\nGiải thích: hai số bằng hoặc gần bằng.\n8  Đáp án: TIMES\nGiải thích: quan hệ gấp nhiều lần.\n9  Đáp án: MAX\nGiải thích: highest/lowest hoặc superlative.\n10  Đáp án: MORE\nGiải thích: so sánh hơn/kém giữa hai đối tượng.\n11  Đáp án: SAME\nGiải thích: hai số bằng hoặc gần bằng.\n12  Đáp án: TIMES\nGiải thích: quan hệ gấp nhiều lần.", "mode": "select", "options": ["MAX", "MORE", "SAME", "TIMES"], "questions": ["Japan had the highest percentage, at 68%.", "The figure for France was higher than that for Germany.", "The percentages for men and women were roughly equal.", "The figure for Australia was approximately twice that for India.", "Cars were the most popular form of transport.", "Fewer people chose buses than trains.", "The figures for Canada and France were both approximately 45%.", "Spending on housing was three times the figure for clothing.", "The lowest proportion was recorded for cycling.", "Slightly more women than men attended university.", "Coffee and tea accounted for nearly identical proportions.", "The number of domestic tourists was roughly double that of international tourists."], "correct": ["MAX", "MORE", "SAME", "TIMES", "MAX", "MORE", "SAME", "TIMES", "MAX", "MORE", "SAME", "TIMES"], "explanations": ["highest/lowest hoặc superlative.", "so sánh hơn/kém giữa hai đối tượng.", "hai số bằng hoặc gần bằng.", "quan hệ gấp nhiều lần.", "highest/lowest hoặc superlative.", "so sánh hơn/kém giữa hai đối tượng.", "hai số bằng hoặc gần bằng.", "quan hệ gấp nhiều lần.", "highest/lowest hoặc superlative.", "so sánh hơn/kém giữa hai đối tượng.", "hai số bằng hoặc gần bằng.", "quan hệ gấp nhiều lần."]}, {"id": "EX02", "number": 2, "title": "Highest or Lowest?", "body": "Instructions: Use the data to complete each comparison accurately.\nCountry | Percentage\nCanada | 62%\nJapan | 78%\nFrance | 55%\nIndia | 31%\nAustralia | 70%\n________ had the highest percentage, at ________.\nThe percentage for ________ was the lowest, at ________.\n________ recorded by far the highest figure.\nThe figure for India was by far the ________.\nWrite one natural MAX sentence of your own:\n______________________________________________________________________________________", "key": "1  Đáp án: Japan; 78%\nGiải thích: 78% là lớn nhất.\n2  Đáp án: India; 31%\nGiải thích: 31% là nhỏ nhất.\n3  Đáp án: Japan\nGiải thích: Japan 78% cao hơn tất cả.\n4  Đáp án: lowest\nGiải thích: India 31% là mức thấp nhất.\n5  Đáp án: Không thể chốt “Japan was the most popular” nếu biến đo chỉ là một tỷ lệ không mang nghĩa popularity.\nGiải thích: Adjective phải khớp nghĩa của biến. Có thể nói “Japan recorded the highest percentage, at 78%.”", "mode": "writing", "options": [], "questions": [], "correct": [], "explanations": []}, {"id": "EX03", "number": 3, "title": "Three Ways to Express MAX", "body": "Instructions: Use the same data to produce three different structures.\nDATA A: Car = 65% – highest transport choice\npercentage + highest: \t_________________________________________________________\nA + most popular/common: \t_________________________________________________________\nMost + noun + verb: \t_________________________________________________________\nDATA B: Cycling = 8% – lowest transport choice\n______________________________________________________________________________________\n____________________________________________________________________________________\n______________________________________________________________________________________", "key": "Model answer: Car: The percentage for cars was the highest, at 65%. / Cars were the most popular form of transport, accounting for 65%. / Most journeys were made by car, if the chart actually measures journeys by mode.\nGiải thích: Câu 2–3 chỉ hợp lệ khi biến đo thực sự là popularity/journeys. Không được đổi meaning của chart.\nModel answer: Cycling: The percentage for cycling was the lowest, at 8%. / Cycling was the least popular form of transport, at 8%. / The fewest journeys were made by bicycle, if the chart reports numbers/shares of journeys.\nGiải thích: “Fewest” đi với countable plural; “least” thường đi với uncountable hoặc adjective/superlative pattern.", "mode": "writing", "options": [], "questions": [], "correct": [], "explanations": []}, {"id": "EX04", "number": 4, "title": "Higher / Lower Than", "body": "Instructions: Complete the comparisons. Make the degree fit the data.\nCountry | Internet access\nA | 75%\nB | 60%\nC | 35%\nThe percentage for A was ______ than the figure for B.\nThe figure for C was ______ than that for B.\nThe percentage for A was ______ higher than that for C.\nB recorded a ______ percentage than A.\nThe figure for C was ______ lower than the figure for A.", "key": "1  Đáp án: higher\nGiải thích: 75% > 60%.\n2  Đáp án: lower\nGiải thích: 35% < 60%.\n3  Đáp án: far / significantly / much\nGiải thích: 75% so với 35% là chênh lớn.\n4  Đáp án: lower\nGiải thích: 60% < 75%.\n5  Đáp án: far / significantly / much\nGiải thích: 35% so với 75% là chênh lớn.", "mode": "writing", "options": [], "questions": [], "correct": [], "explanations": []}, {"id": "EX05", "number": 5, "title": "THAT OF / THE FIGURE FOR", "body": "Instructions: Correct any inaccurate or unnatural comparison. Compare like with like.\nThe percentage of males was higher than females.\nThe figure for Canada was lower than Australia.\nThe number of cars was higher than buses.\nThe percentage for France was higher than that of Germany.\nThe figure for men was considerably higher than the figure for women.", "key": "1  Đáp án: The percentage of males was higher than that of females.\nGiải thích: So sánh percentage với percentage, không percentage với people.\n2  Đáp án: The figure for Canada was lower than that for Australia.\nGiải thích: figure ↔ figure.\n3  Đáp án: The number of cars was higher than the number of buses. / The figure for cars was higher than that for buses.\nGiải thích: number ↔ number.\n4  Đáp án: ✓ The percentage for France was higher than that of Germany.\nGiải thích: Cấu trúc like-with-like chấp nhận được.\n5  Đáp án: ✓ The figure for men was considerably higher than the figure for women.\nGiải thích: Đúng; có thể gọn thành “...than that for women”.", "mode": "writing", "options": [], "questions": [], "correct": [], "explanations": []}, {"id": "EX06", "number": 6, "title": "Choose MORE, FEWER or LESS", "body": "Instructions: Complete each sentence.\n______ students chose science than history.\n______ money was spent on food than transport.\n______ electricity was consumed in France than Germany.\n______ cars were sold in 2020 than 2019.\n______ people travelled by bicycle than by car.\n______ water was used for agriculture than industry.\n______ households owned two cars than one car.\n______ time was spent watching television than exercising.\n______ tourists visited France than Belgium.\n______ energy was generated from coal than solar power.", "key": "1  Đáp án: 1\nGiải thích: More\n2  Đáp án: 2\nGiải thích: More\n3  Đáp án: 3\nGiải thích: More\n4  Đáp án: 4\nGiải thích: More\n5  Đáp án: 5\nGiải thích: Fewer\n6  Đáp án: 6\nGiải thích: More\n7  Đáp án: 7\nGiải thích: Fewer\n8  Đáp án: 8\nGiải thích: More\n9  Đáp án: 9\nGiải thích: More\n10  Đáp án: 10\nGiải thích: More\nLưu ý GV: Nếu câu diễn tả “ít hơn”, countable plural → fewer; uncountable → less. “More” dùng được với cả hai loại danh từ.", "mode": "writing", "options": [], "questions": [], "correct": [], "explanations": []}, {"id": "EX07", "number": 7, "title": "Big Gap or Small Gap?", "body": "Instructions: Classify the modifiers, then use them with the data.\nLARGE DIFFERENCE | SMALL DIFFERENCE\nmuch / far / significantly / a lot | slightly / a little\nYour additions: __________ | Your additions: __________\n80% vs 30%: A was ______ higher than B.\n52% vs 49%: A was ______ higher than B.\n15,000 vs 40,000: A was ______ lower than B.\n68% vs 65%: A was ______ higher than B.", "key": "Large difference  Đáp án: much, far, significantly, a lot\nGiải thích: Đều nhấn mạnh chênh lệch lớn trước comparative.\nSmall difference  Đáp án: slightly, a little\nGiải thích: Nhấn mạnh chênh lệch nhỏ.\n1  Đáp án: far / much / significantly\nGiải thích: 80 vs 30 là gap rất lớn.\n2  Đáp án: slightly / a little\nGiải thích: 52 vs 49 chỉ 3 điểm.\n3  Đáp án: far / much / significantly\nGiải thích: 15,000 vs 40,000 là gap lớn.\n4  Đáp án: slightly / a little\nGiải thích: 68 vs 65 chỉ 3 điểm.", "mode": "writing", "options": [], "questions": [], "correct": [], "explanations": []}, {"id": "EX08", "number": 8, "title": "Data Decides the Language", "body": "Instructions: Circle the sentence that matches the size of the difference.\nA = 51%, B = 49%\nA. A was far higher than B.    B. A was slightly higher than B.\nA = 80%, B = 25%\nA. A was considerably higher than B.    B. A was a little higher than B.\nA = 42%, B = 40%\nA. A was slightly higher than B.    B. A was significantly higher than B.", "key": "1  Đáp án: B\nGiải thích: 51% và 49% gần nhau → slightly higher.\n2  Đáp án: A\nGiải thích: 80% và 25% chênh rất lớn → considerably higher.\n3  Đáp án: A\nGiải thích: 42% và 40% chênh nhỏ → slightly higher.", "mode": "select", "options": ["A", "B"], "questions": ["A = 51%, B = 49%\nA. A was far higher than B.    B. A was slightly higher than B.", "A = 80%, B = 25%\nA. A was considerably higher than B.    B. A was a little higher than B.", "A = 42%, B = 40%\nA. A was slightly higher than B.    B. A was significantly higher than B."], "correct": ["B", "A", "A"], "explanations": ["51% và 49% gần nhau → slightly higher.", "80% và 25% chênh rất lớn → considerably higher.", "42% và 40% chênh nhỏ → slightly higher."]}, {"id": "EX09", "number": 9, "title": "Equal / Roughly Equal", "body": "Instructions: Write EXACT or APPROXIMATE, then write two comparison sentences.\nDATA: A = 45% | B = 45% | C = 44% | D = 46%\nA and B were equal. ______\nA and C were roughly equal. ______\nB and D were nearly equal. ______\nA and B recorded identical percentages. ______\nA + B = 45%:______________________________________________________\nC = 44%; D = 46%:_______________________________________________________________", "key": "1  Đáp án: EXACT\nGiải thích: 45 = 45.\n2  Đáp án: APPROXIMATE\nGiải thích: 45 vs 44.\n3  Đáp án: APPROXIMATE\nGiải thích: 45 vs 46.\n4  Đáp án: EXACT\nGiải thích: cùng 45%.\nModel answer: A and B recorded equal percentages, at 45% each. / The figures for C and D were roughly equal, at 44% and 46%, respectively.\nGiải thích: “equal/identical” cho exact; nearly/roughly equal cho gần bằng.", "mode": "writing", "options": [], "questions": [], "correct": [], "explanations": []}, {"id": "EX10", "number": 10, "title": "AS ... AS", "body": "Instructions: Rewrite using an equivalent SAME structure.\nA and B were equally popular. → A was ______________________________ B.\nThe two categories recorded the same level of expenditure. → Category A was ______________________________ Category B.\nCycling was approximately as common as walking. → The figures for ____________________________________________.", "key": "1  Đáp án: A was as popular as B.\nGiải thích: as + adjective + as.\n2  Đáp án: Category A was as significant/large as Category B, if the adjective accurately describes the measured variable.\nGiải thích: Không ép adjective nếu meaning không rõ; “The figures were the same” an toàn hơn.\n3  Đáp án: The figures for cycling and walking were approximately equal.\nGiải thích: Chuyển as...as sang noun comparison.", "mode": "writing", "options": [], "questions": [], "correct": [], "explanations": []}, {"id": "EX11", "number": 11, "title": "Calculate the Multiple", "body": "Instructions: Choose: twice / three times / four times / five times / nearly twice / approximately three times.\nA | B | Relationship\n40 | 20 | ________\n60 | 20 | ________\n80 | 20 | ________\n100 | 20 | ________\n48 | 25 | ________\n89 | 30 | ________", "key": "40 vs 20  Đáp án: twice\nGiải thích: 40/20=2.\n60 vs 20  Đáp án: three times\nGiải thích: 60/20=3.\n80 vs 20  Đáp án: four times\nGiải thích: 80/20=4.\n100 vs 20  Đáp án: five times\nGiải thích: 100/20=5.\n48 vs 25  Đáp án: nearly twice\nGiải thích: 48 gần 50 = 2×25.\n89 vs 30  Đáp án: approximately three times\nGiải thích: 3×30=90, rất gần 89.", "mode": "writing", "options": [], "questions": [], "correct": [], "explanations": []}, {"id": "EX12", "number": 12, "title": "Write TIMES Comparisons", "body": "Instructions: Write one accurate comparison for each pair. Prefer natural structures such as twice as high as / twice the figure for.\n1. A = 80; B = 40: \t__________________________________________________________\n2. A = 90; B = 30\t__________________________________________________________\n3. A = 100; B = 25\t__________________________________________________________\n4. A = 48; B = 25\t__________________________________________________________\n5. A = 89; B = 30\t__________________________________________________________", "key": "1  Đáp án: The figure for A was twice that for B.\nGiải thích: Dùng multiplier + “that for B” để so sánh cùng loại đại lượng.\n2  Đáp án: The figure for A was three times that for B.\nGiải thích: Dùng multiplier + “that for B” để so sánh cùng loại đại lượng.\n3  Đáp án: The figure for A was four times that for B.\nGiải thích: Dùng multiplier + “that for B” để so sánh cùng loại đại lượng.\n4  Đáp án: The figure for A was nearly twice that for B.\nGiải thích: Dùng multiplier + “that for B” để so sánh cùng loại đại lượng.\n5  Đáp án: The figure for A was approximately three times that for B.\nGiải thích: Dùng multiplier + “that for B” để so sánh cùng loại đại lượng.", "mode": "writing", "options": [], "questions": [], "correct": [], "explanations": []}, {"id": "EX13", "number": 13, "title": "Find and Repair the Error", "body": "Instructions: Correct the comparison where necessary.\nA was twice higher than B.\nThe percentage for A was two times higher than B.\nA was threefold as high than B.\nThe figure for A was double than B.\nA was approximately twice that of B.\nThe figure for A was nearly three times that for B.", "key": "1  Đáp án: A was twice as high as B. / The figure for A was twice that for B.\nGiải thích: Không dùng “twice higher than”.\n2  Đáp án: The figure for A was twice that for B.\nGiải thích: “two times higher” dễ gây mơ hồ; dùng twice that for.\n3  Đáp án: A was three times as high as B. / A was threefold as high as B.\nGiải thích: Nếu dùng threefold, cấu trúc là as high as, không as high than.\n4  Đáp án: The figure for A was double that for B. / twice that for B.\nGiải thích: Không “double than”.\n5  Đáp án: ✓ A was approximately twice that of B.\nGiải thích: Chấp nhận được nếu “that” có antecedent rõ; “that for B” thường rõ hơn.\n6  Đáp án: ✓ The figure for A was nearly three times that for B.\nGiải thích: Cấu trúc và approximation đúng.", "mode": "writing", "options": [], "questions": [], "correct": [], "explanations": []}, {"id": "EX14", "number": 14, "title": "Identify the Structure", "body": "Instructions: Write 1–4 beside each sentence.\n1) S + be + number   \t\t2) S + account for/constitute/represent/make up + number   \n3) Number + Verb   \t\t4) There + be + number + noun\nCar ownership was 65%. _____\nCar ownership accounted for 65%. _____\n65% of households owned a car. _____\nThere were 650 car-owning households. _____", "key": "1  Đáp án: 1\nGiải thích: S + be + number.\n2  Đáp án: 2\nGiải thích: S + account for + number.\n3  Đáp án: 3\nGiải thích: Number + verb.\n4  Đáp án: 4\nGiải thích: There + be + number + noun.", "mode": "writing", "options": [], "questions": [], "correct": [], "explanations": []}, {"id": "EX15", "number": 15, "title": "One Data Point → Four Sentences", "body": "Instructions: Use the data without inventing a total population or absolute count.\nDATA: University students studying science = 35%\nS + be + number:\t_______________________________________________________________\naccount for / represent: \t_______________________________________________________\nNumber + Verb: \t_______________________________________________________________\nThere + be:\t_______________________________________________________________", "key": "Model answer: 1. The percentage of university students studying science was 35%.  2. University students studying science accounted for 35% of the total.  3. Thirty-five percent of university students studied science.  4. A “There were ... students” sentence cannot be produced accurately unless the total number of students is given.\nGiải thích: 35% là tỷ lệ, không phải số lượng tuyệt đối. Không được tự suy ra 350 students nếu denominator không có.", "mode": "writing", "options": [], "questions": [], "correct": [], "explanations": []}, {"id": "EX16", "number": 16, "title": "Is or Are?", "body": "Instructions: Circle the correct verb. Decide from the noun after OF, not from the percentage.\n60% of students was / were satisfied.\n60% of the population was / were satisfied.\n25% of households owns / own two cars.\n40% of electricity comes / come from coal.\n70% of employees works / work full time.\n30% of water is / are used for agriculture.\n50% of the money was / were spent on housing.\n45% of participants prefers / prefer option A.", "key": "1  Đáp án: were\nGiải thích: students plural.\n2  Đáp án: was\nGiải thích: population singular collective/uncountable reference in this structure.\n3  Đáp án: own\nGiải thích: households plural.\n4  Đáp án: comes\nGiải thích: electricity uncountable singular.\n5  Đáp án: work\nGiải thích: employees plural.\n6  Đáp án: is\nGiải thích: water uncountable singular.\n7  Đáp án: was\nGiải thích: money uncountable singular.\n8  Đáp án: prefer\nGiải thích: participants plural.", "mode": "writing", "options": [], "questions": [], "correct": [], "explanations": []}, {"id": "EX17", "number": 17, "title": "Above, Below or Approximately?", "body": "Instructions: Put each expression in the correct group.\njust over • well over • slightly under • nearly • approximately • considerably more than • around • just under • above • below • almost\nABOVE | BELOW | APPROXIMATELY\n |  | \n |  | \n |  |", "key": "ABOVE  Đáp án: just over, well over, considerably more than, above\nGiải thích: Đều cho biết lớn hơn mốc; mức độ khác nhau.\nBELOW  Đáp án: slightly under, nearly, just under, below, almost\nGiải thích: “nearly/almost X” thường là chưa đạt tới X; cần nhìn ngữ cảnh.\nAPPROXIMATELY  Đáp án: approximately, around\nGiải thích: Xấp xỉ hai phía quanh mốc.\nLưu ý GV: “more than/higher than/less than/lower than” cũng là nhóm so sánh mốc; “close to” là approximation. Một số từ như nearly/almost có nghĩa “gần nhưng chưa tới” nên thuộc below khi gắn với một mốc cụ thể.", "mode": "writing", "options": [], "questions": [], "correct": [], "explanations": []}, {"id": "EX18", "number": 18, "title": "Choose the Most Precise Description", "body": "Instructions: Circle the best option.\nActual value = 51%\nA. well over 50%   B. just over 50%   C. approximately 70%\nActual value = 49%\nA. just under 50%   B. well under 50%   C. above 50%\nActual value = 98%\nA. almost 100%   B. well under 100%   C. just over 100%\nActual value = 32%\nA. around 30%   B. well over 50%   C. nearly 10%", "key": "51%  Đáp án: B. just over 50%\nGiải thích: Chỉ cao hơn 1 điểm.\n49%  Đáp án: A. just under 50%\nGiải thích: Chỉ thấp hơn 1 điểm.\n98%  Đáp án: A. almost 100%\nGiải thích: Rất gần nhưng chưa đạt 100%.\n32%  Đáp án: A. around 30%\nGiải thích: 32 gần 30.", "mode": "select", "options": ["A", "B", "C"], "questions": ["Actual value = 51%\nA. well over 50%   B. just over 50%   C. approximately 70%", "Actual value = 49%\nA. just under 50%   B. well under 50%   C. above 50%", "Actual value = 98%\nA. almost 100%   B. well under 100%   C. just over 100%", "Actual value = 32%\nA. around 30%   B. well over 50%   C. nearly 10%"], "correct": ["B", "A", "A", "A"], "explanations": ["Chỉ cao hơn 1 điểm.", "Chỉ thấp hơn 1 điểm.", "Rất gần nhưng chưa đạt 100%.", "32 gần 30."]}, {"id": "EX19", "number": 19, "title": "Rounding Accuracy", "body": "Instructions: Complete each approximate expression, then decide when exact reporting is preferable.\n49.2% → __________________ 50%\n51.1% → __________________ 50%\n73.8% → __________________ 75%\n98.4% → __________________ 100%\n19.7% → __________________ 20%\nWhen might exact reporting be better than approximation?\n______________________________________________________________________________________\n______________________________________________________________________________________", "key": "1  Đáp án: just under / approximately\nGiải thích: 49.2 gần 50 nhưng thấp hơn.\n2  Đáp án: just over / approximately\nGiải thích: 51.1 gần 50 nhưng cao hơn.\n3  Đáp án: approximately / just under\nGiải thích: 73.8 gần 75 và thấp hơn.\n4  Đáp án: almost / just under\nGiải thích: 98.4 gần 100 nhưng chưa đạt.\n5  Đáp án: approximately / just under\nGiải thích: 19.7 gần 20 và thấp hơn.\nLưu ý GV: Nếu chart cho số chính xác và số đó dễ đọc, exact reporting thường tốt hơn. Approximation hữu ích khi chart chỉ cho hình ảnh/ước lượng hoặc khi grouping/comparison cần sự gọn gàng.", "mode": "writing", "options": [], "questions": [], "correct": [], "explanations": []}, {"id": "EX20", "number": 20, "title": "Understand “Respectively”", "body": "Instructions: Map each number to the correct noun.\nFrance = 45% | Germany = 60%\nFrance and Germany recorded ______ and ______, respectively.\nThis means: France = ______ ; Germany = ______.", "key": "Sentence  Đáp án: France and Germany recorded 45% and 60%, respectively.\nGiải thích: respectively map theo thứ tự: France→45%; Germany→60%. Không được đảo số.", "mode": "writing", "options": [], "questions": [], "correct": [], "explanations": []}, {"id": "EX21", "number": 21, "title": "Combine with Respectively", "body": "Instructions: Combine each set into ONE sentence. Keep nouns and figures in the same order.\n1. Men: 65%. Women: 55%.\n______________________________________________________________________________________\n2. France: 40%. Germany: 62%.\n______________________________________________________________________________________\n3. Food: 30%. Housing: 45%. Transport: 15%.\n______________________________________________________________________________________\n4. Cars: 70%. Buses: 20%. Bicycles: 10%.\n______________________________________________________________________________________", "key": "1  Đáp án: Men and women recorded 65% and 55%, respectively.\nGiải thích: Đối tượng và số phải giữ cùng thứ tự.\n2  Đáp án: France and Germany accounted for 40% and 62%, respectively.\nGiải thích: Đối tượng và số phải giữ cùng thứ tự.\n3  Đáp án: Food, housing and transport accounted for 30%, 45% and 15%, respectively.\nGiải thích: Đối tượng và số phải giữ cùng thứ tự.\n4  Đáp án: Cars, buses and bicycles represented 70%, 20% and 10%, respectively.\nGiải thích: Đối tượng và số phải giữ cùng thứ tự.", "mode": "writing", "options": [], "questions": [], "correct": [], "explanations": []}, {"id": "EX22", "number": 22, "title": "IELTS Static Chart Error Clinic", "body": "Instructions: Correct every target error. Some sentences may require more than one change.\nThe percentage of France was higher than Germany.\nMore money were spent on housing.\nFewer water was consumed in 2020.\nA was twice higher than B.\nThe figure of Canada was the highest one.\n60% of electricity were generated from coal.\nThe percentage for men was far higher that for women.\nA and B were roughly identical at exactly 40%.\nFrance accounted 35% of the total.\nCars made 45% of all journeys.\nThere was 60% people choosing option A.\nA was threefold as high than B.\nJapan and Korea recorded 45% and 60%, respectful.\nThe number of A was higher than B.\n49% was well over 50%.", "key": "1  Đáp án: The figure/percentage for France was higher than that for Germany.\nGiải thích: Không so sánh percentage với country.\n2  Đáp án: More money was spent on housing.\nGiải thích: money uncountable → was.\n3  Đáp án: Less water was consumed in 2020.\nGiải thích: water uncountable → less.\n4  Đáp án: A was twice as high as B. / The figure for A was twice that for B.\nGiải thích: Không twice higher than.\n5  Đáp án: The figure for Canada was the highest.\nGiải thích: figure for, không figure of; “one” không cần.\n6  Đáp án: 60% of electricity was generated from coal.\nGiải thích: electricity uncountable → was.\n7  Đáp án: The percentage for men was far higher than that for women.\nGiải thích: than that for.\n8  Đáp án: A and B were roughly equal at around 40%. / A and B were exactly equal at 40%.\nGiải thích: roughly và exactly mâu thuẫn nếu cùng mô tả một quan hệ.\n9  Đáp án: France accounted for 35% of the total.\nGiải thích: account for cần for.\n10  Đáp án: Cars made up 45% of all journeys.\nGiải thích: phrasal verb là make up.\n11  Đáp án: 60% of people chose option A.\nGiải thích: Không dùng There was + 60% people; percentage + of + plural noun + plural verb.\n12  Đáp án: A was three times as high as B.\nGiải thích: threefold as high as cũng có thể, nhưng không “than”.\n13  Đáp án: Japan and Korea recorded 45% and 60%, respectively.\nGiải thích: respectively, không respectful.\n14  Đáp án: The number of A was higher than that of B.\nGiải thích: like-with-like comparison.\n15  Đáp án: 49% was just under 50%.\nGiải thích: 49 < 50 nên không well over.", "mode": "writing", "options": [], "questions": [], "correct": [], "explanations": []}, {"id": "EX23", "number": 23, "title": "Choose the Best IELTS Sentence", "body": "Instructions: Choose the sentence that is both grammatically accurate and faithful to the data.\n1. A = 72%, B = 70%\n \tA. A was enormously higher than B.   \tB. A was slightly higher than B.  \n C. A doubled B.   \t\t\t\tD. A was significantly lower than B.\n2. A = 60%, B = 30%\n \tA. A was slightly higher than B.   \t\tB. A was approximately twice the figure for B.   \nC. A and B were roughly equal.   \t\tD. B was twice A.\n3. A = 40%, B = 40%\n \tA. A was far higher than B.   \t\t\tB. B was slightly lower than A.   \nC. The figures for A and B were equal.   \tD. A doubled B.\n4. A = 78%, highest category\n \tA. A accounted for the highest proportion, at 78%.   B. A increased to 78%.   \nC. A was twice higher at 78%.   \t\t\tD. A fluctuated at 78%.", "key": "1  Đáp án: B\nGiải thích: 72 vs 70 = chênh nhỏ.\n2  Đáp án: B\nGiải thích: 60 = 2×30.\n3  Đáp án: C\nGiải thích: 40 = 40 exact equality.\n4  Đáp án: A\nGiải thích: 78% là highest; “accounted for the highest proportion” phù hợp static chart.", "mode": "select", "options": ["A", "B", "C", "D"], "questions": ["1. A = 72%, B = 70%", "2. A = 60%, B = 30%", "3. A = 40%, B = 40%", "4. A = 78%, highest category"], "correct": ["B", "B", "C", "A"], "explanations": ["72 vs 70 = chênh nhỏ.", "60 = 2×30.", "40 = 40 exact equality.", "78% là highest; “accounted for the highest proportion” phù hợp static chart."]}, {"id": "EX24", "number": 24, "title": "Same Data, Different Structure", "body": "Instructions: Rewrite each sentence in TWO different ways without changing the data.\n1. Cars accounted for 45% of all journeys.\n______________________________________________________________________________________\n______________________________________________________________________________________\n2. The figure for women was higher than that for men.\n______________________________________________________________________________________\n______________________________________________________________________________________\n3. A and B recorded approximately equal percentages.\n______________________________________________________________________________________\n______________________________________________________________________________________\n4. The figure for X was twice that for Y.\n______________________________________________________________________________________\n______________________________________________________________________________________\n5. Japan had the highest percentage, at 72%.\n______________________________________________________________________________________\n______________________________________________________________________________________", "key": "1  Đáp án: The figure for car journeys was 45%. / Forty-five percent of all journeys were made by car.\nGiải thích: Các paraphrase giữ nguyên quan hệ và data; không đổi loại dữ liệu.\n2  Đáp án: Men recorded a lower figure than women. / The percentage for women exceeded that for men.\nGiải thích: Các paraphrase giữ nguyên quan hệ và data; không đổi loại dữ liệu.\n3  Đáp án: A and B had roughly the same percentages. / The percentages for A and B were approximately equal.\nGiải thích: Các paraphrase giữ nguyên quan hệ và data; không đổi loại dữ liệu.\n4  Đáp án: Y recorded half the figure for X. / X was twice as high as Y, if the measured scale permits “high”.\nGiải thích: Các paraphrase giữ nguyên quan hệ và data; không đổi loại dữ liệu.\n5  Đáp án: At 72%, Japan recorded the highest figure. / The figure for Japan was the highest, at 72%.\nGiải thích: Các paraphrase giữ nguyên quan hệ và data; không đổi loại dữ liệu.", "mode": "writing", "options": [], "questions": [], "correct": [], "explanations": []}, {"id": "EX25", "number": 25, "title": "Write the Most Useful Comparison", "body": "Instructions: Use the table to write the six required sentence types.\nCategory | %\nCars | 60\nTrains | 30\nBuses | 28\nCycling | 10\n1. MAX comparison:\n______________________________________________________________________________________\n2. MORE comparison:\n______________________________________________________________________________________\n3. SAME / approximately same comparison:\n______________________________________________________________________________________\n4. TIMES comparison:\n______________________________________________________________________________________\n5. sentence with respectively:\n______________________________________________________________________________________\n6. sentence with account for / represent / make up:\n______________________________________________________________________________________", "key": "1  Đáp án: Cars accounted for the highest proportion, at 60%.\nGiải thích: Bám đúng dữ liệu; SAME dùng “roughly” vì 30 và 28 không bằng tuyệt đối.\n2  Đáp án: The figure for trains was slightly higher than that for buses, at 30% and 28%, respectively.\nGiải thích: Bám đúng dữ liệu; SAME dùng “roughly” vì 30 và 28 không bằng tuyệt đối.\n3  Đáp án: The figures for trains and buses were roughly equal, at 30% and 28%, respectively.\nGiải thích: Bám đúng dữ liệu; SAME dùng “roughly” vì 30 và 28 không bằng tuyệt đối.\n4  Đáp án: The figure for cars was twice that for trains.\nGiải thích: Bám đúng dữ liệu; SAME dùng “roughly” vì 30 và 28 không bằng tuyệt đối.\n5  Đáp án: Cars and cycling accounted for 60% and 10%, respectively.\nGiải thích: Bám đúng dữ liệu; SAME dùng “roughly” vì 30 và 28 không bằng tuyệt đối.\n6  Đáp án: Buses represented 28% of the total.\nGiải thích: Bám đúng dữ liệu; SAME dùng “roughly” vì 30 và 28 không bằng tuyệt đối.", "mode": "writing", "options": [], "questions": [], "correct": [], "explanations": []}, {"id": "EX26", "number": 26, "title": "Don’t Describe Every Number", "body": "Instructions: Select FOUR comparisons worth reporting. Look for highest, lowest, largest gender gap, equal figures, and notable contrasts.\nCountry | Male | Female\nA | 70% | 68%\nB | 45% | 25%\nC | 30% | 60%\nD | 50% | 50%\n1.__________________________________________________________________________________\n2.____________________________________________________________________________________\n3.____________________________________________________________________________________\n4.____________________________________________________________________________________", "key": "Model answer: Possible four key comparisons: (1) Group A had the highest male figure, at 70%. (2) Group B showed the largest gender gap, with 45% for males versus 25% for females. (3) In Group C, the female figure (60%) was twice the male figure (30%), reversing the male-dominant pattern seen in A and B. (4) Group D recorded identical figures for men and women, at 50% each.\nGiải thích: Đây là bài chọn lọc: không cần kể 8 số. Ưu tiên extreme, largest gap, equality và reversal.", "mode": "writing", "options": [], "questions": [], "correct": [], "explanations": []}, {"id": "EX27", "number": 27, "title": "Make the Report Less Mechanical", "body": "Instructions: Combine the data into 1–2 natural sentences using whereas/while, compared with, respectively, TIMES, or MAX/MIN where appropriate.\nDATA 1: A = 60% | B = 40% | C = 20%\n______________________________________________________________________________________\n______________________________________________________________________________________\nDATA 2: Men = 52% | Women = 49%\n______________________________________________________________________________________\n______________________________________________________________________________________\nDATA 3: France = 35% | Germany = 70%\n______________________________________________________________________________________\n______________________________________________________________________________________", "key": "Model answer: Data 1: A recorded the highest figure, at 60%, compared with 40% for B, while C was lowest at 20%; notably, A was three times as high as C.\nGiải thích: Gộp extreme + comparison thay vì ba câu đơn.\nModel answer: Data 2: Men and women recorded roughly equal figures, at 52% and 49%, respectively.\nGiải thích: Chênh 3 điểm → roughly equal.\nModel answer: Data 3: France accounted for 35%, whereas the figure for Germany was twice as high, at 70%.\nGiải thích: 70 = 2×35.", "mode": "writing", "options": [], "questions": [], "correct": [], "explanations": []}, {"id": "EX28", "number": 28, "title": "Controlled Production", "body": "Instructions: Write SIX accurate sentences. Include MAX, MORE, SAME, TIMES, an appropriate degree/approximation if justified, and respectively. Do not force a TIMES comparison if the data do not support it.\nSpending category | Country A | Country B\nHousing | 40% | 25%\nFood | 25% | 30%\nTransport | 20% | 20%\nEntertainment | 10% | 15%\nOther | 5% | 10%", "key": "Model answer: Housing was the largest spending category in Country A, accounting for 40%, compared with 25% in Country B. By contrast, food represented a higher share in Country B than in A, at 30% and 25%, respectively. The two countries allocated identical proportions to transport, at 20% each. Spending on entertainment was also higher in B, at 15%, compared with 10% in A. The figure for “Other” in Country B was twice that in Country A, at 10% versus 5%. Overall, Country A devoted a substantially larger share to housing, whereas Country B spent relatively more on the remaining non-transport categories.\nGiải thích: TIMES chỉ dùng ở 10% vs 5%, nơi ratio chính xác là 2. Không ép TIMES cho các cặp khác.", "mode": "writing", "options": [], "questions": [], "correct": [], "explanations": []}, {"id": "EX29", "number": 29, "title": "Edit the Paragraph", "body": "Instructions: Underline and classify errors: Comparison | Quantifier | Agreement | Preposition | Word form | Data | Respectively | TIMES. Then rewrite the whole paragraph.\n \tThe percentage of housing in Country A was the most highest, accounting 40%. This was much more higher than Country B, with 25%. Food constituted 25% and 30% in A and B respectful. The figures of transport were same, at 20%. Country B's entertainment was 1.5 times higher than Country A. Fewer money was spent for other items in A than B.\nRewritten paragraph:\n______________________________________________________________________________________\n______________________________________________________________________________________\n______________________________________________________________________________________\n______________________________________________________________________________________\n______________________________________________________________________________________\n______________________________________________________________________________________", "key": "Model answer: Housing accounted for the highest proportion of spending in Country A, at 40%. This figure was considerably higher than the 25% recorded in Country B. Food constituted 25% and 30% in Countries A and B, respectively. The figures for transport were the same, at 20% in both countries. Country B’s spending on entertainment was 1.5 times the figure for Country A, at 15% versus 10%. Less money was spent on other items in Country A than in Country B, at 5% and 10%, respectively.\nGiải thích: Sửa “most highest”→highest; account→account for; more higher→higher; respectful→respectively; figures of→figures for; same cần “the same”; 1.5 times higher → 1.5 times the figure; fewer money→less money; spent for→spent on.", "mode": "writing", "options": [], "questions": [], "correct": [], "explanations": []}, {"id": "EX30", "number": 30, "title": "Independent Static Chart Production", "body": "Instructions: Write a 6–8 sentence paragraph. Select and group useful comparisons rather than listing every number.\nCategory | Group A | Group B\nOnline shopping | 72% | 36%\nSupermarkets | 55% | 58%\nLocal shops | 25% | 50%\nMarkets | 20% | 18%\nOther | 10% | 10%\nRequired: ≥1 MAX • ≥2 MORE • ≥1 SAME • ≥1 TIMES • figure/that of • more/fewer/less if appropriate • one account for/represent/make up structure • approximation only when justified • ≥1 respectively sentence • accurate data.\n______________________________________________________________________________________\n______________________________________________________________________________________\n______________________________________________________________________________________\n______________________________________________________________________________________\n______________________________________________________________________________________\n______________________________________________________________________________________\n______________________________________________________________________________________", "key": "Model answer: Online shopping accounted for the highest proportion in Group A, at 72%, exactly twice the figure for Group B (36%). By contrast, supermarkets were slightly more common in Group B than in Group A, at 58% and 55%, respectively. A much larger difference was seen for local shops: the figure for Group B was 50%, double that for Group A at 25%. The percentages for markets were relatively similar, at 20% in A and 18% in B. Finally, the two groups recorded identical figures for the “Other” category, at 10% each. Overall, Group A was dominated by online shopping, whereas Group B showed stronger preferences for supermarkets and local shops.\nGiải thích: Đáp ứng MAX, MORE, SAME, TIMES, figure/reference, respectively và data integrity. Không cần ép “fewer/less” nếu câu không tự nhiên; rubric nên chấp nhận khi học sinh dùng đúng ở nơi phù hợp.", "mode": "writing", "options": [], "questions": [], "correct": [], "explanations": []}]}</script><script>
'use strict';const lesson=JSON.parse(document.getElementById('lesson-data').textContent), app=document.getElementById('app'), notice=document.getElementById('notice');const storageKey='writingPractice::'+lesson.id;const endpoint='https://script.google.com/macros/s/AKfycbzCX-jRyn28wS8lEQ-wtdM8qspFr-Ptj1c2r3ctxpi3hseVZ1UMBE8N4jXAx1-03pLn/exec';let state=read(),page='login',active=null,locked=false;
function read(){try{const x=JSON.parse(localStorage.getItem(storageKey));return x&&typeof x==='object'?x:{student:{},exercises:{}}}catch{return {student:{},exercises:{}}}}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(state));notice.textContent=''}catch{notice.textContent='Không lưu được trên thiết bị. Hãy kiểm tra dung lượng bộ nhớ trình duyệt trước khi rời trang.'}}
function E(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function view(s){app.innerHTML=s;window.scrollTo(0,0)}function exstate(id){return state.exercises[id]||(state.exercises[id]={responses:{},submitted:false,send:'',attempt:1})}function nav(p,id){page=p;active=id||null;render()}
function render(){if(page==='login'){view(`<section class="card"><h2>Thông tin học sinh</h2><p class="muted">Nhập đủ thông tin để lưu bài làm theo Lesson này.</p><form id="login"><label for="name">Họ và tên</label><input id="name" required value="${E(state.student.name)}"><label for="class">Lớp</label><input id="class" required value="${E(state.student.class)}"><label for="sid">Mã học sinh</label><input id="sid" required value="${E(state.student.id)}"><div class="actions"><button>Vào bài học</button></div></form></section>`);return}
if(page==='home'){let completed=lesson.exercises.filter(x=>exstate(x.id).submitted).length;view(`<div class="card"><h2>${E(lesson.title)}</h2><p>${E(state.student.name)} · ${E(state.student.class)} · ${E(state.student.id)}</p><p class="status">Đã nộp ${completed}/${lesson.exercises.length} Exercise</p><div class="actions"><button data-action="theory">Học lý thuyết</button><button class="secondary" data-action="edit">Sửa thông tin</button><button class="danger" data-action="reset">Reset toàn bộ Lesson</button></div></div><h2>Practice</h2><div class="grid">${lesson.exercises.map(x=>{let a=exstate(x.id),status=a.submitted?'ĐÃ NỘP':Object.values(a.responses||{}).some(Boolean)?'ĐANG LÀM':'CHƯA LÀM';return `<div class="card"><span class="badge">${status}</span><h3>Exercise ${x.number}. ${E(x.title)}</h3><div class="muted">${x.mode==='select'?'Câu khách quan · chấm tự động':'Writing · đối chiếu bài mẫu'}</div>${a.submitted&&x.mode==='select'?`<div>Điểm: ${a.score}/${x.questions.length}</div>`:''}<div class="actions"><button data-action="exercise" data-id="${x.id}">${a.submitted?'Xem lại':'Mở Exercise'}</button></div></div>`}).join('')}</div>`);return}
if(page==='theory'){let blocks=lesson.theory.split(/(?=\n(?:6\.\d|7\.\d)\.)/);view(`<div class="actions"><button class="secondary" data-action="home">← Trở lại Lesson</button></div><h2>Kiến thức cần học trước khi luyện tập</h2>${blocks.map(b=>`<section class="card"><div class="source">${E(b.trim())}</div></section>`).join('')}`);return}
let x=lesson.exercises.find(z=>z.id===active),a=exstate(x.id),submitted=a.submitted;let input=x.mode==='select'?x.questions.map((q,i)=>`<div class="q"><label for="q${i}">Câu ${i+1}</label><div class="source">${E(q)}</div><select id="q${i}" data-response="q${i}" ${submitted?'disabled':''}><option value="">Chọn đáp án</option>${x.options.map(o=>`<option value="${o}" ${a.responses['q'+i]===o?'selected':''}>${o}</option>`).join('')}</select></div>`).join(''):`<label for="writing">Bài làm của em</label><textarea id="writing" data-response="writing" ${submitted?'readonly':''} placeholder="Viết đáp án theo đúng thứ tự trong đề. Giữ các dòng cho từng câu để dễ xem lại.">${E(a.responses.writing||'')}</textarea>`;
let review='';if(submitted){review=x.mode==='select'?`<h3>Kết quả: ${a.score}/${x.questions.length} câu đúng (chỉ phần này được chấm tự động)</h3>${x.questions.map((q,i)=>`<div class="q"><strong>Câu ${i+1}: ${a.responses['q'+i]===x.correct[i]?'✓ Đúng':'✗ Cần xem lại'}</strong><div class="source">${E(q)}</div><div>Em chọn: ${E(a.responses['q'+i]||'Chưa chọn')}</div><div>Đáp án: <strong>${E(x.correct[i])}</strong></div><div>Giải thích: ${E(x.explanations[i])}</div></div>`).join('')}`:`<h3>Bài làm của em</h3><div class="source">${E(a.responses.writing||'(Để trống)')}</div><p><strong>Chế độ đối chiếu:</strong> bài viết có thể có nhiều cách diễn đạt đúng. Bài mẫu dưới đây không phải đáp án duy nhất và hệ thống không tự chấm band hay đánh dấu bài viết của em là sai.</p>`;
review+=`<h3>${x.mode==='select'?'Đáp án và giải thích từ Teacher Key':'Bài mẫu, đáp án và giải thích từ Teacher Key'}</h3><div class="source">${E(x.key)}</div><h3>Kiến thức cần nhớ</h3><p>Đọc lại lời giải của Exercise ${x.number}, kiểm tra tính chính xác của số liệu, cấu trúc và cách dùng từ; đối chiếu mục tương ứng trong phần Lý thuyết.</p><p class="status" role="status">${E(a.send==='sent'?'Đã gửi kết quả.':a.send==='sending'?'Đang gửi kết quả…':a.send==='failed'?'Chưa gửi được kết quả. Bài làm của em vẫn được lưu trên thiết bị này.':a.send==='skipped'?'Đã lưu trên thiết bị. Không gửi Sheet.':'Đã lưu bài làm trên thiết bị.')}</p>`}
view(`<div class="actions"><button class="secondary" data-action="home">← Trở lại Lesson</button></div><section class="card"><span class="badge">Exercise ${x.number} · ${submitted?'ĐÃ NỘP':'ĐANG LÀM'}</span><h2>${E(x.title)}</h2><div class="source">${E(x.body)}</div>${input}<div class="actions">${submitted?`<button data-action="retry">Làm lại Exercise</button>${a.send==='failed'?'<button data-action="resend">Gửi lại kết quả</button>':''}`:'<button data-action="submit" id="submit">Nộp bài</button>'}<button class="secondary" data-action="home">Trở lại Lesson</button></div>${submitted?`<div class="review">${review}</div>`:''}</section>`)}
document.addEventListener('submit',ev=>{if(ev.target.id!=='login')return;ev.preventDefault();state.student={name:document.getElementById('name').value.trim(),class:document.getElementById('class').value.trim(),id:document.getElementById('sid').value.trim()};if(!Object.values(state.student).every(Boolean))return;save();nav('home')});
document.addEventListener('input',ev=>{let k=ev.target.dataset.response;if(!k||!active)return;exstate(active).responses[k]=ev.target.value;save()});document.addEventListener('change',ev=>{let k=ev.target.dataset.response;if(!k||!active)return;exstate(active).responses[k]=ev.target.value;save()});
document.addEventListener('click',async ev=>{let b=ev.target.closest('button[data-action]');if(!b)return;let action=b.dataset.action;if(action==='home'||action==='theory')return nav(action);if(action==='edit')return nav('login');if(action==='exercise')return nav('exercise',b.dataset.id);if(action==='reset'){if(confirm('Reset toàn bộ Lesson? Tất cả bài đang làm và kết quả đã lưu trên thiết bị sẽ bị xóa.')&&confirm('Xác nhận lần 2: xóa toàn bộ tiến độ của Lesson này?')){state.exercises={};save();render()}return}if(action==='retry'){if(locked)return;if(confirm('Làm lại Exercise này? Bài làm và kết quả lần hiện tại sẽ bị xóa trên thiết bị.')){let a=exstate(active);state.exercises[active]={responses:{},submitted:false,send:'',attempt:(a.attempt||1)+1};save();render()}return}if(action==='submit'){if(locked)return;let x=lesson.exercises.find(z=>z.id===active),a=exstate(active);if(a.submitted)return;let filled=Object.values(a.responses).some(v=>String(v).trim());if(!filled&&!confirm('Em chưa nhập đáp án. Vẫn nộp Exercise này?'))return;locked=true;b.disabled=true;a.submitted=true;a.score=x.mode==='select'?x.correct.reduce((sum,k,i)=>sum+(a.responses['q'+i]===k?1:0),0):0;a.send='sending';a.submittedAt=new Date().toISOString();save();render();await send(x,a);locked=false;render();return}if(action==='resend'){let x=lesson.exercises.find(z=>z.id===active),a=exstate(active);if(locked||a.send==='sent')return;locked=true;b.disabled=true;a.send='sending';save();render();await send(x,a);locked=false;render()}});
async function send(x,a){const token=`${lesson.id}:${x.id}:${a.attempt}`;const objective=x.mode==='select';let payload={skill:'WRITING',studentName:state.student.name,studentClass:state.student.class,studentId:state.student.id,testId:lesson.id,testName:lesson.title,score:objective?a.score:0,total:objective?x.questions.length:0,duration:0,correct:objective?a.score:0,wrong:objective?x.questions.length-a.score:0,answers:JSON.stringify({exerciseId:x.id,exerciseName:x.title,attempt:a.attempt,submissionId:token,responses:a.responses,wordCount:x.mode==='writing'?(a.responses.writing||'').trim().split(/\s+/).filter(Boolean).length:undefined})};try{const result=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});if(!result.ok)throw Error('HTTP '+result.status);let reply=await result.text();if(/"(?:success|ok)"\s*:\s*false|"status"\s*:\s*"error"/i.test(reply))throw Error('Server rejected');a.send='sent'}catch(e){a.send='failed'}save()}
if(state.student?.name&&state.student?.class&&state.student?.id)page='home';render();
</script></body></html>
