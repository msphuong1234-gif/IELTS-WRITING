</style></head><body><header><div>IELTS WRITING TASK 1 · LESSON 4</div><h1>From Sentences to Paragraphs</h1><div>Cohesive devices · 33 Exercises · Tự lưu tiến độ</div></header><div id="notice" role="status"></div><main id="app"></main><script type="application/json" id="data">{"id": "WRITING_TASK1_COHESIVE_PARAGRAPHS_01", "title": "Cohesive Devices · From Sentences to Paragraphs", "theory": "8. TỪ CÂU ĐẾN ĐOẠN VĂN - COHESIVE DEVICES\nMột đoạn mô tả được tạo bằng cách kết hợp các câu xu hướng/so sánh và nối chúng sao cho mạch lạc, logic.\n8.1. Clause Connectors - nối hai mệnh đề trong một câu\n[TABLE]\nQuan hệ | Cấu trúc\nTime | After + V-ing/Noun phrase, Clause 2\nTime | Clause 1 + before + V-ing/Noun phrase\nTime | Clause 1, and then Clause 2\nContrast | While/Whereas Clause 1, Clause 2\nContrast | Clause 1, but Clause 2\nContrast | Despite + V-ing/Noun phrase, Clause 2\nVị trí:\nAfter, Before, While/Whereas, Despite: có thể đứng đầu hoặc giữa câu.\nAnd, But: chỉ đứng giữa câu theo phần hướng dẫn trong tài liệu.\n8.2. Sentence Connectors - nối hai câu\n[TABLE]\nQuan hệ | Từ nối\nTime | Then; Following that; After that\nContrast | However; In contrast; By contrast\nSimilarity | Similarly; Likewise\n[TABLE]\nQUY TẮC HỌC THUỘC / Không nối câu chỉ để “trông hay”. Chọn từ nối dựa trên quan hệ thật giữa hai thông tin: thời gian - tương phản - tương đồng. / Có thể dùng this figure / the figure for... để tránh lặp lại toàn bộ chủ ngữ.", "intro": "IELTS WRITING TASK 1\nCOHESIVE DEVICES – FROM SENTENCES TO PARAGRAPHS\nSTUDENT PRACTICE BOOKLET\nName: ______________________________   Class: ______________   Date: ______________\n[TABLE]\nCORE PROCESS / RELATIONSHIP → CONNECTOR TYPE → GRAMMAR → REFERENCE → COHESIVE PARAGRAPH\nQUICK REFERENCE\n[TABLE]\nRELATIONSHIP | CLAUSE CONNECTORS | SENTENCE CONNECTORS\nTIME | After + V-ing/Noun phrase; ... before + V-ing/Noun phrase; ..., and then ... | Then; Following that; After that\nCONTRAST | While/Whereas + clause; ..., but ...; Despite + V-ing/Noun phrase | However; In contrast; By contrast\nSIMILARITY | — | Similarly; Likewise\nReference: this figure = same subject/data; the figure for + noun = change to another subject.\nRule: Do not add a connector just to sound academic. First identify the real relationship between the information.", "selfcheck": "SELF-CHECK BEFORE SUBMITTING\n□ I identified the real relationship first: TIME / CONTRAST / SIMILARITY.\n□ I chose a clause connector or sentence connector deliberately.\n□ After/Before is followed by an appropriate V-ing or noun phrase in the target patterns.\n□ While/Whereas joins clauses; but is used between clauses.\n□ Despite is followed by V-ing or a noun phrase, not a full clause in the pattern practised here.\n□ Sentence connectors are punctuated correctly.\n□ I used this figure / the figure for... to avoid unnecessary repetition.\n□ I did not add connectors only to make the paragraph look academic.\n□ My connectors do not change the chronology or the meaning of the data.\n□ My paragraph reads logically even when unnecessary linking words are removed.", "exercises": [{"id": "EX01", "number": 1, "title": "TIME – CONTRAST – SIMILARITY", "body": "Instructions: Write T (Time), C (Contrast), or S (Similarity).\nSales rose to 50,000 in 2010. They then increased to 70,000 in 2015. _____\nCar ownership stood at 65% in France. The figure for Germany was only 35%. _____\nThe percentage of male students was 48%. The corresponding figure for females was also approximately 48%. _____\nElectricity consumption declined until 2015. It subsequently recovered to 600 kWh. _____\nCanada recorded the highest figure, at 72%. In comparison, India had the lowest, at 25%. _____\nSpending on food accounted for 30% in Country A. It represented a similar proportion in Country B. _____\nThe figure peaked in 2012. It fell considerably over the following three years. _____\nTrain use increased substantially. Bus use, however, declined. _____\nFrance and Germany recorded similar levels of expenditure. _____\nThe number of visitors remained stable for five years. It then rose sharply. _____\nMen spent considerably more time exercising than women. _____\nThe percentage for Australia was 45%. Likewise, New Zealand recorded approximately 45%. _____", "key": "1  Đáp án: T\nGiải thích: hai mốc nối tiếp theo thời gian\n2  Đáp án: C\nGiải thích: France 65 vs Germany 35 đối lập rõ\n3  Đáp án: S\nGiải thích: 48 và khoảng 48 tương đồng\n4  Đáp án: T\nGiải thích: decline rồi recover theo chronology\n5  Đáp án: C\nGiải thích: highest vs lowest\n6  Đáp án: S\nGiải thích: similar proportion\n7  Đáp án: T\nGiải thích: peak rồi fall\n8  Đáp án: C\nGiải thích: increase vs decline\n9  Đáp án: S\nGiải thích: similar levels\n10  Đáp án: T\nGiải thích: stable rồi rise\n11  Đáp án: C\nGiải thích: men more than women\n12  Đáp án: S\nGiải thích: 45 và khoảng 45", "answers": [{"id": "1", "answer": "T", "why": "hai mốc nối tiếp theo thời gian"}, {"id": "2", "answer": "C", "why": "France 65 vs Germany 35 đối lập rõ"}, {"id": "3", "answer": "S", "why": "48 và khoảng 48 tương đồng"}, {"id": "4", "answer": "T", "why": "decline rồi recover theo chronology"}, {"id": "5", "answer": "C", "why": "highest vs lowest"}, {"id": "6", "answer": "S", "why": "similar proportion"}, {"id": "7", "answer": "T", "why": "peak rồi fall"}, {"id": "8", "answer": "C", "why": "increase vs decline"}, {"id": "9", "answer": "S", "why": "similar levels"}, {"id": "10", "answer": "T", "why": "stable rồi rise"}, {"id": "11", "answer": "C", "why": "men more than women"}, {"id": "12", "answer": "S", "why": "45 và khoảng 45"}], "mode": "choice", "count": 12, "choices": ["T", "C", "S"], "labels": ["Câu 1", "Câu 2", "Câu 3", "Câu 4", "Câu 5", "Câu 6", "Câu 7", "Câu 8", "Câu 9", "Câu 10", "Câu 11", "Câu 12"], "objective": true, "objectiveCount": 12, "expected": ["T", "C", "S", "T", "C", "S", "T", "C", "S", "T", "C", "S"]}, {"id": "EX02", "number": 2, "title": "Classify the connectors", "body": "Instructions: Put each connector into TIME / CONTRAST / SIMILARITY, then mark C (Clause connector) or S (Sentence connector).\nAfter\nbefore\nand then\nwhile\nwhereas\nbut\ndespite\nthen\nfollowing that\nafter that\nhowever\nin contrast\nby contrast\nsimilarly\nlikewise", "key": "After  Đáp án: TIME + C\nGiải thích: C = clause-level pattern trong booklet; S = sentence connector. “Despite” chính xác hơn là concession, nhưng được nhóm cùng contrast để phục vụ Task 1.\nbefore  Đáp án: TIME + C\nGiải thích: C = clause-level pattern trong booklet; S = sentence connector. “Despite” chính xác hơn là concession, nhưng được nhóm cùng contrast để phục vụ Task 1.\nand then  Đáp án: TIME + C\nGiải thích: C = clause-level pattern trong booklet; S = sentence connector. “Despite” chính xác hơn là concession, nhưng được nhóm cùng contrast để phục vụ Task 1.\nwhile  Đáp án: CONTRAST + C\nGiải thích: C = clause-level pattern trong booklet; S = sentence connector. “Despite” chính xác hơn là concession, nhưng được nhóm cùng contrast để phục vụ Task 1.\nwhereas  Đáp án: CONTRAST + C\nGiải thích: C = clause-level pattern trong booklet; S = sentence connector. “Despite” chính xác hơn là concession, nhưng được nhóm cùng contrast để phục vụ Task 1.\nbut  Đáp án: CONTRAST + C\nGiải thích: C = clause-level pattern trong booklet; S = sentence connector. “Despite” chính xác hơn là concession, nhưng được nhóm cùng contrast để phục vụ Task 1.\ndespite  Đáp án: CONTRAST/CONCESSION + C\nGiải thích: C = clause-level pattern trong booklet; S = sentence connector. “Despite” chính xác hơn là concession, nhưng được nhóm cùng contrast để phục vụ Task 1.\nthen  Đáp án: TIME + S\nGiải thích: C = clause-level pattern trong booklet; S = sentence connector. “Despite” chính xác hơn là concession, nhưng được nhóm cùng contrast để phục vụ Task 1.\nfollowing that  Đáp án: TIME + S\nGiải thích: C = clause-level pattern trong booklet; S = sentence connector. “Despite” chính xác hơn là concession, nhưng được nhóm cùng contrast để phục vụ Task 1.\nafter that  Đáp án: TIME + S\nGiải thích: C = clause-level pattern trong booklet; S = sentence connector. “Despite” chính xác hơn là concession, nhưng được nhóm cùng contrast để phục vụ Task 1.\nhowever  Đáp án: CONTRAST + S\nGiải thích: C = clause-level pattern trong booklet; S = sentence connector. “Despite” chính xác hơn là concession, nhưng được nhóm cùng contrast để phục vụ Task 1.\nin contrast  Đáp án: CONTRAST + S\nGiải thích: C = clause-level pattern trong booklet; S = sentence connector. “Despite” chính xác hơn là concession, nhưng được nhóm cùng contrast để phục vụ Task 1.\nby contrast  Đáp án: CONTRAST + S\nGiải thích: C = clause-level pattern trong booklet; S = sentence connector. “Despite” chính xác hơn là concession, nhưng được nhóm cùng contrast để phục vụ Task 1.\nsimilarly  Đáp án: SIMILARITY + S\nGiải thích: C = clause-level pattern trong booklet; S = sentence connector. “Despite” chính xác hơn là concession, nhưng được nhóm cùng contrast để phục vụ Task 1.\nlikewise  Đáp án: SIMILARITY + S\nGiải thích: C = clause-level pattern trong booklet; S = sentence connector. “Despite” chính xác hơn là concession, nhưng được nhóm cùng contrast để phục vụ Task 1.", "answers": [{"id": "After", "answer": "TIME + C", "why": "C = clause-level pattern trong booklet; S = sentence connector. “Despite” chính xác hơn là concession, nhưng được nhóm cùng contrast để phục vụ Task 1."}, {"id": "before", "answer": "TIME + C", "why": "C = clause-level pattern trong booklet; S = sentence connector. “Despite” chính xác hơn là concession, nhưng được nhóm cùng contrast để phục vụ Task 1."}, {"id": "and then", "answer": "TIME + C", "why": "C = clause-level pattern trong booklet; S = sentence connector. “Despite” chính xác hơn là concession, nhưng được nhóm cùng contrast để phục vụ Task 1."}, {"id": "while", "answer": "CONTRAST + C", "why": "C = clause-level pattern trong booklet; S = sentence connector. “Despite” chính xác hơn là concession, nhưng được nhóm cùng contrast để phục vụ Task 1."}, {"id": "whereas", "answer": "CONTRAST + C", "why": "C = clause-level pattern trong booklet; S = sentence connector. “Despite” chính xác hơn là concession, nhưng được nhóm cùng contrast để phục vụ Task 1."}, {"id": "but", "answer": "CONTRAST + C", "why": "C = clause-level pattern trong booklet; S = sentence connector. “Despite” chính xác hơn là concession, nhưng được nhóm cùng contrast để phục vụ Task 1."}, {"id": "despite", "answer": "CONTRAST/CONCESSION + C", "why": "C = clause-level pattern trong booklet; S = sentence connector. “Despite” chính xác hơn là concession, nhưng được nhóm cùng contrast để phục vụ Task 1."}, {"id": "then", "answer": "TIME + S", "why": "C = clause-level pattern trong booklet; S = sentence connector. “Despite” chính xác hơn là concession, nhưng được nhóm cùng contrast để phục vụ Task 1."}, {"id": "following that", "answer": "TIME + S", "why": "C = clause-level pattern trong booklet; S = sentence connector. “Despite” chính xác hơn là concession, nhưng được nhóm cùng contrast để phục vụ Task 1."}, {"id": "after that", "answer": "TIME + S", "why": "C = clause-level pattern trong booklet; S = sentence connector. “Despite” chính xác hơn là concession, nhưng được nhóm cùng contrast để phục vụ Task 1."}, {"id": "however", "answer": "CONTRAST + S", "why": "C = clause-level pattern trong booklet; S = sentence connector. “Despite” chính xác hơn là concession, nhưng được nhóm cùng contrast để phục vụ Task 1."}, {"id": "in contrast", "answer": "CONTRAST + S", "why": "C = clause-level pattern trong booklet; S = sentence connector. “Despite” chính xác hơn là concession, nhưng được nhóm cùng contrast để phục vụ Task 1."}, {"id": "by contrast", "answer": "CONTRAST + S", "why": "C = clause-level pattern trong booklet; S = sentence connector. “Despite” chính xác hơn là concession, nhưng được nhóm cùng contrast để phục vụ Task 1."}, {"id": "similarly", "answer": "SIMILARITY + S", "why": "C = clause-level pattern trong booklet; S = sentence connector. “Despite” chính xác hơn là concession, nhưng được nhóm cùng contrast để phục vụ Task 1."}, {"id": "likewise", "answer": "SIMILARITY + S", "why": "C = clause-level pattern trong booklet; S = sentence connector. “Despite” chính xác hơn là concession, nhưng được nhóm cùng contrast để phục vụ Task 1."}], "mode": "dual", "count": 15, "choices": [], "labels": ["After", "before", "and then", "while", "whereas", "but", "despite", "then", "following that", "after that", "however", "in contrast", "by contrast", "similarly", "likewise"], "objective": true, "objectiveCount": 15, "expected": [["TIME", "C"], ["TIME", "C"], ["TIME", "C"], ["CONTRAST", "C"], ["CONTRAST", "C"], ["CONTRAST", "C"], ["CONTRAST/CONCESSION", "C"], ["TIME", "S"], ["TIME", "S"], ["TIME", "S"], ["CONTRAST", "S"], ["CONTRAST", "S"], ["CONTRAST", "S"], ["SIMILARITY", "S"], ["SIMILARITY", "S"]]}, {"id": "EX03", "number": 3, "title": "Choose C or S", "body": "Instructions: Write C if it joins clauses within one sentence; S if it links separate sentences.\nWhereas _____\nHowever _____\nAfter _____\nFollowing that _____\nBut _____\nSimilarly _____\nDespite _____\nIn contrast _____\nAnd then _____\nLikewise _____\nWhile _____\nAfter that _____", "key": "1  Đáp án: C\nGiải thích: Whereas được luyện ở cấp mệnh đề.\n2  Đáp án: S\nGiải thích: However được luyện ở cấp câu.\n3  Đáp án: C\nGiải thích: After được luyện ở cấp mệnh đề.\n4  Đáp án: S\nGiải thích: Following that được luyện ở cấp câu.\n5  Đáp án: C\nGiải thích: But được luyện ở cấp mệnh đề.\n6  Đáp án: S\nGiải thích: Similarly được luyện ở cấp câu.\n7  Đáp án: C\nGiải thích: Despite được luyện ở cấp mệnh đề.\n8  Đáp án: S\nGiải thích: In contrast được luyện ở cấp câu.\n9  Đáp án: C\nGiải thích: And then được luyện ở cấp mệnh đề.\n10  Đáp án: S\nGiải thích: Likewise được luyện ở cấp câu.\n11  Đáp án: C\nGiải thích: While được luyện ở cấp mệnh đề.\n12  Đáp án: S\nGiải thích: After that được luyện ở cấp câu.", "answers": [{"id": "1", "answer": "C", "why": "Whereas được luyện ở cấp mệnh đề."}, {"id": "2", "answer": "S", "why": "However được luyện ở cấp câu."}, {"id": "3", "answer": "C", "why": "After được luyện ở cấp mệnh đề."}, {"id": "4", "answer": "S", "why": "Following that được luyện ở cấp câu."}, {"id": "5", "answer": "C", "why": "But được luyện ở cấp mệnh đề."}, {"id": "6", "answer": "S", "why": "Similarly được luyện ở cấp câu."}, {"id": "7", "answer": "C", "why": "Despite được luyện ở cấp mệnh đề."}, {"id": "8", "answer": "S", "why": "In contrast được luyện ở cấp câu."}, {"id": "9", "answer": "C", "why": "And then được luyện ở cấp mệnh đề."}, {"id": "10", "answer": "S", "why": "Likewise được luyện ở cấp câu."}, {"id": "11", "answer": "C", "why": "While được luyện ở cấp mệnh đề."}, {"id": "12", "answer": "S", "why": "After that được luyện ở cấp câu."}], "mode": "choice", "count": 12, "choices": ["C", "S"], "labels": ["Câu 1", "Câu 2", "Câu 3", "Câu 4", "Câu 5", "Câu 6", "Câu 7", "Câu 8", "Câu 9", "Câu 10", "Câu 11", "Câu 12"], "objective": true, "objectiveCount": 12, "expected": ["C", "S", "C", "S", "C", "S", "C", "S", "C", "S", "C", "S"]}, {"id": "EX04", "number": 4, "title": "AFTER + V-ing / Noun Phrase", "body": "Instructions: Combine each pair using After + V-ing, Clause.\nThe figure peaked at 80%. It then declined considerably.\nSales remained stable for five years. They then increased.\nThe percentage reached 60%. It subsequently fell to 45%.\nCar ownership declined to 30%. It then recovered.\nThe number of tourists doubled. It then remained unchanged.\nThe figure fluctuated between 20% and 30%. It then rose significantly.\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________", "key": "1  Đáp án: After peaking at 80%, the figure declined considerably.\nGiải thích: After + V-ing compresses the earlier event; main clause gives the later event. Subject logic must remain clear.\n2  Đáp án: After remaining stable for five years, sales increased.\nGiải thích: After + V-ing compresses the earlier event; main clause gives the later event. Subject logic must remain clear.\n3  Đáp án: After reaching 60%, the percentage fell to 45%.\nGiải thích: After + V-ing compresses the earlier event; main clause gives the later event. Subject logic must remain clear.\n4  Đáp án: After declining to 30%, car ownership recovered.\nGiải thích: After + V-ing compresses the earlier event; main clause gives the later event. Subject logic must remain clear.\n5  Đáp án: After doubling, the number of tourists remained unchanged.\nGiải thích: After + V-ing compresses the earlier event; main clause gives the later event. Subject logic must remain clear.\n6  Đáp án: After fluctuating between 20% and 30%, the figure rose significantly.\nGiải thích: After + V-ing compresses the earlier event; main clause gives the later event. Subject logic must remain clear.", "answers": [{"id": "1", "answer": "After peaking at 80%, the figure declined considerably.", "why": "After + V-ing compresses the earlier event; main clause gives the later event. Subject logic must remain clear."}, {"id": "2", "answer": "After remaining stable for five years, sales increased.", "why": "After + V-ing compresses the earlier event; main clause gives the later event. Subject logic must remain clear."}, {"id": "3", "answer": "After reaching 60%, the percentage fell to 45%.", "why": "After + V-ing compresses the earlier event; main clause gives the later event. Subject logic must remain clear."}, {"id": "4", "answer": "After declining to 30%, car ownership recovered.", "why": es the later event.\n3  Đáp án: House prices climbed considerably before remaining unchanged.\nGiải thích: Main clause event happens first; before + V-ing introduces the later event.\n4  Đáp án: The rate fluctuated for three years before peaking at 15%.\nGiải thích: Main clause event happens first; before + V-ing introduces the later event.\n5  Đáp án: Electricity consumption declined slightly before rising significantly.\nGiải thích: Main clause event happens first; before + V-ing introduces the later event.\n6  Đáp án: The number of visitors reached 2 million before falling to 1.5 million.\nGiải thích: Main clause event happens first; before + V-ing introduces the later event.", "answers": [{"id": "1", "answer": "Sales rose to 50,000 before stabilizing.", "why": "Main clause event happens first; before + V-ing introduces the later event."}, {"id": "2", "answer": "The percentage fell to 25% before recovering.", "why": "Main clause event happens first; before + V-ing introduces the later event."}, {"id": "3", "answer": "House prices climbed considerably before remaining unchanged.", "why": "Main clause event happens first; before + V-ing introduces the later event."}, {"id": "4", "answer": "The rate fluctuated for three years before peaking at 15%.", "why": "Main clause event happens first; before + V-ing introduces the later event."}, {"id": "5", "answer": "Electricity consumption declined slightly before rising significantly.", "why": "Main clause event happens first; before + V-ing introduces the later event."}, {"id": "6", "answer": "The number of visitors reached 2 million before falling to 1.5 million.", "why": "Main clause event happens first; before + V-ing introduces the later event."}], "mode": "writing", "count": 6, "choices": [], "labels": ["Câu 1", "Câu 2", "Câu 3", "Câu 4", "Câu 5", "Câu 6"], "objective": false, "objectiveCount": 0, "expected": []}, {"id": "EX06", "number": 6, "title": "Meaning Control", "body": "Instructions: Choose after or before. Make sure the chronology remains correct.\nThe figure increased to 60% ______ declining to 40%.\n______ reaching 60%, the figure declined to 40%.\nSales remained stable ______ increasing significantly.\n______ remaining stable for five years, sales increased significantly.\nThe rate declined ______ recovering in 2020.\n______ declining to its lowest point, the rate recovered.\nFor each pair, identify which event happened first:\n________________________________________________________________________________\n________________________________________________________________________________", "key": "1  Đáp án: before\nGiải thích: increase to 60 happens before decline.\n2  Đáp án: After\nGiải thích: reaching 60 happens first.\n3  Đáp án: before\nGiải thích: stable period precedes increase.\n4  Đáp án: After\nGiải thích: remaining stable precedes increase.\n5  Đáp án: before\nGiải thích: decline precedes recovery.\n6  Đáp án: After\nGiải thích: declining to lowest point precedes recovery.", "answers": [{"id": "1", "answer": "before", "why": "increase to 60 happens before decline."}, {"id": "2", "answer": "After", "why": "reaching 60 happens first."}, {"id": "3", "answer": "before", "why": "stable period precedes increase."}, {"id": "4", "answer": "After", "why": "remaining stable precedes increase."}, {"id": "5", "answer": "before", "why": "decline precedes recovery."}, {"id": "6", "answer": "After", "why": "declining to lowest point precedes recovery."}], "mode": "choice", "count": 7, "choices": ["after", "before"], "labels": ["Câu 1", "Câu 2", "Câu 3", "Câu 4", "Câu 5", "Câu 6", "Sự kiện nào xảy ra trước trong từng cặp?"], "objective": true, "objectiveCount": 6, "expected": ["before", "after", "before", "after", "before", "after"]}, {"id": "EX07", "number": 7, "title": "Combine chronological movements", "body": "Instructions: Join each pair using and then. Then rewrite items 1–3 with After or Before.\nSales rose to 40,000. Sales fell to 35,000.\nThe figure remained unchanged at 20%. It increased to 45%.\nThe rate peaked at 12%. It declined considerably.\nCar ownership fell slightly. It recovered to its original level.\nElectricity consumption increased steadily. It stabilized at 600 kWh.\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________", "key": "1  Đáp án: Sales rose to 40,000 and then fell to 35,000.\nGiải thích: and then joins two chronological clauses; both events share a clear subject/time sequence.\n2  Đáp án: The figure remained unchanged at 20% and then increased to 45%.\nGiải thích: and then joins two chronological clauses; both events share a clear subject/time sequence.\n3  Đáp án: The rate peaked at 12% and then declined considerably.\nGiải thích: and then joins two chronological clauses; both events share a clear subject/time sequence.\n4  Đáp án: Car ownership fell slightly and then recovered to its original level.\nGiải thích: and then joins two chronological clauses; both events share a clear subject/time sequence.\n5  Đáp án: Electricity consumption increased steadily and then stabilized at 600 kWh.\nGiải thích: and then joins two chronological clauses; both events share a clear subject/time sequence.\nModel answer: Challenge examples: After rising to 40,000, sales fell to 35,000. / The figure remained unchanged at 20% before increasing to 45%. / After peaking at 12%, the rate declined considerably.\nGiải thích: Same chronology, different clause connector.", "answers": [{"id": "1", "answer": "Sales rose to 40,000 and then fell to 35,000.", "why": "and then joins two chronological clauses; both events share a clear subject/time sequence."}, {"id": "2", "answer": "The figure remained unchanged at 20% and then increased to 45%.", "why": "and then joins two chronological clauses; both events share a clear subject/time sequence."}, {"id": "3", "answer": "The rate peaked at 12% and then declined considerably.", "why": "and then joins two chronological clauses; both events share a clear subject/time sequence."}, {"id": "4", "answer": "Car ownership fell slightly and then recovered to its original level.", "why": "and then joins two chronological clauses; both events share a clear subject/time sequence."}, {"id": "5", "answer": "Electricity consumption increased steadily and then stabilized at 600 kWh.", "why": "and then joins two chronological clauses; both events share a clear subject/time sequence."}, {"id": "1", "answer": "After rising to 40,000, sales fell to 35,000.", "why": "Same chronology, different clause connector."}, {"id": "2", "answer": "The figure remained unchanged at 20% before increasing to 45%.", "why": "Same chronology, different clause connector."}, {"id": "3", "answer": "After peaking at 12%, the rate declined considerably.", "why": "Same chronology, different clause connector."}], "mode": "writing", "count": 8, "choices": [], "labels": ["Câu 1: dùng and then", "Câu 2: dùng and then", "Câu 3: dùng and then", "Câu 4: dùng and then", "Câu 5: dùng and then", "Viết lại câu 1 bằng After/Before", "Viết lại câu 2 bằng After/Before", "Viết lại câu 3 bằng After/Before"], "objective": false, "objectiveCount": 0, "expected": []}, {"id": "EX08", "number": 8, "title": "Contrast within ONE sentence", "body": "Instructions: Combine each pair using while or whereas. Alternate the two forms.\nCar use increased. Bus use decreased.\nMale employment stood at 75%. Female employment was 55%.\nSpending on food was highest in Country A. Housing was the largest category in Country B.\nFrance consumed 500 kWh. Germany used only 300 kWh.\nThe figure for Group A rose considerably. That for Group B remained stable.\nAustralia recorded 68%. India accounted for only 24%.\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________", "key": "1  Đáp án: While car use increased, bus use decreased.\nGiải thích: while/whereas joins two full clauses and signals real contrast.\n2  Đáp án: Whereas male employment stood at 75%, female employment was 55%.\nGiải thích: while/whereas joins two full clauses and signals real contrast.\n3  Đáp án: While spending on food was highest in Country A, housing was the largest category in Country B.\nGiải thích: while/whereas joins two full clauses and signals real contrast.\n4  Đáp án: France consumed 500 kWh, whereas Germany used only 300 kWh.\nGiải thích: while/whereas joins two full clauses and signals real contrast.\n5  Đáp án: While the figure for Group A rose considerably, that for Group B remained stable.\nGiải thích: while/whereas joins two full clauses and signals real contrast.\n6  Đáp án: Australia recorded 68%, whereas India accounted for only 24%.\nGiải thích: while/whereas joins two full clauses and signals real contrast.", "answers": [{"id": "1", "answer": "While car use increased, bus use decreased.", "why": "while/whereas joins two full clauses and signals real contrast."}, {"id": "2", "answer": "Whereas male employment stood at 75%, female employment was 55%.", "why": "while/whereas joins two full clauses and signals real contrast."}, {"id": "3", "answer": "While spending on food was highest in Country A, housing was the largest category in Country B.", "why": "while/whereas joins two full clauses and signals real contrast."}, {"id": "4", "answer": "France consumed 500 kWh, whereas Germany used only 300 kWh.", "why": "while/whereas joins two full clauses and signals real contrast."}, {"id": "5", "answer": "While the figure for Group A rose considerably, that for Group B remained stable.", "why": "while/whereas joins two full clauses and signals real contrast."}, {"id": "6", "answer": "Australia recorded 68%, whereas India accounted for only 24%.", "why": "while/whereas joins two full clauses and signals real contrast."}], "mode": "writing", "count": 6, "choices": [], "labels": ["Câu 1", "Câu 2", "Câu 3", "Câu 4", "Câu 5", "Câu 6"], "objective": false, "objectiveCount": 0, "expected": []}, {"id": "EX09", "number": 9, "title": "Join the contrast", "body": "Instructions: Combine each pair using but. Then rewrite item 1 using whereas.\nSales increased in France. They declined in Germany.\nCar ownership was high among adults. It was relatively low among young people.\nThe percentage rose initially. It fell towards the end of the period.\nMen accounted for 60% of employees. They represented only 35% of managers.\nElectricity consumption increased. Water use remained unchanged.\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________", "key": "1  Đáp án: Sales increased in France, but they declined in Germany.\nGiải thích: but sits between coordinated clauses. No comma after but in these patterns.\n2  Đáp án: Car ownership was high among adults, but it was relatively low among young people.\nGiải thích: but sits between coordinated clauses. No comma after but in these patterns.\n3  Đáp án: The percentage rose initially, but it fell towards the end of the period.\nGiải thích: but sits between coordinated clauses. No comma after but in these patterns.\n4  Đáp án: Men accounted for 60% of employees, but they represented only 35% of managers.\nGiải thích: but sits between coordinated clauses. No comma after but in these patterns.\n5  Đáp án: Electricity consumption increased, but water use remained unchanged.\nGiải thích: but sits between coordinated clauses. No comma after but in these patterns.\nModel answer: Whereas sales increased in France, they declined in Germany.\nGiải thích: Whereas can open a dependent contrast clause; but coordinates two clauses in the middle.", "answers": [{"id": "1", "answer": "Sales increased in France, but they declined in Germany.", "why": "but sits between coordinated clauses. No comma after but in these patterns."}, {"id": "2", "answer": "Car ownership was high among adults, but it was relatively low among young people.", "why": "but sits between coordinated clauses. No comma after but in these patterns."}, {"id": "3", "answer": "The percentage rose initially, but it fell towards the end of the period.", "why": "but sits between coordinated clauses. No comma after but in these patterns."}, {"id": "4", "answer": "Men accounted for 60% of employees, but they represented only 35% of managers.", "why": "but sits between coordinated clauses. No comma after but in these patterns."}, {"id": "5", "answer": "Electricity consumption increased, but water use remained unchanged.", "why": "but sits between coordinated clauses. No comma after but in these patterns."}, {"id": "rewrite", "answer": "Whereas sales increased in France, they declined in Germany.", "why": "Whereas can open a dependent contrast clause; but coordinates two clauses in the middle."}], "mode": "writing", "count": 6, "choices": [], "labels": ["Câu 1: dùng but", "Câu 2: dùng but", "Câu 3: dùng but", "Câu 4: dùng but", "Câu 5: dùng but", "Viết lại câu 1 bằng whereas"], "objective": false, "objectiveCount": 0, "expected": []}, {"id": "EX10", "number": 10, "title": "Despite + V-ing / Noun Phrase", "body": "Instructions: Combine each pair using Despite + V-ing or a noun phrase.\nSales declined slightly. They remained above 50,000.\nThe percentage increased. It was still lower than the figure for France.\nCar ownership fell. It remained the most common form of transport.\nThe number fluctuated considerably. It ended the period at approximately its starting level.\nSpending increased. It still accounted for the smallest proportion.\nThe rate recovered. It remained below the 2010 figure.\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________", "key": "1  Đáp án: Despite declining slightly, sales remained above 50,000.\nGiải thích: Despite introduces concession: an apparently opposing fact does not prevent the main-clause result.\n2  Đáp án: Despite increasing, the percentage was still lower than the figure for France.\nGiải thích: Despite introduces concession: an apparently opposing fact does not prevent the main-clause result.\n3  Đáp án: Despite falling, car ownership remained the most common form of transport.\nGiải thích: Despite introduces concession: an apparently opposing fact does not prevent the main-clause result.\n4  Đáp án: Despite fluctuating considerably, the number ended the period at approximately its starting level.\nGiải thích: Despite introduces concession: an apparently opposing fact does not prevent the main-clause result.\n5  Đáp án: Despite increasing, spending still accounted for the smallest proportion.\nGiải thích: Despite introduces concession: an apparently opposing fact does not prevent the main-clause result.\n6  Đáp án: Despite recovering, the rate remained below the 2010 figure.\nGiải thích: Despite introduces concession: an apparently opposing fact does not prevent the main-clause result.", "answers": [{"id": "1", "answer": "Despite declining slightly, sales remained above 50,000.", "why": "Despite introduces concession: an apparently opposing fact does not prevent the main-clause result."}, {"id": "2", "answer": "Despite increasing, the percentage was still lower than the figure for France.", "why": "Despite introduces concession: an apparently opposing fact does not prevent the main-clause result."}, {"id": "3", "answer": "Despite falling, car ownership remained the most common form of transport.", "why": "Despite introduces concession: an apparently opposing fact does not prevent the main-clause result."}, {"id": "4", "answer": "Despite fluctuating considerably, the number ended the period at approximately its starting level.", "why": "Despite introduces concession: an apparently opposing fact does not prevent the main-clause result."}, {"id": "5", "answer": "Despite increasing, spending still accounted for the smallest proportion.", "why": "Despite introduces concession: an apparently opposing fact does not prevent the main-clause result."}, {"id": "6", "answer": "Despite recovering, the rate remained below the 2010 figure.", "why": "Despite introduces concession: an apparently opposing fact does not prevent the main-clause result."}], "mode": "writing", "count": 6, "choices": [], "labels": ["Câu 1", "Câu 2", "Câu 3", "Câu 4", "Câu 5", "Câu 6"], "objective": false, "objectiveCount": 0, "expected": []}, {"id": "EX11", "number": 11, "title": "Correct the structure", "body": "Instructions: Rewrite every sentence accurately.\nDespite the figure increased, it remained low.\nDespite sales were falling, they remained above 50,000.\nDespite of declining, the figure remained the highest.\nDespite it fell considerably, the rate recovered.\nDespite was lower, the percentage increased.\nDespite a decline, but the figure remained high.\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________", "key": "1  Đáp án: Despite increasing, the figure remained low. / Despite the increase, the figure remained low.\nGiải thích: Despite + V-ing/noun phrase, not finite clause.\n2  Đáp án: Despite falling, sales remained above 50,000.\nGiải thích: Remove “were”.\n3  Đáp án: Despite declining, the figure remained the highest.\nGiải thích: No “of” after despite.\n4  Đáp án: Despite falling considerably, the rate recovered.\nGiải thích: Use V-ing.\n5  Đáp án: Despite being lower, the percentage increased.\nGiải thích: Need V-ing phrase “being lower”.\n6  Đáp án: Despite a decline, the figure remained high.\nGiải thích: Do not use both despite and but in same basic pattern.", "answers": [{"id": "1", "answer": "Despite increasing, the figure remained low. / Despite the increase, the figure remained low.", "why": "Despite + V-ing/noun phrase, not finite clause."}, {"id": "2", "answer": "Despite falling, sales remained above 50,000.", "why": "Remove “were”."}, {"id": "3", "answer": "Despite declining, the figure remained the highest.", "why": "No “of” after despite."}, {"id": "4", "answer": "Despite falling considerably, the rate recovered.", "why": "Use V-ing."}, {"id": "5", "answer": "Despite being lower, the percentage increased.", "why": "Need V-ing phrase “being lower”."}, {"id": "6", "answer": "Despite a decline, the figure remained high.", "why": "Do not use both despite and but in same basic pattern."}], "mode": "writing", "count": 6, "choices": [], "labels": ["Câu 1", "Câu 2", "Câu 3", "Câu 4", "Câu 5", "Câu 6"], "objective": false, "objectiveCount": 0, "expected": []}, {"id": "EX12", "number": 12, "title": "Then / Following that / After that", "body": "Instructions: Choose a suitable time connector and keep the information as TWO sentences. Do not use Then for every item.\nThe figure declined to 20%. ______, it recovered considerably.\nSales peaked in 2015. ______, they fell for three consecutive years.\nThe rate remained stable until 2018. ______, it increased to 12%.\nElectricity use declined initially. ______, it remained unchanged.\nThe percentage reached its lowest point in 2010. ______, it rose steadily.", "key": "1  Đáp án: The figure declined to 20%. After that, it recovered considerably.\nGiải thích: Sentence connector starts the second sentence and marks chronology. Other time connector choices may also be accepted if logical.\n2  Đáp án: Sales peaked in 2015. Following that, they fell for three consecutive years.\nGiải thích: Sentence connector starts the second sentence and marks chronology. Other time connector choices may also be accepted if logical.\n3  Đáp án: The rate remained stable until 2018. Then, it increased to 12%.\nGiải thích: Sentence connector starts the second sentence and marks chronology. Other time connector choices may also be accepted if logical.\n4  Đáp án: Electricity use declined initially. After that, it remained unchanged.\nGiải thích: Sentence connector starts the second sentence and marks chronology. Other time connector choices may also be accepted if logical.\n5  Đáp án: The percentage reached its lowest point in 2010. Following that, it rose steadily.\nGiải thích: Sentence connector starts the second sentence and marks chronology. Other time connector choices may also be accepted if logical.", "answers": [{"id": "1", "answer": "The figure declined to 20%. After that, it recovered considerably.", "why": "Sentence connector starts the second sentence and marks chronology. Other time connector choices may also be accepted if logical."}, {"id": "2", "answer": "Sales peaked in 2015. Following that, they fell for three consecutive years.", "why": "Sentence connector starts the second sentence and marks chronology. Other time connector choices may also be accepted if logical."}, {"id": "3", "answer": "The rate remained stable until 2018. Then, it increased to 12%.", "why": "Sentence connector starts the second sentence and marks chronology. Other time connector choices may also be accepted if logical."}, {"id": "4", "answer": "Electricity use declined initially. After that, it remained unchanged.", "why": "Sentence connector starts the second sentence and marks chronology. Other time connector choices may also be accepted if logical."}, {"id": "5", "answer": "The percentage reached its lowest point in 2010. Following that, it rose steadily.", "why": "Sentence connector starts the second sentence and marks chronology. Other time connector choices may also be accepted if logical."}], "mode": "writing", "count": 5, "choices": [], "labels": ["Câu 1", "Câu 2", "Câu 3", "Câu 4", "Câu 5"], "objective": false, "objectiveCount": 0, "expected": []}, {"id": "EX13", "number": 13, "title": "However / In contrast / By contrast", "body": "Instructions: For each data set, write different TWO-sentence versions using the three connectors.\nDATA 1: France = 70%; Germany = 35%\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\nDATA 2: Men = 65%; Women = 40%\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________", "key": "Model answer: France recorded 70%. However, Germany accounted for only 35%. / France recorded 70%. In contrast, Germany accounted for only 35%. / France recorded 70%. By contrast, Germany accounted for only 35%.\nGiải thích: All three mark contrast between separate sentences; punctuation after connector is important.\nModel answer: Men accounted for 65%. However/In contrast/By contrast, women represented only 40%.\nGiải thích: Any of the three is acceptable; avoid unnecessary repetition in one paragraph.", "answers": [{"id": "1-However", "answer": "France recorded 70%. However, Germany accounted for only 35%.", "why": "Dữ liệu tương phản; từ nối mở câu thứ hai và cần dấu phẩy."}, {"id": "1-In contrast", "answer": "France recorded 70%. In contrast, Germany accounted for only 35%.", "why": "Dữ liệu tương phản; từ nối mở câu thứ hai và cần dấu phẩy."}, {"id": "1-By contrast", "answer": "France recorded 70%. By contrast, Germany accounted for only 35%.", "why": "Dữ liệu tương phản; từ nối mở câu thứ hai và cần dấu phẩy."}, {"id": "2-However", "answer": "Men accounted for 65%. However, women represented only 40%.", "why": "Dữ liệu tương phản; từ nối mở câu thứ hai và cần dấu phẩy."}, {"id": "2-In contrast", "answer": "Men accounted for 65%. In contrast, women represented only 40%.", "why": "Dữ liệu tương phản; từ nối mở câu thứ hai và cần dấu phẩy."}, {"id": "2-By contrast", "answer": "Men accounted for 65%. By contrast, women represented only 40%.", "why": "Dữ liệu tương phản; từ nối mở câu thứ hai và cần dấu phẩy."}], "mode": "writing", "count": 6, "choices": [], "labels": ["Data 1: dùng However", "Data 1: dùng In contrast", "Data 1: dùng By contrast", "Data 2: dùng However", "Data 2: dùng In contrast", "Data 2: dùng By contrast"], "objective": false, "objectiveCount": 0, "expected": []}, {"id": "EX14", "number": 14, "title": "Punctuation & structure", "body": "Instructions: Choose the grammatically correct sentence, then complete the rewrite.\nA. France recorded 70%, however Germany recorded 35%.\nB. France recorded 70%. However, Germany recorded 35%.\nC. France recorded 70% however, Germany recorded 35%.\nA. Sales increased, but profits declined.\nB. Sales increased. But, profits declined.\nC. Sales increased but. Profits declined.\nA. The figure rose. In contrast, the other category declined.\nB. The figure rose, in contrast the other category declined.\nC. The figure rose in contrast, the other category declined.\nRewrite “Sales increased, but profits declined.” using However:\n________________________________________________________________________________", "key": "1  Đáp án: B\nGiải thích: However is a sentence connector here: period + However, ...\n2  Đáp án: A\nGiải thích: but coordinates clauses: comma + but + clause.\n3  Đáp án: A\nGiải thích: In contrast starts a new sentence in the taught pattern.\nModel answer: Sales increased. However, profits declined.\nGiải thích: Same contrast, but now two sentences rather than one coordinated sentence.", "answers": [{"id": "1", "answer": "B", "why": "However is a sentence connector here: period + However, ..."}, {"id": "2", "answer": "A", "why": "but coordinates clauses: comma + but + clause."}, {"id": "3", "answer": "A", "why": "In contrast starts a new sentence in the taught pattern."}], "mode": "choice", "count": 4, "choices": ["A", "B", "C"], "labels": ["Nhóm 1", "Nhóm 2", "Nhóm 3", "Viết lại câu với However"], "objective": true, "objectiveCount": 3, "expected": ["B", "A", "A"]}, {"id": "EX15", "number": 15, "title": "Similarly / Likewise", "body": "Instructions: Rewrite each pair as TWO cohesive sentences.\nCar ownership was high in Canada. It was also high in Australia.\nFood accounted for 30% in Group A. It represented a similar proportion in Group B.\nMale participation remained stable. Female participation also changed very little.\nThe figure for France declined. Germany experienced a similar decrease.\nElectricity use was approximately 500 kWh in Country A. A comparable figure was recorded in Country B.\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________", "key": "1  Đáp án: Car ownership was high in Canada. Similarly, it was high in Australia.\nGiải thích: Similarity connector is justified because direction/level is comparable.\n2  Đáp án: Food accounted for 30% in Group A. Likewise, it represented a similar proportion in Group B.\nGiải thích: Similarity connector is justified because direction/level is comparable.\n3  Đáp án: Male participation remained stable. Similarly, female participation changed very little.\nGiải thích: Similarity connector is justified because direction/level is comparable.\n4  Đáp án: The figure for France declined. Likewise, Germany experienced a similar decrease.\nGiải thích: Similarity connector is justified because direction/level is comparable.\n5  Đáp án: Electricity use was approximately 500 kWh in Country A. Similarly, a comparable figure was recorded in Country B.\nGiải thích: Similarity connector is justified because direction/level is comparable.", "answers": [{"id": "1", "answer": "Car ownership was high in Canada. Similarly, it was high in Australia.", "why": "Similarity connector is justified because direction/level is comparable."}, {"id": "2", "answer": "Food accounted for 30% in Group A. Likewise, it represented a similar proportion in Group B.", "why": "Similarity connector is justified because direction/level is comparable."}, {"id": "3", "answer": "Male participation remained stable. Similarly, female participation changed very little.", "why": "Similarity connector is justified because direction/level is comparable."}, {"id": "4", "answer": "The figure for France declined. Likewise, Germany experienced a similar decrease.", "why": "Similarity connector is justified because direction/level is comparable."}, {"id": "5", "answer": "Electricity use was approximately 500 kWh in Country A. Similarly, a comparable figure was recorded in Country B.", "why": "Similarity connector is justified because direction/level is comparable."}], "mode": "writing", "count": 5, "choices": [], "labels": ["Câu 1", "Câu 2", "Câu 3", "Câu 4", "Câu 5"], "objective": false, "objectiveCount": 0, "expected": []}, {"id": "EX16", "number": 16, "title": "Is the connector logical?", "body": "Instructions: Write ✓ or ✕. If illogical, replace the connector.\nSales increased from 20,000 to 50,000. After that, they reached 60,000.\nFrance recorded 70%. Similarly, Germany recorded 30%.\nMen accounted for 45%. Likewise, women represented 46%.\nThe rate fell considerably. However, the number of tourists also declined considerably.\nCar use increased. By contrast, bus use decreased.\nSales peaked in 2015. After that, they declined.\nFrance and Germany both recorded approximately 40%. In contrast, the figures were almost identical.\nThe number of users fell. Similarly, the percentage of subscribers declined.", "key": "1  Đáp án: ✓\nGiải thích: chronological continuation.\n2  Đáp án: ✗ → By contrast/However\nGiải thích: 70 vs 30 is contrast, not similarity.\n3  Đáp án: ✓\nGiải thích: 45 and 46 are similar.\n4  Đáp án: ✗ → Similarly/Likewise\nGiải thích: both declined, so relationship is similarity, not contrast.\n5  Đáp án: ✓\nGiải thích: increase vs decrease is contrast.\n6  Đáp án: ✓\nGiải thích: peak followed by decline is time sequence.\n7  Đáp án: ✗ → Similarly/Likewise, or omit connector\nGiải thích: almost identical = similarity.\n8  Đáp án: ✓\nGiải thích: both measures declined.", "answers": [{"id": "1", "answer": "✓", "why": "chronological continuation."}, {"id": "2", "answer": "✗ → By contrast/However", "why": "70 vs 30 is contrast, not similarity."}, {"id": "3", "answer": "✓", "why": "45 and 46 are similar."}, {"id": "4", "answer": "✗ → Similarly/Likewise", "why": "both declined, so relationship is similarity, not contrast."}, {"id": "5", "answer": "✓", "why": "increase vs decrease is contrast."}, {"id": "6", "answer": "✓", "why": "peak followed by decline is time sequence."}, {"id": "7", "answer": "✗ → Similarly/Likewise, or omit connector", "why": "almost identical = similarity."}, {"id": "8", "answer": "✓", "why": "both measures declined."}], "mode": "mixed", "count": 8, "choices": ["✓", "✕"], "labels": ["Câu 1", "Câu 2", "Câu 3", "Câu 4", "Câu 5", "Câu 6", "Câu 7", "Câu 8"], "objective": false, "objectiveCount": 0, "expected": []}, {"id": "EX17", "number": 17, "title": "Avoid subject repetition", "body": "Instructions: Rewrite using this figure where appropriate.\nThe number of visitors reached 2 million. The number of visitors then remained stable.\nThe percentage of women was 55%. The percentage of women subsequently increased to 62%.\nCar ownership stood at 70%. Car ownership then declined slightly.\nCoal accounted for 40% of energy production. The percentage for coal fell to 30%.\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________", "key": "1  Đáp án: The number of visitors reached 2 million. This figure then remained stable.\nGiải thích: Same data series → this figure prevents mechanical repetition.\n2  Đáp án: The percentage of women was 55%. This figure subsequently increased to 62%.\nGiải thích: Same data series → this figure prevents mechanical repetition.\n3  Đáp án: Car ownership stood at 70%. This figure then declined slightly.\nGiải thích: Same data series → this figure prevents mechanical repetition.\n4  Đáp án: Coal accounted for 40% of energy production. This figure fell to 30%.\nGiải thích: Same data series → this figure prevents mechanical repetition.", "answers": [{"id": "1", "answer": "The number of visitors reached 2 million. This figure then remained stable.", "why": "Same data series → this figure prevents mechanical repetition."}, {"id": "2", "answer": "The percentage of women was 55%. This figure subsequently increased to 62%.", "why": "Same data series → this figure prevents mechanical repetition."}, {"id": "3", "answer": "Car ownership stood at 70%. This figure then declined slightly.", "why": "Same data series → this figure prevents mechanical repetition."}, {"id": "4", "answer": "Coal accounted for 40% of energy production. This figure fell to 30%.", "why": "Same data series → this figure prevents mechanical repetition."}], "mode": "writing", "count": 4, "choices": [], "labels": ["Câu 1", "Câu 2", "Câu 3", "Câu 4"], "objective": false, "objectiveCount": 0, "expected": []}, {"id": "EX18", "number": 18, "title": "Change the subject", "body": "Instructions: Combine each data pair naturally using the figure for...\nMen = 70%; women = 50%.\nCanada = 62%; Australia = 75%.\nCars = 55%; buses = 25%.\nGroup A = 48%; Group B = 47%.\nCoal = 40%; solar = 15%.\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________", "key": "1  Đáp án: Men recorded 70%, whereas the figure for women was 50%.\nGiải thích: When switching entity, “the figure for + entity” makes the reference explicit.\n2  Đáp án: Canada recorded 62%, whereas the figure for Australia was 75%.\nGiải thích: When switching entity, “the figure for + entity” makes the reference explicit.\n3  Đáp án: Cars accounted for 55%, while the figure for buses was 25%.\nGiải thích: When switching entity, “the figure for + entity” makes the reference explicit.\n4  Đáp án: Group A recorded 48%, while the figure for Group B was 47%.\nGiải thích: When switching entity, “the figure for + entity” makes the reference explicit.\n5  Đáp án: Coal accounted for 40%, whereas the figure for solar was 15%.\nGiải thích: When switching entity, “the figure for + entity” makes the reference explicit.", "answers": [{"id": "1", "answer": "Men recorded 70%, whereas the figure for women was 50%.", "why": "When switching entity, “the figure for + entity” makes the reference explicit."}, {"id": "2", "answer": "Canada recorded 62%, whereas the figure for Australia was 75%.", "why": "When switching entity, “the figure for + entity” makes the reference explicit."}, {"id": "3", "answer": "Cars accounted for 55%, while the figure for buses was 25%.", "why": "When switching entity, “the figure for + entity” makes the reference explicit."}, {"id": "4", "answer": "Group A recorded 48%, while the figure for Group B was 47%.", "why": "When switching entity, “the figure for + entity” makes the reference explicit."}, {"id": "5", "answer": "Coal accounted for 40%, whereas the figure for solar was 15%.", "why": "When switching entity, “the figure for + entity” makes the reference explicit."}], "mode": "writing", "count": 5, "choices": [], "labels": ["Câu 1", "Câu 2", "Câu 3", "Câu 4", "Câu 5"], "objective": false, "objectiveCount": 0, "expected": []}, {"id": "EX19", "number": 19, "title": "Clause vs Sentence Connector", "body": "Instructions: For each pair, write (1) ONE sentence with a clause connector and (2) TWO sentences with a sentence connector.\nFrance recorded 70%. Germany recorded 35%.\nSales rose until 2015. They declined afterwards.\nMen accounted for 45%. Women recorded approximately the same percentage.\nCar use increased. Bus use declined.\nThe rate peaked at 12%. It subsequently fell.\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________", "key": "1  Đáp án: Whereas France recorded 70%, Germany recorded 35%. / France recorded 70%. By contrast, Germany recorded 35%.\nGiải thích: Version 1 = one sentence; version 2 = two sentences. Relationship stays unchanged.\n2  Đáp án: Sales rose until 2015 before declining afterwards. / Sales rose until 2015. After that, they declined.\nGiải thích: Version 1 = one sentence; version 2 = two sentences. Relationship stays unchanged.\n3  Đáp án: Men accounted for 45%, while women recorded approximately the same percentage. / Men accounted for 45%. Similarly, women recorded approximately the same percentage.\nGiải thích: Version 1 = one sentence; version 2 = two sentences. Relationship stays unchanged.\n4  Đáp án: While car use increased, bus use declined. / Car use increased. By contrast, bus use declined.\nGiải thích: Version 1 = one sentence; version 2 = two sentences. Relationship stays unchanged.\n5  Đáp án: After peaking at 12%, the rate fell. / The rate peaked at 12%. Following that, it fell.\nGiải thích: Version 1 = one sentence; version 2 = two sentences. Relationship stays unchanged.", "answers": [{"id": "1a", "answer": "Whereas France recorded 70%, Germany recorded 35%.", "why": "Version 1 = one sentence; version 2 = two sentences. Relationship stays unchanged."}, {"id": "1b", "answer": "France recorded 70%. By contrast, Germany recorded 35%.", "why": "Version 1 = one sentence; version 2 = two sentences. Relationship stays unchanged."}, {"id": "2a", "answer": "Sales rose until 2015 before declining afterwards.", "why": "Version 1 = one sentence; version 2 = two sentences. Relationship stays unchanged."}, {"id": "2b", "answer": "Sales rose until 2015. After that, they declined.", "why": "Version 1 = one sentence; version 2 = two sentences. Relationship stays unchanged."}, {"id": "3a", "answer": "Men accounted for 45%, while women recorded approximately the same percentage.", "why": "Version 1 = one sentence; version 2 = two sentences. Relationship stays unchanged."}, {"id": "3b", "answer": "Men accounted for 45%. Similarly, women recorded approximately the same percentage.", "why": "Version 1 = one sentence; version 2 = two sentences. Relationship stays unchanged."}, {"id": "4a", "answer": "While car use increased, bus use declined.", "why": "Version 1 = one sentence; version 2 = two sentences. Relationship stays unchanged."}, {"id": "4b", "answer": "Car use increased. By contrast, bus use declined.", "why": "Version 1 = one sentence; version 2 = two sentences. Relationship stays unchanged."}, {"id": "5a", "answer": "After peaking at 12%, the rate fell.", "why": "Version 1 = one sentence; version 2 = two sentences. Relationship stays unchanged."}, {"id": "5b", "answer": "The rate peaked at 12%. Following that, it fell.", "why": "Version 1 = one sentence; version 2 = two sentences. Relationship stays unchanged."}], "mode": "writing", "count": 10, "choices": [], "labels": ["Cặp 1: một câu với clause connector", "Cặp 1: hai câu với sentence connector", "Cặp 2: một câu với clause connector", "Cặp 2: hai câu với sentence connector", "Cặp 3: một câu với clause connector", "Cặp 3: hai câu với sentence connector", "Cặp 4: một câu với clause connector", "Cặp 4: hai câu với sentence connector", "Cặp 5: một câu với clause connector", "Cặp 5: hai câu với sentence connector"], "objective": false, "objectiveCount": 0, "expected": []}, {"id": "EX20", "number": 20, "title": "Same information, different cohesion", "body": "Instructions: DATA: Sales 30 → 50 → 40. Write versions using and then, after, before, then, and after that. Keep the data and chronology unchanged.\nand then: _____________________________________________________________________________\nafter: _____________________________________________________________________________\nbefore: _____________________________________________________________________________\nthen: _____________________________________________________________________________\nafter that: _____________________________________________________________________________", "key": "1  Đáp án: Sales rose from 30 to 50 and then fell to 40.\nGiải thích: All preserve the same chronology 30→50→40; only cohesion changes.\n2  Đáp án: After rising from 30 to 50, sales fell to 40.\nGiải thích: All preserve the same chronology 30→50→40; only cohesion changes.\n3  Đáp án: Sales rose from 30 to 50 before falling to 40.\nGiải thích: All preserve the same chronology 30→50→40; only cohesion changes.\n4  Đáp án: Sales rose from 30 to 50. Then, they fell to 40.\nGiải thích: All preserve the same chronology 30→50→40; only cohesion changes.\n5  Đáp án: Sales rose from 30 to 50. After that, they fell to 40.\nGiải thích: All preserve the same chronology 30→50→40; only cohesion changes.", "answers": [{"id": "1", "answer": "Sales rose from 30 to 50 and then fell to 40.", "why": "All preserve the same chronology 30→50→40; only cohesion changes."}, {"id": "2", "answer": "After rising from 30 to 50, sales fell to 40.", "why": "All preserve the same chronology 30→50→40; only cohesion changes."}, {"id": "3", "answer": "Sales rose from 30 to 50 before falling to 40.", "why": "All preserve the same chronology 30→50→40; only cohesion changes."}, {"id": "4", "answer": "Sales rose from 30 to 50. Then, they fell to 40.", "why": "All preserve the same chronology 30→50→40; only cohesion changes."}, {"id": "5", "answer": "Sales rose from 30 to 50. After that, they fell to 40.", "why": "All preserve the same chronology 30→50→40; only cohesion changes."}], "mode": "writing", "count": 5, "choices": [], "labels": ["and then", "after", "before", "then", "after that"], "objective": false, "objectiveCount": 0, "expected": []}, {"id": "EX21", "number": 21, "title": "Improve the paragraph", "body": "Instructions: Rewrite the paragraph in 2–3 natural sentences without changing the data. Use this figure plus suitable time cohesion.\nThe percentage of car users was 60%. The percentage of car users then increased to 70%. The percentage of car users remained at 70%. The percentage of car users then declined to 55%.\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________", "key": "Model answer: The percentage of car users was 60% before increasing to 70%. This figure then remained unchanged at 70% before declining to 55%.\nGiải thích: Reference + clause compression reduces four repetitive sentences to two without losing data.", "answers": [{"id": "model", "answer": "The percentage of car users was 60% before increasing to 70%. This figure then remained unchanged at 70% before declining to 55%.", "why": "Reference + clause compression reduces four repetitive sentences to two without losing data."}], "mode": "writing", "count": 1, "choices": [], "labels": ["Bài làm"], "objective": false, "objectiveCount": 0, "expected": []}, {"id": "EX22", "number": 22, "title": "Delete unnecessary connectors", "body": "Instructions: Cross out unnecessary connectors and rewrite the paragraph more naturally.\nFirstly, the figure stood at 40%. Then, it increased to 50%. After that, however, it remained stable. Following that, then, it declined to 45%. However, after that, it increased again.\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________", "key": "Model answer: The figure stood at 40% before increasing to 50%. It then remained stable and subsequently declined to 45%, before increasing again.\nGiải thích: Removed stacking such as “After that, however” and “Following that, then”. A connector should carry one clear relationship, not decorate every sentence.", "answers": [{"id": "model", "answer": "The figure stood at 40% before increasing to 50%. It then remained stable and subsequently declined to 45%, before increasing again.", "why": "Removed stacking such as “After that, however” and “Following that, then”. A connector should carry one clear relationship, not decorate every sentence."}], "mode": "writing", "count": 1, "choices": [], "labels": ["Bài làm"], "objective": false, "objectiveCount": 0, "expected": []}, {"id": "EX23", "number": 23, "title": "Correct every error", "body": "Instructions: Correct grammar, punctuation, and/or discourse logic.\nAfter the figure increased, falling to 20%.\nAfter increased to 50%, sales remained stable.\nFrance recorded 70%, however Germany recorded 40%.\nDespite sales increased, profits fell.\nWhile France was 70%. Germany was 40%.\nThe figure declined. But, it later recovered.\nSales increased. Similarly, profits decreased.\nFrance recorded 60%. By contrast, Germany also recorded 60%.\nAfter to reach 50%, the figure declined.\nDespite of falling, sales remained high.\nA increased, whereas B also increased in exactly the same way.\nThe figure peaked. Similarly, it then declined.\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________", "key": "1  Đáp án: After increasing, the figure fell to 20%.\nGiải thích: Original is a fragment/illogical participle attachment.\n2  Đáp án: After increasing to 50%, sales remained stable.\nGiải thích: After + V-ing.\n3  Đáp án: France recorded 70%. However, Germany recorded 40%.\nGiải thích: However as sentence connector; comma splice removed.\n4  Đáp án: Despite increasing, sales fell. / Despite an increase in sales, profits fell.\nGiải thích: Despite + V-ing/noun phrase; also ensure subject meaning is logical.\n5  Đáp án: While France was at 70%, Germany was at 40%.\nGiải thích: While must join both clauses in one sentence.\n6  Đáp án: The figure declined, but it later recovered. / The figure declined. However, it later recovered.\nGiải thích: Do not use “But,” as taught sentence connector.\n7  Đáp án: Sales increased. By contrast, profits decreased.\nGiải thích: increase vs decrease = contrast, not similarity.\n8  Đáp án: France recorded 60%. Similarly, Germany also recorded 60%.\nGiải thích: same value = similarity.\n9  Đáp án: After reaching 50%, the figure declined.\nGiải thích: After + V-ing, not to-infinitive.\n10  Đáp án: Despite falling, sales remained high.\nGiải thích: No “of”.\n11  Đáp án: A increased, and B increased in exactly the same way. / A increased. Similarly, B increased.\nGiải thích: Same movement = similarity, not whereas contrast.\n12  Đáp án: The figure peaked and then declined. / After peaking, the figure declined.\nGiải thích: Peak→decline is time sequence, not similarity.", "answers": [{"id": "1", "answer": "After increasing, the figure fell to 20%.", "why": "Original is a fragment/illogical participle attachment."}, {"id": "2", "answer": "After increasing to 50%, sales remained stable.", "why": "After + V-ing."}, {"id": "3", "answer": "France recorded 70%. However, Germany recorded 40%.", "why": "However as sentence connector; comma splice removed."}, {"id": "4", "answer": "Despite increasing, sales fell. / Despite an increase in sales, profits fell.", "why": "Despite + V-ing/noun phrase; also ensure subject meaning is logical."}, {"id": "5", "answer": "While France was at 70%, Germany was at 40%.", "why": "While must join both clauses in one sentence."}, {"id": "6", "answer": "The figure declined, but it later recovered. / The figure declined. However, it later recovered.", "why": "Do not use “But,” as taught sentence connector."}, {"id": "7", "answer": "Sales increased. By contrast, profits decreased.", "why": "increase vs decrease = contrast, not similarity."}, {"id": "8", "answer": "France recorded 60%. Similarly, Germany also recorded 60%.", "why": "same value = similarity."}, {"id": "9", "answer": "After reaching 50%, the figure declined.", "why": "After + V-ing, not to-infinitive."}, {"id": "10", "answer": "Despite falling, sales remained high.", "why": "No “of”."}, {"id": "11", "answer": "A increased, and B increased in exactly the same way. / A increased. Similarly, B increased.", "why": "Same movement = similarity, not whereas contrast."}, {"id": "12", "answer": "The figure peaked and then declined. / After peaking, the figure declined.", "why": "Peak→decline is time sequence, not similarity."}], "mode": "writing", "count": 12, "choices": [], "labels": ["Câu 1", "Câu 2", "Câu 3", "Câu 4", "Câu 5", "Câu 6", "Câu 7", "Câu 8", "Câu 9", "Câu 10", "Câu 11", "Câu 12"], "objective": false, "objectiveCount": 0, "expected": []}, {"id": "EX24", "number": 24, "title": "One-best-answer", "body": "Instructions: Choose the best answer.\n1. Sales rose to 50,000. ______, they declined to 40,000.\n   A. Similarly   B. After that   C. In contrast   D. Whereas\n2. France recorded 70%. ______, Germany accounted for only 30%.\n   A. Following that   B. Likewise   C. By contrast   D. Then\n3. Men accounted for 45%. ______, women represented 46%.\n   A. Similarly   B. However   C. After that   D. Despite\n4. ______ reaching 80%, the figure declined.\n   A. However   B. After   C. Similarly   D. Whereas\n5. Car use increased, ______ bus use declined.\n   A. however   B. similarly   C. whereas   D. after that\n6. ______ declining slightly, the figure remained the highest.\n   A. However   B. Despite   C. Whereas   D. Then\n7. The rate remained stable ______ rising considerably.\n   A. however   B. before   C. similarly   D. in contrast\n8. Sales rose in France. ______, they increased in Germany.\n   A. Likewise   B. In contrast   C. However   D. Despite", "key": "1  Đáp án: B\nGiải thích: second event follows first in time.\n2  Đáp án: C\nGiải thích: 70 vs 30 contrast.\n3  Đáp án: A\nGiải thích: 45 vs 46 similarity.\n4  Đáp án: B\nGiải thích: After + reaching.\n5  Đáp án: C\nGiải thích: whereas joins contrasting clauses.\n6  Đáp án: B\nGiải thích: Despite + declining.\n7  Đáp án: B\nGiải thích: stable happens before rise.\n8  Đáp án: A\nGiải thích: both rose → similarity.", "answers": [{"id": "1", "answer": "B", "why": "second event follows first in time."}, {"id": "2", "answer": "C", "why": "70 vs 30 contrast."}, {"id": "3", "answer": "A", "why": "45 vs 46 similarity."}, {"id": "4", "answer": "B", "why": "After + reaching."}, {"id": "5", "answer": "C", "why": "whereas joins contrasting clauses."}, {"id": "6", "answer": "B", "why": "Despite + declining."}, {"id": "7", "answer": "B", "why": "stable happens before rise."}, {"id": "8", "answer": "A", "why": "both rose → similarity."}], "mode": "choice", "count": 8, "choices": ["A", "B", "C", "D"], "labels": ["Câu 1", "Câu 2", "Câu 3", "Câu 4", "Câu 5", "Câu 6", "Câu 7", "Câu 8"], "objective": true, "objectiveCount": 8, "expected": ["B", "C", "A", "B", "C", "B", "B", "A"]}, {"id": "EX25", "number": 25, "title": "Dynamic Data", "body": "Instructions: Write the required cohesive sentences without changing chronology.\n[TABLE]\nYEAR | A\n2000 | 20%\n2005 | 40%\n2010 | 40%\n2015 | 30%\n2020 | 55%\n• one sentence with after\n________________________________________________________________________________\n• one sentence with before\n________________________________________________________________________________\n• one sentence with and then\n________________________________________________________________________________\n• two sentences linked by After that / Following that\n________________________________________________________________________________\n• one sentence using this figure\n________________________________________________________________________________", "key": "after  Đáp án: After rising from 20% in 2000 to 40% in 2005, A remained unchanged at 40% until 2010.\nGiải thích: Chronology follows 20→40→40→30→55.\nbefore  Đáp án: A remained stable at 40% in 2010 before falling to 30% in 2015.\nGiải thích: Chronology follows 20→40→40→30→55.\nand then  Đáp án: A fell to 30% in 2015 and then rose to 55% in 2020.\nGiải thích: Chronology follows 20→40→40→30→55.\nsentence connector  Đáp án: A declined to 30% in 2015. After that, it increased to 55% in 2020.\nGiải thích: Chronology follows 20→40→40→30→55.\nthis figure  Đáp án: A stood at 40% in 2010. This figure fell to 30% in 2015.\nGiải thích: Chronology follows 20→40→40→30→55.", "answers": [{"id": "after", "answer": "After rising from 20% in 2000 to 40% in 2005, A remained unchanged at 40% until 2010.", "why": "Chronology follows 20→40→40→30→55."}, {"id": "before", "answer": "A remained stable at 40% in 2010 before falling to 30% in 2015.", "why": "Chronology follows 20→40→40→30→55."}, {"id": "and then", "answer": "A fell to 30% in 2015 and then rose to 55% in 2020.", "why": "Chronology follows 20→40→40→30→55."}, {"id": "sentence connector", "answer": "A declined to 30% in 2015. After that, it increased to 55% in 2020.", "why": "Chronology follows 20→40→40→30→55."}, {"id": "this figure", "answer": "A stood at 40% in 2010. This figure fell to 30% in 2015.", "why": "Chronology follows 20→40→40→30→55."}], "mode": "writing", "count": 5, "choices": [], "labels": ["after", "before", "and then", "hai câu với After that/Following that", "this figure"], "objective": false, "objectiveCount": 0, "expected": []}, {"id": "EX26", "number": 26, "title": "Static Data → Contrast & Similarity", "body": "Instructions: Write one accurate example with each required device. The relationship must be supported by the data.\n[TABLE]\nCATEGORY | A | B\nCars | 60% | 30%\nTrains | 25% | 26%\nBuses | 10% | 35%\nwhereas: _____________________________________________________________________________\nbut: _____________________________________________________________________________\nhowever: _____________________________________________________________________________\nby contrast: _____________________________________________________________________________\nsimilarly: _____________________________________________________________________________\nthe figure for: _____________________________________________________________________________", "key": "whereas  Đáp án: Cars accounted for 60% in A, whereas the figure for B was only 30%.\nGiải thích: Connector matches the actual data relationship.\nbut  Đáp án: Buses represented 10% in A, but 35% in B.\nGiải thích: Connector matches the actual data relationship.\nhowever  Đáp án: Cars accounted for 60% in A. However, the figure for B was only 30%.\nGiải thích: Connector matches the actual data relationship.\nby contrast  Đáp án: Buses represented 10% in A. By contrast, they accounted for 35% in B.\nGiải thích: Connector matches the actual data relationship.\nsimilarly  Đáp án: Trains accounted for 25% in A. Similarly, the figure for B was 26%.\nGiải thích: Connector matches the actual data relationship.\nthe figure for  Đáp án: Cars accounted for 60% in A, compared with 30% for B; the figure for buses showed the opposite pattern, at 10% and 35%.\nGiải thích: Connector matches the actual data relationship.", "answers": [{"id": "whereas", "answer": "Cars accounted for 60% in A, whereas the figure for B was only 30%.", "why": "Connector matches the actual data relationship."}, {"id": "but", "answer": "Buses represented 10% in A, but 35% in B.", "why": "Connector matches the actual data relationship."}, {"id": "however", "answer": "Cars accounted for 60% in A. However, the figure for B was only 30%.", "why": "Connector matches the actual data relationship."}, {"id": "by contrast", "answer": "Buses represented 10% in A. By contrast, they accounted for 35% in B.", "why": "Connector matches the actual data relationship."}, {"id": "similarly", "answer": "Trains accounted for 25% in A. Similarly, the figure for B was 26%.", "why": "Connector matches the actual data relationship."}, {"id": "the figure for", "answer": "Cars accounted for 60% in A, compared with 30% for B; the figure for buses showed the opposite pattern, at 10% and 35%.", "why": "Connector matches the actual data relationship."}], "mode": "writing", "count": 6, "choices": [], "labels": ["whereas", "but", "however", "by contrast", "similarly", "the figure for"], "objective": false, "objectiveCount": 0, "expected": []}, {"id": "EX27", "number": 27, "title": "From six sentences to three", "body": "Instructions: Rewrite as THREE sentences. Use after/before, this figure, and then/following that. Do not lose important data.\nCar use stood at 30% in 2000. Car use increased to 50% in 2005. Car use remained stable until 2010. Car use fell to 40% in 2015. Car use recovered to 55% in 2020. Car use ended the period above its initial level.\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________", "key": "Model answer: Car use stood at 30% in 2000 before increasing to 50% in 2005. This figure then remained stable until 2010 before falling to 40% in 2015. Following that, it recovered to 55% in 2020, ending the period above its initial level.\nGiải thích: All six original facts retained; repetition reduced through this figure, before and Following that.", "answers": [{"id": "model", "answer": "Car use stood at 30% in 2000 before increasing to 50% in 2005. This figure then remained stable until 2010 before falling to 40% in 2015. Following that, it recovered to 55% in 2020, ending the period above its initial level.", "why": "All six original facts retained; repetition reduced through this figure, before and Following that."}], "mode": "writing", "count": 1, "choices": [], "labels": ["Bài làm"], "objective": false, "objectiveCount": 0, "expected": []}, {"id": "EX28", "number": 28, "title": "Put the sentences in logical order", "body": "Instructions: Order A–E, then underline all cohesive devices.\nA. Following that, this figure declined to 45% in 2015.\nB. It then remained unchanged for five years.\nC. The percentage stood at 30% in 2000.\nD. After rising considerably, it reached 50% in 2005.\nE.
