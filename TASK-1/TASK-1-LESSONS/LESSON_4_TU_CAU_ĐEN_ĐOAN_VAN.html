Finally, the percentage recovered to 60% in 2020.\nCorrect order: _____ → _____ → _____ → _____ → _____", "key": "Order  Đáp án: C → D → B → A → E\nGiải thích: Start at 2000 (C), rise to 2005 (D), stable for five years to 2010 (B), decline to 2015 (A), recover to 2020 (E). Cohesive devices: After..., then, Following that, this figure, Finally.", "answers": [{"id": "Order", "answer": "C → D → B → A → E", "why": "Start at 2000 (C), rise to 2005 (D), stable for five years to 2010 (B), decline to 2015 (A), recover to 2020 (E). Cohesive devices: After..., then, Following that, this figure, Finally."}], "mode": "writing", "count": 1, "choices": [], "labels": ["Bài làm"], "objective": false, "objectiveCount": 0, "expected": []}, {"id": "EX29", "number": 29, "title": "Bad Paragraph Repair", "body": "Instructions: Identify illogical connectors, grammar errors, fragments, and reference problems. Then rewrite naturally.\nFrance recorded 65%. Similarly, Germany recorded only 30%. However, Canada also recorded 65%. After that, Australia stood at 40%. Whereas France had the highest figure. Germany had the lowest. Despite Germany was lower, its figure was 30%.\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________", "key": "Model answer: France recorded 65%, the highest figure among the countries shown. Similarly, Canada also stood at 65%. By contrast, Germany had the lowest figure, at 30%, while Australia recorded 40%.\nGiải thích: “Similarly” was wrong for France 65 vs Germany 30 but right for France/Canada 65. “After that” was illogical because static country data have no chronology. “Whereas France...” was a fragment. “Despite Germany was...” had invalid despite + clause and added no useful relationship.", "answers": [{"id": "model", "answer": "France recorded 65%, the highest figure among the countries shown. Similarly, Canada also stood at 65%. By contrast, Germany had the lowest figure, at 30%, while Australia recorded 40%.", "why": "“Similarly” was wrong for France 65 vs Germany 30 but right for France/Canada 65. “After that” was illogical because static country data have no chronology. “Whereas France...” was a fragment. “Despite Germany was...” had invalid despite + clause and added no useful relationship."}], "mode": "writing", "count": 1, "choices": [], "labels": ["Bài làm"], "objective": false, "objectiveCount": 0, "expected": []}, {"id": "EX30", "number": 30, "title": "Connector Reduction Challenge", "body": "Instructions: Rewrite using only 3–4 cohesive devices while making the paragraph more coherent.\nInitially, A stood at 20%. Then, it increased to 35%. After that, it remained stable. Following that, however, it declined to 30%. Then, by contrast, it recovered to 45%. After that, finally, it reached 50%.\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________", "key": "Model answer: Initially, A stood at 20% before increasing to 35%, where it remained stable for a period. It then declined to 30% before recovering to 45%. Finally, the figure reached 50%.\nGiải thích: Uses only a few purposeful devices; removes contradictory/stacked “however/by contrast” because all data belong to one chronological series.", "answers": [{"id": "model", "answer": "Initially, A stood at 20% before increasing to 35%, where it remained stable for a period. It then declined to 30% before recovering to 45%. Finally, the figure reached 50%.", "why": "Uses only a few purposeful devices; removes contradictory/stacked “however/by contrast” because all data belong to one chronological series."}], "mode": "writing", "count": 1, "choices": [], "labels": ["Bài làm"], "objective": false, "objectiveCount": 0, "expected": []}, {"id": "EX31", "number": 31, "title": "Controlled Body Paragraph", "body": "Instructions: Write 6–7 sentences. Include After/Before, While/Whereas, However/By contrast, this figure, the figure for..., and at least one combined movement. Avoid unnecessary repetition.\n[TABLE]\nYEAR | FRANCE | GERMANY\n2000 | 30% | 50%\n2005 | 45% | 48%\n2010 | 45% | 40%\n2015 | 60% | 35%\n2020 | 55% | 30%\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________", "key": "Model answer: France began at 30% in 2000, whereas the figure for Germany was considerably higher, at 50%. After rising to 45% in 2005, the French figure remained unchanged until 2010. Over the same period, Germany declined from 48% to 40%. Following that, France increased substantially to 60% in 2015, while Germany fell further to 35%. This figure for France then slipped slightly to 55% in 2020. By contrast, Germany continued its downward movement, ending the period at 30%.\nGiải thích: Uses chronology and contrast without stacking. “this figure for France” could be shortened to “this figure” because France is the immediately active referent; either is acceptable if reference remains clear.", "answers": [{"id": "model", "answer": "France began at 30% in 2000, whereas the figure for Germany was considerably higher, at 50%. After rising to 45% in 2005, the French figure remained unchanged until 2010. Over the same period, Germany declined from 48% to 40%. Following that, France increased substantially to 60% in 2015, while Germany fell further to 35%. This figure for France then slipped slightly to 55% in 2020. By contrast, Germany continued its downward movement, ending the period at 30%.", "why": "Uses chronology and contrast without stacking. “this figure for France” could be shortened to “this figure” because France is the immediately active referent; either is acceptable if reference remains clear."}], "mode": "writing", "count": 1, "choices": [], "labels": ["Bài làm"], "objective": false, "objectiveCount": 0, "expected": []}, {"id": "EX32", "number": 32, "title": "Static Chart Paragraph", "body": "Instructions: Write a 5–6 sentence body paragraph showing contrast, similarity, reference words, and appropriate connectors. Do not force linking words.\n[TABLE]\nCATEGORY | MEN | WOMEN\nCars | 65% | 40%\nTrains | 20% | 35%\nBuses | 15% | 15%\nCycling | 10% | 12%\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________", "key": "Model answer: Cars were considerably more common among men than women, at 65% and 40%, respectively. By contrast, women recorded a higher figure for train use, at 35%, compared with 20% for men. The percentages for bus use were identical, at 15% in both groups. Similarly, cycling showed only a small gender difference, with figures of 10% for men and 12% for women. Overall, the largest contrast was seen in car use, whereas buses showed no difference between the two groups.\nGiải thích: Static chart has no chronology, so time connectors are unnecessary. Cohesion comes from contrast, similarity, reference and grouping.", "answers": [{"id": "model", "answer": "Cars were considerably more common among men than women, at 65% and 40%, respectively. By contrast, women recorded a higher figure for train use, at 35%, compared with 20% for men. The percentages for bus use were identical, at 15% in both groups. Similarly, cycling showed only a small gender difference, with figures of 10% for men and 12% for women. Overall, the largest contrast was seen in car use, whereas buses showed no difference between the two groups.", "why": "Static chart has no chronology, so time connectors are unnecessary. Cohesion comes from contrast, similarity, reference and grouping."}], "mode": "writing", "count": 1, "choices": [], "labels": ["Bài làm"], "objective": false, "objectiveCount": 0, "expected": []}, {"id": "EX33", "number": 33, "title": "From Data to Cohesive Paragraph", "body": "Instructions: Write 7–9 sentences. Use chronology accurately, at least one After/Before, one While/Whereas, one sentence connector, similarity, contrast, this figure, and the figure for.... Avoid connector stacking and mechanical repetition.\n[TABLE]\nYEAR | A | B\n2000 | 25% | 55%\n2005 | 40% | 50%\n2010 | 40% | 45%\n2015 | 35% | 35%\n2020 | 60% | 30%\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________", "key": "Model answer: A started at 25% in 2000, whereas the figure for B was much higher, at 55%. After rising to 40% in 2005, A remained unchanged at this level until 2010. Over the same period, B declined gradually from 50% to 45%. Following that, A fell slightly to 35% in 2015. This figure was identical to that for B in the same year, showing a point of similarity between the two series. By contrast, their final movements were very different: A climbed sharply to 60% in 2020, while B decreased to 30%. Thus, by the end of the period, A was twice as high as B.\nGiải thích: Meets chronology, After, Whereas/while, sentence connector, similarity, contrast, this figure and the figure for. Connectors are used only where the relationship warrants them.", "answers": [{"id": "model", "answer": "A started at 25% in 2000, whereas the figure for B was much higher, at 55%. After rising to 40% in 2005, A remained unchanged at this level until 2010. Over the same period, B declined gradually from 50% to 45%. Following that, A fell slightly to 35% in 2015. This figure was identical to that for B in the same year, showing a point of similarity between the two series. By contrast, their final movements were very different: A climbed sharply to 60% in 2020, while B decreased to 30%. Thus, by the end of the period, A was twice as high as B.", "why": "Meets chronology, After, Whereas/while, sentence connector, similarity, contrast, this figure and the figure for. Connectors are used only where the relationship warrants them."}], "mode": "writing", "count": 1, "choices": [], "labels": ["Bài làm"], "objective": false, "objectiveCount": 0, "expected": []}]}</script><script>
'use strict';const lesson=JSON.parse(document.querySelector('#data').textContent),app=document.querySelector('#app'),notice=document.querySelector('#notice'),key='writingPractice::'+lesson.id;const endpoint='https://script.google.com/macros/s/AKfycbzCX-jRyn28wS8lEQ-wtdM8qspFr-Ptj1c2r3ctxpi3hseVZ1UMBE8N4jXAx1-03pLn/exec';let state=load(),page=state.student?.name&&state.student?.class&&state.student?.id?'home':'login',active=null,submitting=false;
function load(){try{let o=JSON.parse(localStorage.getItem(key));if(o&&o.student&&o.exercises)return o}catch{}return {student:{},exercises:{}}}function persist(){try{localStorage.setItem(key,JSON.stringify(state));notice.textContent='';return true}catch{notice.textContent='Không lưu được bài trên thiết bị. Kiểm tra cài đặt hoặc dung lượng trình duyệt trước khi rời trang.';return false}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function st(id){return state.exercises[id]||(state.exercises[id]={responses:{},submitted:false,send:'',attempt:1,history:[]})}function go(p,id){page=p;active=id||null;render();window.scrollTo(0,0)}function html(s){app.innerHTML=s}
function format(source){return source.split('\n').reduce((a,line)=>{if(line==='[TABLE]')return a;if(line.includes(' | ')){let cells=line.split(' | ');if(!a.length||a[a.length-1].type!=='table')a.push({type:'table',rows:[]});a[a.length-1].rows.push(cells)}else a.push({type:'text',line});return a},[]).map(z=>z.type==='table'?`<div class="tablewrap"><table>${z.rows.map(row=>`<tr>${row.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`:`<div>${esc(z.line)||'&nbsp;'}</div>`).join('')}
function nav(){return '<div class="toolbar"><button class="alt" data-action="home">← Trở lại Lesson</button></div>'}
function render(){if(page==='login'){html(`<section class="card"><h2>Thông tin học sinh</h2><p class="muted">Nhập đủ thông tin để bắt đầu Lesson. Có thể sửa lại sau.</p><form id="identity"><label for="studentName">Họ và tên</label><input id="studentName" required value="${esc(state.student.name)}"><label for="studentClass">Lớp</label><input id="studentClass" required value="${esc(state.student.class)}"><label for="studentId">Mã học sinh</label><input id="studentId" required value="${esc(state.student.id)}"><div class="actions"><button type="submit">Vào bài học</button></div></form></section>`);return}
if(page==='home'){let done=lesson.exercises.filter(e=>st(e.id).submitted).length;html(`<section class="card"><div class="eyebrow">Lesson overview</div><h2>${esc(lesson.title)}</h2><p>${esc(state.student.name)} · ${esc(state.student.class)} · ${esc(state.student.id)}</p><p class="status">Đã nộp ${done}/${lesson.exercises.length} Exercise</p><p class="muted">Học lý thuyết trước, sau đó có thể chọn Exercise bất kỳ. Bài đang làm được lưu trên trình duyệt này.</p><div class="actions"><button data-action="theory">Học lý thuyết</button><button class="alt" data-action="edit">Sửa thông tin</button><button class="warn" data-action="reset">Reset toàn bộ Lesson</button></div></section><h2>Practice</h2><div class="grid">${lesson.exercises.map(e=>{let a=st(e.id),status=a.submitted?'ĐÃ NỘP':Object.values(a.responses).some(Boolean)?'ĐANG LÀM':'CHƯA LÀM';return `<section class="card"><span class="badge">${status}</span><h3>Exercise ${e.number}. ${esc(e.title)}</h3><p class="muted">${e.objectiveCount?`${e.objectiveCount} mục chấm tự động${e.count>e.objectiveCount?' · bài viết tự đối chiếu':''}`:'Viết và tự đối chiếu bài mẫu'}</p>${a.submitted&&e.objectiveCount?`<strong>${a.score}/${e.objectiveCount} mục khách quan</strong>`:''}<div class="actions"><button data-action="exercise" data-id="${e.id}">${a.submitted?'Xem bài đã nộp':'Mở Exercise'}</button></div></section>`}).join('')}</div>`);return}
if(page==='theory'){let chunks=lesson.theory.split(/(?=\n8\.[12]\. )/);html(`${nav()}<h2>Kiến thức cần học trước khi luyện tập</h2><section class="card">${format(lesson.intro)}</section>${chunks.map(c=>`<section class="card">${format(c.trim())}</section>`).join('')}`);return}
let e=lesson.exercises.find(z=>z.id===active),a=st(e.id),sent=a.submitted;let inputs=e.labels.map((label,i)=>{let value=a.responses['q'+i]||'';let control=e.mode==='mixed'?`<select id="q${i}" data-answer="q${i}" ${sent?'disabled':''}><option value="">Chọn ✓ hoặc ✕</option>${['✓','✕'].map(o=>`<option ${value===o?'selected':''}>${o}</option>`).join('')}</select><label for="q${i}fix">Nếu sai, sửa từ nối hoặc câu</label><textarea id="q${i}fix" data-answer="q${i}fix" ${sent?'readonly':''} placeholder="Viết cách sửa nếu cần">${esc(a.responses['q'+i+'fix']||'')}</textarea>`:e.mode==='dual'?`<div class="grid"><div><label for="q${i}a">Quan hệ</label><select id="q${i}a" data-answer="q${i}a" ${sent?'disabled':''}><option value="">Chọn</option>${['TIME','CONTRAST','CONTRAST/CONCESSION','SIMILARITY'].map(o=>`<option ${a.responses['q'+i+'a']===o?'selected':''}>${o}</option>`).join('')}</select></div><div><label for="q${i}b">Cấp độ</label><select id="q${i}b" data-answer="q${i}b" ${sent?'disabled':''}><option value="">Chọn</option>${['C','S'].map(o=>`<option ${a.responses['q'+i+'b']===o?'selected':''}>${o}</option>`).join('')}</select></div></div>`:e.objective&&i<e.objectiveCount?`<select id="q${i}" data-answer="q${i}" ${sent?'disabled':''}><option value="">Chọn đáp án</option>${e.choices.map(o=>`<option value="${esc(o)}" ${value===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<textarea id="q${i}" data-answer="q${i}" ${sent?'readonly':''} class="${e.count===1?'long':''}" placeholder="Viết câu trả lời của em; các cách diễn đạt hợp lý đều được xem xét.">${esc(value)}</textarea>`;return `<div class="item"><label for="${e.mode==='dual'?'q'+i+'a':'q'+i}">${esc(label)}</label>${control}</div>`}).join('');
let review=sent?`<section class="review"><h2>Kết quả và giải thích</h2>${e.objectiveCount?`<p class="status">${a.score}/${e.objectiveCount} mục khách quan. ${e.count>e.objectiveCount?'Các câu viết bổ sung không nằm trong điểm tự động.':''}</p>`:'<p class="status">Bài viết tự đối chiếu; hệ thống không gán điểm IELTS hoặc đánh sai câu khác bài mẫu.</p>'}${e.labels.map((label,i)=>{let ans=e.answers[i],raw=e.mode==='mixed'?`${a.responses['q'+i]||'—'} · Sửa: ${a.responses['q'+i+'fix']||'—'}`:e.mode==='dual'?`${a.responses['q'+i+'a']||'—'} + ${a.responses['q'+i+'b']||'—'}`:a.responses['q'+i]||'—';let checked=e.objective&&i<e.objectiveCount,ok=checked&&(e.mode==='dual'?a.responses['q'+i+'a']===e.expected[i][0]&&a.responses['q'+i+'b']===e.expected[i][1]:String(a.responses['q'+i]||'').toLowerCase()===String(e.expected[i]).toLowerCase());return `<div class="item"><h3>${esc(label)} ${checked?(ok?'· ✓ Đúng':'· ✗ Xem lại'):''}</h3><p><strong>Bài của em:</strong></p><div class="source">${esc(raw)}</div>${ans?`<p><strong>Đáp án/bài mẫu:</strong> ${esc(ans.answer)}</p><p><strong>Giải thích:</strong> ${esc(ans.why)}</p>`:''}</div>`}).join('')}<h3>Teacher Key và lời giải đầy đủ</h3><div class="source">${esc(e.key)}</div><h3>Kiến thức cần nhớ</h3><p>${esc(knowledge[e.number]||'Đối chiếu yêu cầu và lời giải từng câu; xác định đúng quan hệ giữa dữ liệu trước khi chọn cấu trúc nối câu.')}</p><p class="status" role="status">${a.send==='sent'?'Đã gửi kết quả.':a.send==='sending'?'Đang gửi kết quả…':a.send==='failed'?'Chưa xác nhận được việc gửi kết quả. Bài làm vẫn lưu trên thiết bị; kiểm tra Sheet trước khi thử gửi lại để tránh trùng.':a.send==='uncertain'?'Chưa xác nhận được trạng thái gửi. Bài vẫn lưu; kiểm tra Sheet trước khi gửi lại.':'Bài đã lưu trên thiết bị.'}</p></section>`:'';
html(`${nav()}<section class="card"><div class="eyebrow">Exercise ${e.number} / ${lesson.exercises.length}</div><h2>${esc(e.title)}</h2><div class="source">${format(e.body)}</div><p class="muted">${e.objectiveCount?'Phần lựa chọn được chấm tự động. ':''}Các bài viết có thể có nhiều cách diễn đạt đúng.</p>${inputs}${e.number===33?`<h3>Tự kiểm tra trước khi nộp</h3><div class="source">${esc(lesson.selfcheck)}</div>`:''}<div class="actions">${sent?`<button data-action="retry">Làm lại Exercise</button>${a.send==='failed'||a.send==='uncertain'?'<button class="alt" data-action="resend">Thử gửi lại</button>':''}`:'<button data-action="submit" id="submitButton">Nộp bài</button>'}<button class="alt" data-action="home">Trở lại Lesson</button></div>${review}</section>`)}
const knowledge={1:'TIME: hai diễn biến nối tiếp; CONTRAST: số liệu hoặc xu hướng đối lập; SIMILARITY: số liệu hoặc xu hướng tương đồng.',2:'Clause connectors nối các mệnh đề trong một câu; sentence connectors mở câu tiếp theo. Despite diễn tả nhượng bộ và theo sau bởi V-ing hoặc cụm danh từ.',3:'Phân biệt C (nối trong một câu) và S (nối hai câu); không đặt dấu phẩy thay cho dấu chấm trước However.',4:'After + V-ing/cụm danh từ diễn tả sự kiện xảy ra trước; mệnh đề chính diễn tả việc xảy ra sau.',5:'Mệnh đề chính xảy ra trước before + V-ing/cụm danh từ.',6:'Xác định thứ tự thời gian rồi mới chọn after hay before.',7:'And then nối hai hành động theo đúng thời gian. After/Before có thể thay cấu trúc nếu vẫn giữ thứ tự.',8:'While/whereas nối hai mệnh đề đầy đủ và nêu sự tương phản thực.',9:'But nối hai mệnh đề trong một câu; dùng dấu phẩy trước but ở mẫu câu này.',10:'Despite + V-ing hoặc cụm danh từ; dùng khi tình huống thứ nhất không ngăn kết quả thứ hai.',11:'Không viết despite of; không đặt mệnh đề có động từ chia thì ngay sau despite.',12:'Then, Following that, After that mở câu tiếp theo và cần phản ánh đúng trình tự.',13:'However, In contrast, By contrast mở câu riêng ở mẫu đang luyện; đặt dấu phẩy sau từ nối.',14:'Không ghép hai câu độc lập bằng dấu phẩy + however; dùng dấu chấm hoặc dấu chấm phẩy thích hợp.',15:'Similarly/Likewise chỉ dùng khi dữ liệu thực sự cùng hướng hoặc gần bằng.',16:'Chọn từ nối dựa trên quan hệ thật: thời gian, đối lập, tương đồng; sửa cả từ nối nếu dữ liệu bác bỏ nó.',17:'This figure cần chỉ lại rõ cùng đại lượng trước đó; tránh lặp nguyên chủ ngữ.',18:'The figure for + đối tượng mới giúp người đọc nhận ra so sánh đổi chủ thể.',19:'Một quan hệ có thể viết một câu với clause connector hoặc hai câu với sentence connector.',20:'Giữ nguyên trình tự 30 → 50 → 40 khi đổi cấu trúc nối.',21:'Gộp sự kiện cùng chuỗi dữ liệu; this figure thay chủ ngữ lặp.',22:'Bỏ những từ nối chồng nhau; mỗi từ nối phải diễn tả một quan hệ thật.',23:'Kiểm tra vị trí từ nối, dấu câu, chủ thể của V-ing và quan hệ dữ liệu.',24:'Chọn đáp án theo cả nghĩa dữ liệu lẫn cấu trúc câu.',25:'Chuỗi A: 20 → 40 → 40 → 30 → 55; tuyệt đối không đảo mốc.',26:'So sánh dữ liệu tĩnh bằng contrast hoặc similarity; không gán quan hệ thời gian cho các nhóm.',27:'Giữ đủ các mốc và chiều biến động khi gộp câu.',28:'Sắp theo 2000 → 2005 → 2010 → 2015 → 2020 rồi kiểm tra từ quy chiếu.',29:'Không dùng từ nối thời gian cho danh mục tĩnh; sửa câu cụt và đại từ mơ hồ.',30:'Chọn ít từ nối nhưng mỗi từ nối có chức năng rõ.',31:'Đọc từng chuỗi France/Germany và kiểm tra quy chiếu this figure trước khi chuyển đối tượng.',32:'Biểu đồ tĩnh không có trình tự thời gian; nhóm so sánh lớn, bằng nhau và chênh lệch nhỏ.',33:'Kiểm tra mọi mốc A/B, thời gian, tương phản, tương đồng và tham chiếu trước khi hoàn thiện đoạn.'};
document.addEventListener('submit',ev=>{if(ev.target.id!=='identity')return;ev.preventDefault();state.student={name:document.querySelector('#studentName').value.trim(),class:document.querySelector('#studentClass').value.trim(),id:document.querySelector('#studentId').value.trim()};if(!Object.values(state.student).every(Boolean))return;if(persist())go('home')});
for(let event of ['input','change'])document.addEventListener(event,ev=>{let id=ev.target.dataset.answer;if(!id||!active)return;st(active).responses[id]=ev.target.value;persist()});
document.addEventListener('click',async ev=>{let button=ev.target.closest('button[data-action]');if(!button)return;let act=button.dataset.action;if(act==='home'||act==='theory'){go(act);return}if(act==='edit'){go('login');return}if(act==='exercise'){go('exercise',button.dataset.id);return}if(act==='reset'){if(confirm('Xóa toàn bộ bài đang làm và kết quả trên thiết bị cho Lesson này?')&&confirm('Xác nhận lần hai: không thể khôi phục sau khi xóa.')){state.exercises={};persist();render()}return}let e=lesson.exercises.find(z=>z.id===active),a=st(e.id);if(act==='retry'){if(submitting)return;if(confirm('Làm lại Exercise này? Bài lần trước vẫn được lưu trong lịch sử cục bộ, phần trả lời hiện tại sẽ được làm mới.')){let history=a.history||[];history.push({attempt:a.attempt,responses:a.responses,score:a.score,send:a.send,submittedAt:a.submittedAt});state.exercises[e.id]={responses:{},submitted:false,attempt:(a.attempt||1)+1,send:'',history};persist();render()}return}if(act==='submit'){if(submitting||a.submitted)return;let has=Object.values(a.responses).some(v=>String(v).trim());if(!has&&!confirm('Bài còn trống. Em vẫn muốn nộp?'))return;submitting=true;button.disabled=true;a.submitted=true;a.submittedAt=new Date().toISOString();a.score=e.expected.reduce((sum,z,i)=>sum+(e.mode==='dual'?a.responses['q'+i+'a']===z[0]&&a.responses['q'+i+'b']===z[1]:String(a.responses['q'+i]||'').toLowerCase()===String(z).toLowerCase()?1:0),0);a.send='sending';if(!persist()){a.submitted=false;a.send='';submitting=false;render();return}render();await send(e,a);submitting=false;render();return}if(act==='resend'){if(submitting||a.send==='sent')return;if(!confirm('Hãy kiểm tra Sheet trước: nếu kết quả đã có, gửi lại sẽ tạo dòng trùng. Vẫn gửi lại?'))return;submitting=true;button.disabled=true;a.send='sending';persist();render();await send(e,a);submitting=false;render()}});
async function send(e,a){let payload={skill:'WRITING',studentName:state.student.name,studentClass:state.student.class,studentId:state.student.id,testId:lesson.id,testName:lesson.title,score:a.score||0,total:e.objectiveCount,correct:a.score||0,wrong:e.objectiveCount-(a.score||0),duration:0,answers:JSON.stringify({exerciseId:e.id,exerciseName:e.title,attempt:a.attempt,submissionId:`${lesson.id}:${e.id}:${state.student.id}:${a.attempt}`,responses:a.responses,wordCount:Object.values(a.responses).join(' ').trim().split(/\s+/).filter(Boolean).length})};try{let response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});if(!response.ok)throw Error('HTTP '+response.status);let body=await response.text();if(/"(?:success|ok)"\s*:\s*false|"status"\s*:\s*"(?:error|failed)"/i.test(body))throw Error('Server error');a.send='sent'}catch{a.send='failed'}persist()}
if(page==='home'){for(let e of lesson.exercises){let a=st(e.id);if(a.send==='sending'){a.send='uncertain';persist()}}}render();
</script></body></html>
