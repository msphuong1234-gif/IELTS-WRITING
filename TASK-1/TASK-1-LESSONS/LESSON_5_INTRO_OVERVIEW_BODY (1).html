</style></head><body><header><div>IELTS WRITING TASK 1 · LESSON 5</div><h1>Introduction · Overview · Body</h1><div>Writing structure · 35 Exercises · Tự lưu tiến độ</div></header><div id="notice" role="status"></div><main id="app"></main><script type="application/json" id="data">{"id": "WRITING_TASK1_INTRO_OVERVIEW_BODY_01", "title": "Introduction · Overview · Body Organisation", "theory": "LÝ THUYẾT INTRO-OVERVIEW-BODY\n9. INTRODUCTION - OVERVIEW - BODY\n9.1. Introduction\n[TABLE]\n1 CÂU - PARAPHRASE - KHÔNG BÌNH LUẬN / Nêu: biểu đồ gì + mô tả cái gì + thời gian + địa điểm (nếu có). / Không nêu quan điểm cá nhân. / Không đưa nhận xét hoặc số liệu chi tiết. / Không viết dài dòng; tài liệu gợi ý hoàn thành trong tối đa khoảng 2 phút.\nChart type + show/illustrate/compare + object + time/place\nCách viết phần “object” trong Introduction:\nthe numbers/percentages/quantities of + Noun + relative clause\nWH-clause: how many / how much / what / where ... + S + V\n9.2. Overview\n[TABLE]\n2 CÂU - MAIN FEATURES - KHÔNG SỐ LIỆU CỤ THỂ / Câu 1: đặc điểm nổi bật thứ nhất. / Câu 2: đặc điểm nổi bật thứ hai. / Cụm mở đầu: Overall / It is clear that / It is noticeable that / ...\nVới Dynamic Charts, tìm đặc điểm nổi bật theo 3 tiêu chí:\n1.  Xu hướng chính: cùng tăng/cùng giảm hay hai nhóm đi theo hướng trái ngược?\n2.  Đối tượng nào cao nhất/thấp nhất?\n3.  Đối tượng nào có mức thay đổi lớn nhất?\n9.3. Body paragraphs\nNhiệm vụ: mô tả chi tiết các biến, kèm số liệu và so sánh. Nên chia thành 2 đoạn; hai đoạn không cần dài bằng nhau.\n[TABLE]\nCách nhóm | Body 1 | Body 2\nTheo thời gian | Năm đầu: so sánh các biến, thường xếp từ cao đến thấp; thêm mốc giữa khi có điểm nổi bật. | Năm cuối: tập trung xu hướng; gộp các biến có xu hướng giống nhau.\nTheo biến/xu hướng | Nhóm các biến có cùng xu hướng. | Nhóm biến có xu hướng còn lại.\n10. CÁCH NHÓM BODY TRONG CÁC BÀI THỰC HÀNH\nCác file nguồn minh họa nhiều cách chia Body. Học sinh không cần học thuộc một cách duy nhất; cần chọn cách giúp dữ liệu được nhóm logic.\n[TABLE]\nTình huống trong tài liệu | Cách chia Body được gợi ý\nPie Chart có 2 năm | Theo năm đầu/năm cuối; hoặc theo nhóm phản hồi tích cực/tiêu cực.\nTable có nhiều quốc gia và nhiều năm | Theo năm đầu/năm cuối; hoặc chia theo nhóm quốc gia.\nBar Chart nhiều hoạt động qua thời gian | Theo nhóm hoạt động (hàng ngang); hoặc theo năm đầu/năm cuối (cột).\nDynamic line/bar có các xu hướng khác nhau | Nhóm các biến cùng tăng/giảm vào một Body; xu hướng còn lại ở Body kia.\n[TABLE]\nNGUYÊN TẮC CHỌN NHÓM / Nhóm những số liệu có điểm chung để tránh liệt kê từng dòng/từng cột riêng lẻ. / Trong mỗi Body, ưu tiên so sánh các số liệu liên quan thay vì chỉ kể số liệu. / Mỗi câu chi tiết nên có số liệu hỗ trợ khi phù hợp.", "intro": "IELTS WRITING TASK 1\nINTRODUCTION – OVERVIEW – BODY ORGANISATION | STUDENT PRACTICE\nName: ______________________________   Class: ______________   Date: ______________\n[TABLE]\nCORE PROCESS / IDENTIFY → FILTER → PARAPHRASE → GENERALISE → PRIORITISE → GROUP → PLAN → WRITE\nQUICK REFERENCE\n[TABLE]\nSECTION | TRAINING TARGET | DO | DO NOT\nIntroduction | 1 sentence | Chart type + object + time/place; paraphrase | Opinion; detailed data; main-feature commentary\nOverview | 2 sentences | Main patterns, extremes, largest change | Specific figures; minor details; list every trend\nBody | 2 logical paragraphs | Exact data + comparisons + selected key details | Random grouping; data dump; repeat Overview\nNote: the 1-sentence Introduction and 2-sentence Overview are training frameworks to build concise control, not absolute IELTS rules.", "selfcheck": "FINAL SELF-CHECK\nINTRODUCTION: □ 1 concise sentence  □ chart/object/time/place  □ no opinion  □ no detailed figures  □ no Overview-style commentary\nOVERVIEW: □ 2 concise sentences for this training stage  □ no specific numbers  □ main trends  □ extremes considered  □ greatest change considered  □ only important features\nBODY: □ 2 logical paragraphs  □ clear grouping  □ exact supporting data  □ comparisons  □ selected meaningful midpoints  □ no mechanical data dump", "exercises": [{"id": "EX01", "number": 1, "title": "KEEP or REMOVE?", "section": "Introduction", "body": "Instructions: Write K if the information belongs in an Introduction; R if it should be removed.\nThe chart is a line graph. _____\nThe chart covers the period from 2000 to 2020. _____\nFrance recorded the highest figure in 2020. _____\nThe chart compares four countries. _____\nIn my opinion, this is an interesting trend. _____\nThe figure rose dramatically from 20% to 60%. _____\nThe data relate to household expenditure. _____\nThe information is for Australia. _____\nOverall, car ownership increased considerably. _____\nThe chart presents percentages. _____\nGermany accounted for exactly 35% in 2015. _____\nThe graph shows changes in Internet use. _____", "key": "ANSWER / MODEL: 1 K; 2 K; 3 R; 4 K; 5 R; 6 R; 7 K; 8 K; 9 R; 10 K; 11 R; 12 K.\nGIẢI THÍCH CHI TIẾT: Introduction chỉ xác định biểu đồ, đối tượng, thời gian và địa điểm khi có. Câu 3, 6, 9, 11 là feature/detail nên thuộc Overview hoặc Body; câu 5 là quan điểm cá nhân nên loại. 'The chart presents percentages' có thể giữ nếu percentage là một phần cần thiết của object, nhưng khi viết thật nên gộp vào noun phrase thay vì tạo một câu riêng.", "model": "1 K; 2 K; 3 R; 4 K; 5 R; 6 R; 7 K; 8 K; 9 R; 10 K; 11 R; 12 K.", "explanation": "Introduction chỉ xác định biểu đồ, đối tượng, thời gian và địa điểm khi có. Câu 3, 6, 9, 11 là feature/detail nên thuộc Overview hoặc Body; câu 5 là quan điểm cá nhân nên loại. 'The chart presents percentages' có thể giữ nếu percentage là một phần cần thiết của object, nhưng khi viết thật nên gộp vào noun phrase thay vì tạo một câu riêng.", "qaNote": "", "mode": "choice", "count": 12, "labels": ["Câu 1", "Câu 2", "Câu 3", "Câu 4", "Câu 5", "Câu 6", "Câu 7", "Câu 8", "Câu 9", "Câu 10", "Câu 11", "Câu 12"], "choices": ["K", "R"], "expected": ["K", "K", "R", "K", "R", "R", "K", "K", "R", "K", "R", "K"], "objective": true, "objectiveCount": 12, "answers": [{"answer": "K", "why": "Loại biểu đồ xác định nội dung task."}, {"answer": "K", "why": "Khoảng thời gian thuộc thông tin mở bài."}, {"answer": "R", "why": "Highest là đặc điểm nổi bật, thuộc Overview."}, {"answer": "K", "why": "Số quốc gia được so sánh xác định đối tượng."}, {"answer": "R", "why": "In my opinion là đánh giá cá nhân, phải bỏ."}, {"answer": "R", "why": "Thay đổi 20%→60% là diễn biến chi tiết."}, {"answer": "K", "why": "Household expenditure là đối tượng biểu đồ."}, {"answer": "K", "why": "Australia là địa điểm của dữ liệu."}, {"answer": "R", "why": "Overall + xu hướng tăng thuộc Overview."}, {"answer": "K", "why": "Percentages có thể là loại dữ liệu cần nêu trong đối tượng."}, {"answer": "R", "why": "Exactly 35% trong 2015 là số liệu Body."}, {"answer": "K", "why": "Changes in Internet use xác định nội dung biểu đồ."}]}, {"id": "EX02", "number": 2, "title": "CHART – OBJECT – TIME – PLACE", "section": "Introduction", "body": "Instructions: Underline and label C (Chart type), O (Object), T (Time), P (Place).\nThe line graph illustrates changes in the percentage of households with Internet access in Canada between 2000 and 2020.\nThe bar chart compares the amounts of money spent on five categories in France in 2025.\nThe table provides information about the numbers of international students studying at four Australian universities in 2024.\nThe pie charts show how household expenditure was distributed among six categories in the UK in 2000 and 2020.\nThe graph compares how much electricity was generated from four sources in Germany between 1990 and 2020.", "key": "ANSWER / MODEL: 1 C=line graph; O=changes in the percentage of households with Internet access; P=Canada; T=between 2000 and 2020. 2 C=bar chart; O=amounts of money spent on five categories; P=France; T=2025. 3 C=table; O=numbers of international students studying at four Australian universities; P=Australia/Australian universities; T=2024. 4 C=pie charts; O=how household expenditure was distributed among six categories; P=UK; T=2000 and 2020. 5 C=graph; O=how much electricity was generated from four sources; P=Germany; T=1990–2020.\nGIẢI THÍCH CHI TIẾT: Mục tiêu là nhận diện chức năng thông tin. Một cụm có thể đồng thời chứa object và place, ví dụ 'four Australian universities'. Không cần ép học sinh tách máy móc nếu meaning đã rõ.", "model": "1 C=line graph; O=changes in the percentage of households with Internet access; P=Canada; T=between 2000 and 2020. 2 C=bar chart; O=amounts of money spent on five categories; P=France; T=2025. 3 C=table; O=numbers of international students studying at four Australian universities; P=Australia/Australian universities; T=2024. 4 C=pie charts; O=how household expenditure was distributed among six categories; P=UK; T=2000 and 2020. 5 C=graph; O=how much electricity was generated from four sources; P=Germany; T=1990–2020.", "explanation": "Mục tiêu là nhận diện chức năng thông tin. Một cụm có thể đồng thời chứa object và place, ví dụ 'four Australian universities'. Không cần ép học sinh tách máy móc nếu meaning đã rõ.", "qaNote": "", "mode": "writing", "count": 5, "labels": ["Câu 1: C/O/T/P", "Câu 2: C/O/T/P", "Câu 3: C/O/T/P", "Câu 4: C/O/T/P", "Câu 5: C/O/T/P"], "choices": [], "expected": [], "objective": false, "objectiveCount": 0, "answers": [{"answer": "1 C=line graph; O=changes in the percentage of households with Internet access; P=Canada; T=between 2000 and 2020.", "why": "Mục tiêu là nhận diện chức năng thông tin. Một cụm có thể đồng thời chứa object và place, ví dụ 'four Australian universities'. Không cần ép học sinh tách máy móc nếu meaning đã rõ."}, {"answer": "2 C=bar chart; O=amounts of money spent on five categories; P=France; T=2025.", "why": "Mục tiêu là nhận diện chức năng thông tin. Một cụm có thể đồng thời chứa object và place, ví dụ 'four Australian universities'. Không cần ép học sinh tách máy móc nếu meaning đã rõ."}, {"answer": "3 C=table; O=numbers of international students studying at four Australian universities; P=Australia/Australian universities; T=2024.", "why": "Mục tiêu là nhận diện chức năng thông tin. Một cụm có thể đồng thời chứa object và place, ví dụ 'four Australian universities'. Không cần ép học sinh tách máy móc nếu meaning đã rõ."}, {"answer": "4 C=pie charts; O=how household expenditure was distributed among six categories; P=UK; T=2000 and 2020.", "why": "Mục tiêu là nhận diện chức năng thông tin. Một cụm có thể đồng thời chứa object và place, ví dụ 'four Australian universities'. Không cần ép học sinh tách máy móc nếu meaning đã rõ."}, {"answer": "5 C=graph; O=how much electricity was generated from four sources; P=Germany; T=1990–2020.", "why": "Mục tiêu là nhận diện chức năng thông tin. Một cụm có thể đồng thời chứa object và place, ví dụ 'four Australian universities'. Không cần ép học sinh tách máy móc nếu meaning đã rõ."}]}, {"id": "EX03", "number": 3, "title": "Choose the reporting verb", "section": "Introduction", "body": "Instructions: Complete with a natural reporting verb: show, illustrate, compare, or provide information about.\nA line graph with one variable over time: The graph ______ changes in...\nA bar chart containing five countries: The chart ______ the percentages for...\nA table containing information about salaries: The table ______ average salaries...\nTwo pie charts from two years: The charts ______ how expenditure was distributed...\nA graph showing three transport modes over 20 years: The graph ______ changes in the use of...", "key": "ANSWER / MODEL: 1 shows/illustrates; 2 compares; 3 provides information about/shows; 4 show/compare; 5 shows/illustrates/compares.\nGIẢI THÍCH CHI TIẾT: 'Compare' phù hợp khi chart đặt nhiều categories/groups cạnh nhau. 'Show/illustrate' linh hoạt hơn khi mô tả một quá trình hoặc changes. 'Provide information about' phù hợp nhưng dài hơn. Không có lợi ích IELTS nào trong việc cố thay 'show' bằng từ hiếm nếu collocation kém tự nhiên.", "model": "1 shows/illustrates; 2 compares; 3 provides information about/shows; 4 show/compare; 5 shows/illustrates/compares.", "explanation": "'Compare' phù hợp khi chart đặt nhiều categories/groups cạnh nhau. 'Show/illustrate' linh hoạt hơn khi mô tả một quá trình hoặc changes. 'Provide information about' phù hợp nhưng dài hơn. Không có lợi ích IELTS nào trong việc cố thay 'show' bằng từ hiếm nếu collocation kém tự nhiên.", "qaNote": "", "mode": "writing", "count": 5, "labels": ["Câu 1", "Câu 2", "Câu 3", "Câu 4", "Câu 5"], "choices": [], "expected": [], "objective": false, "objectiveCount": 0, "answers": [{"answer": "shows/illustrates", "why": "'Compare' phù hợp khi chart đặt nhiều categories/groups cạnh nhau. 'Show/illustrate' linh hoạt hơn khi mô tả một quá trình hoặc changes. 'Provide information about' phù hợp nhưng dài hơn. Không có lợi ích IELTS nào trong việc cố thay 'show' bằng từ hiếm nếu collocation kém tự nhiên."}, {"answer": "compares", "why": "'Compare' phù hợp khi chart đặt nhiều categories/groups cạnh nhau. 'Show/illustrate' linh hoạt hơn khi mô tả một quá trình hoặc changes. 'Provide information about' phù hợp nhưng dài hơn. Không có lợi ích IELTS nào trong việc cố thay 'show' bằng từ hiếm nếu collocation kém tự nhiên."}, {"answer": "provides information about/shows", "why": "'Compare' phù hợp khi chart đặt nhiều categories/groups cạnh nhau. 'Show/illustrate' linh hoạt hơn khi mô tả một quá trình hoặc changes. 'Provide information about' phù hợp nhưng dài hơn. Không có lợi ích IELTS nào trong việc cố thay 'show' bằng từ hiếm nếu collocation kém tự nhiên."}, {"answer": "show/compare", "why": "'Compare' phù hợp khi chart đặt nhiều categories/groups cạnh nhau. 'Show/illustrate' linh hoạt hơn khi mô tả một quá trình hoặc changes. 'Provide information about' phù hợp nhưng dài hơn. Không có lợi ích IELTS nào trong việc cố thay 'show' bằng từ hiếm nếu collocation kém tự nhiên."}, {"answer": "shows/illustrates/compares.", "why": "'Compare' phù hợp khi chart đặt nhiều categories/groups cạnh nhau. 'Show/illustrate' linh hoạt hơn khi mô tả một quá trình hoặc changes. 'Provide information about' phù hợp nhưng dài hơn. Không có lợi ích IELTS nào trong việc cố thay 'show' bằng từ hiếm nếu collocation kém tự nhiên."}]}, {"id": "EX04", "number": 4, "title": "Noun Phrase Transformation", "section": "Introduction", "body": "Instructions: Rewrite the object using a suitable number/amount/percentage expression.\nhouseholds that owned a car → the ______________________________\nelectricity that was consumed → the ______________________________\nstudents who studied overseas → the ______________________________\npeople who were unemployed → the ______________________________\nmoney that households spent on food → the ______________________________\nenergy that came from renewable sources → the ______________________________", "key": "ANSWER / MODEL: 1 the number/percentage of households that owned a car; 2 the amount/quantity of electricity consumed; 3 the number of students who studied overseas; 4 the number/percentage of people who were unemployed; 5 the amount of money households spent on food; 6 the amount/percentage of energy that came from renewable sources.\nGIẢI THÍCH CHI TIẾT: Chọn quantifier theo loại dữ liệu. Countable plural → number; uncountable → amount. Nếu chart biểu diễn tỷ lệ, percentage/proportion thường chính xác hơn number/amount. Không được tự quyết định 'number' hay 'percentage' nếu task statement không cho biết loại đơn vị.", "model": "1 the number/percentage of households that owned a car; 2 the amount/quantity of electricity consumed; 3 the number of students who studied overseas; 4 the number/percentage of people who were unemployed; 5 the amount of money households spent on food; 6 the amount/percentage of energy that came from renewable sources.", "explanation": "Chọn quantifier theo loại dữ liệu. Countable plural → number; uncountable → amount. Nếu chart biểu diễn tỷ lệ, percentage/proportion thường chính xác hơn number/amount. Không được tự quyết định 'number' hay 'percentage' nếu task statement không cho biết loại đơn vị.", "qaNote": "", "mode": "writing", "count": 6, "labels": ["Câu 1", "Câu 2", "Câu 3", "Câu 4", "Câu 5", "Câu 6"], "choices": [], "expected": [], "objective": false, "objectiveCount": 0, "answers": [{"answer": "the number/percentage of households that owned a car", "why": "Chọn quantifier theo loại dữ liệu. Countable plural → number; uncountable → amount. Nếu chart biểu diễn tỷ lệ, percentage/proportion thường chính xác hơn number/amount. Không được tự quyết định 'number' hay 'percentage' nếu task statement không cho biết loại đơn vị."}, {"answer": "the amount/quantity of electricity consumed", "why": "Chọn quantifier theo loại dữ liệu. Countable plural → number; uncountable → amount. Nếu chart biểu diễn tỷ lệ, percentage/proportion thường chính xác hơn number/amount. Không được tự quyết định 'number' hay 'percentage' nếu task statement không cho biết loại đơn vị."}, {"answer": "the number of students who studied overseas", "why": "Chọn quantifier theo loại dữ liệu. Countable plural → number; uncountable → amount. Nếu chart biểu diễn tỷ lệ, percentage/proportion thường chính xác hơn number/amount. Không được tự quyết định 'number' hay 'percentage' nếu task statement không cho biết loại đơn vị."}, {"answer": "the number/percentage of people who were unemployed", "why": "Chọn quantifier theo loại dữ liệu. Countable plural → number; uncountable → amount. Nếu chart biểu diễn tỷ lệ, percentage/proportion thường chính xác hơn number/amount. Không được tự quyết định 'number' hay 'percentage' nếu task statement không cho biết loại đơn vị."}, {"answer": "the amount of money households spent on food", "why": "Chọn quantifier theo loại dữ liệu. Countable plural → number; uncountable → amount. Nếu chart biểu diễn tỷ lệ, percentage/proportion thường chính xác hơn number/amount. Không được tự quyết định 'number' hay 'percentage' nếu task statement không cho biết loại đơn vị."}, {"answer": "the amount/percentage of energy that came from renewable sources.", "why": "Chọn quantifier theo loại dữ liệu. Countable plural → number; uncountable → amount. Nếu chart biểu diễn tỷ lệ, percentage/proportion thường chính xác hơn number/amount. Không được tự quyết định 'number' hay 'percentage' nếu task statement không cho biết loại đơn vị."}]}, {"id": "EX05", "number": 5, "title": "WH-clause", "section": "Introduction", "body": "Instructions: Rewrite using how many, how much, what, or where.\nthe amount of money spent on housing\nthe number of tourists visiting France\nthe destination chosen by international travellers\nthe amount of electricity consumed by households\nthe types of transport used by commuters\nthe countries in which international students studied\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________", "key": "ANSWER / MODEL: 1 how much money was spent on housing; 2 how many tourists visited France; 3 where international travellers went / what destination international travellers chose; 4 how much electricity households consumed; 5 what types of transport commuters used; 6 where international students studied.\nGIẢI THÍCH CHI TIẾT: WH-clause giúp paraphrase object nhưng phải giữ nguyên meaning. How many dùng countable; how much dùng uncountable; what dùng loại/category; where dùng destination/location. Tránh đổi active/passive nếu làm mất tác nhân hoặc đối tượng.", "model": "1 how much money was spent on housing; 2 how many tourists visited France; 3 where inte iữ nguyên meaning. How many dùng countable; how much dùng uncountable; what dùng loại/category; where dùng destination/location. Tránh đổi active/passive nếu làm mất tác nhân hoặc đối tượng."}, {"answer": "where international students studied.", "why": "WH-clause giúp paraphrase object nhưng phải giữ nguyên meaning. How many dùng countable; how much dùng uncountable; what dùng loại/category; where dùng destination/location. Tránh đổi active/passive nếu làm mất tác nhân hoặc đối tượng."}]}, {"id": "EX06", "number": 6, "title": "Information → ONE Introduction sentence", "section": "Introduction", "body": "Instructions: Write ONE sentence only. Do not add trends, opinions, or detailed figures.\nTask A: line graph • percentage of households using the Internet • Canada • 2000–2020\n________________________________________________________________________________\nTask B: bar chart • spending on five categories • France • 2025\n________________________________________________________________________________\nTask C: table • international students at four universities • Australia • 2024\n________________________________________________________________________________\nTask D: two pie charts • household expenditure • UK • 2000 and 2020\n________________________________________________________________________________", "key": "ANSWER / MODEL: A. The line graph illustrates changes in the percentage of Canadian households using the Internet between 2000 and 2020.\nB. The bar chart compares spending on five categories in France in 2025.\nC. The table provides information about the number of international students at four Australian universities in 2024.\nD. The two pie charts show how household expenditure in the UK was distributed among different categories in 2000 and 2020.\nGIẢI THÍCH CHI TIẾT: Mỗi model chỉ làm một nhiệm vụ: paraphrase task. Không thêm 'increased', 'highest', số cụ thể hay opinion. Nếu source ghi chính xác five/six categories thì nên giữ; không tự thêm thông tin không có.", "model": "A. The line graph illustrates changes in the percentage of Canadian households using the Internet between 2000 and 2020.\nB. The bar chart compares spending on five categories in France in 2025.\nC. The table provides information about the number of international students at four Australian universities in 2024.\nD. The two pie charts show how household expenditure in the UK was distributed among different categories in 2000 and 2020.", "explanation": "Mỗi model chỉ làm một nhiệm vụ: paraphrase task. Không thêm 'increased', 'highest', số cụ thể hay opinion. Nếu source ghi chính xác five/six categories thì nên giữ; không tự thêm thông tin không có.", "qaNote": "", "mode": "writing", "count": 4, "labels": ["Task A", "Task B", "Task C", "Task D"], "choices": [], "expected": [], "objective": false, "objectiveCount": 0, "answers": [{"answer": "The line graph illustrates changes in the percentage of Canadian households using the Internet between 2000 and 2020.", "why": "Mỗi model chỉ làm một nhiệm vụ: paraphrase task. Không thêm 'increased', 'highest', số cụ thể hay opinion. Nếu source ghi chính xác five/six categories thì nên giữ; không tự thêm thông tin không có."}, {"answer": "The bar chart compares spending on five categories in France in 2025.", "why": "Mỗi model chỉ làm một nhiệm vụ: paraphrase task. Không thêm 'increased', 'highest', số cụ thể hay opinion. Nếu source ghi chính xác five/six categories thì nên giữ; không tự thêm thông tin không có."}, {"answer": "The table provides information about the number of international students at four Australian universities in 2024.", "why": "Mỗi model chỉ làm một nhiệm vụ: paraphrase task. Không thêm 'increased', 'highest', số cụ thể hay opinion. Nếu source ghi chính xác five/six categories thì nên giữ; không tự thêm thông tin không có."}, {"answer": "The two pie charts show how household expenditure in the UK was distributed among different categories in 2000 and 2020.", "why": "Mỗi model chỉ là pinion; 3 vague + unnatural 'information of'; 4 highest feature belongs Overview; 5 faulty clause after 'illustrates' plus exact detail; 6 'compare about' sai valency; 7 electricity uncountable → how much; 8 'gives us information' không sai tuyệt đối nhưng wordy/informal hơn; 9 personal/evaluative comment; 10 mixes Introduction with extreme detail. Khi task gốc thiếu trong isolated sentence, giáo viên nên chấm nguyên tắc hơn là bắt một noun phrase duy nhất."}]}, {"id": "EX08", "number": 8, "title": "GENERAL or DETAIL?", "section": "Overview", "body": "Instructions: Write G if suitable for an Overview; D if it belongs in a Body paragraph.\nAll four categories increased over the period. _____\nCar ownership rose from 35% to 62%. _____\nFrance remained the country with the highest proportion. _____\nGermany recorded 47% in 2015. _____\nThe two groups followed opposite trends. _____\nThe figure increased by 15 percentage points. _____\nCategory A experienced the greatest overall change. _____\nThe figure reached 82% in 2020. _____\nThe ranking of the categories changed considerably. _____\nB remained broadly stable throughout the period. _____", "key": "ANSWER / MODEL: 1 G; 2 D; 3 G; 4 D; 5 G; 6 D; 7 G; 8 D; 9 G; 10 G.\nGIẢI THÍCH CHI TIẾT: Overview ưu tiên pattern, extreme, relationship, stability, ranking change và largest change. Các câu có exact values hoặc exact change thường thuộc Body. 'B remained broadly stable throughout' là một main pattern dù không có số.", "model": "1 G; 2 D; 3 G; 4 D; 5 G; 6 D; 7 G; 8 D; 9 G; 10 G.", "explanation": "Overview ưu tiên pattern, extreme, relationship, stability, ranking change và largest change. Các câu có exact values hoặc exact change thường thuộc Body. 'B remained broadly stable throughout' là một main pattern dù không có số.", "qaNote": "", "mode": "choice", "count": 10, "labels": ["Câu 1", "Câu 2", "Câu 3", "Câu 4", "Câu 5", "Câu 6", "Câu 7", "Câu 8", "Câu 9", "Câu 10"], "choices": ["G", "D"], "expected": ["G", "D", "G", "D", "G", "D", "G", "D", "G", "G"], "objective": true, "objectiveCount": 10, "answers": [{"answer": "G", "why": "Cùng tăng là xu hướng tổng quát."}, {"answer": "D", "why": "35%→62% là số liệu cụ thể."}, {"answer": "G", "why": "Highest là thứ hạng nổi bật."}, {"answer": "D", "why": "47% tại năm 2015 là chi tiết."}, {"answer": "G", "why": "Xu hướng trái chiều là quan hệ chính."}, {"answer": "D", "why": "15 percentage points là mức thay đổi chính xác."}, {"answer": "G", "why": "Greatest change là đặc điểm nổi bật."}, {"answer": "D", "why": "82% ở 2020 là điểm dữ liệu."}, {"answer": "G", "why": "Thay đổi thứ hạng là quan hệ tổng quan."}, {"answer": "G", "why": "Broadly stable là xu hướng chung."}]}, {"id": "EX09", "number": 9, "title": "Turn DETAIL into OVERVIEW", "section": "Overview", "body": "Instructions: Generalise the data. Do not simply delete the numbers.\nA increased from 15% to 70%.\nB fell from 80% to 35%.\nC remained between 45% and 48%.\nA rose by 50 percentage points, more than any other category.\nFrance stayed above all other countries throughout.\nCars and trains increased, while buses and bicycles declined.\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________", "key": "ANSWER / MODEL: 1 A experienced a substantial overall increase.\n2 B declined markedly over the period.\n3 C remained broadly stable.\n4 A experienced the greatest overall increase.\n5 France remained the highest throughout the period.\n6 Cars and trains rose overall, whereas buses and bicycles declined.\nGIẢI THÍCH CHI TIẾT: Overview là abstraction. Không chỉ xóa số. Câu 4 phải giữ comparative significance 'greatest'; câu 5 giữ ranking; câu 6 đã là overview-ready vì thể hiện group pattern.", "model": "1 A experienced a substantial overall increase.\n2 B declined markedly over the period.\n3 C remained broadly stable.\n4 A experienced the greatest overall increase.\n5 France remained the highest throughout the period.\n6 Cars and trains rose overall, whereas buses and bicycles declined.", "explanation": "Overview là abstraction. Không chỉ xóa số. Câu 4 phải giữ comparative significance 'greatest'; câu 5 giữ ranking; câu 6 đã là overview-ready vì thể hiện group pattern.", "qaNote": "", "mode": "writing", "count": 6, "labels": ["Câu 1", "Câu 2", "Câu 3", "Câu 4", "Câu 5", "Câu 6"], "choices": [], "expected": [], "objective": false, "objectiveCount": 0, "answers": [{"answer": "A experienced a substantial overall increase.", "why": "Overview là abstraction. Không chỉ xóa số. Câu 4 phải giữ comparative significance 'greatest'; câu 5 giữ ranking; câu 6 đã là overview-ready vì thể hiện group pattern."}, {"answer": "B declined markedly over the period.", "why": "Overview là abstraction. Không chỉ xóa số. Câu 4 phải giữ comparative significance 'greatest'; câu 5 giữ ranking; câu 6 đã là overview-ready vì thể hiện group pattern."}, {"answer": "C remained broadly stable.", "why": "Overview là abstraction. Không chỉ xóa số. Câu 4 phải giữ comparative significance 'greatest'; câu 5 giữ ranking; câu 6 đã là overview-ready vì thể hiện group pattern."}, {"answer": "A experienced the greatest overall increase.", "why": "Overview là abstraction. Không chỉ xóa số. Câu 4 phải giữ comparative significance 'greatest'; câu 5 giữ ranking; câu 6 đã là overview-ready vì thể hiện group pattern."}, {"answer": "France remained the highest throughout the period.", "why": "Overview là abstraction. Không chỉ xóa số. Câu 4 phải giữ comparative significance 'greatest'; câu 5 giữ ranking; câu 6 đã là overview-ready vì thể hiện group pattern."}, {"answer": "Cars and trains rose overall, whereas buses and bicycles declined.", "why": "Overview là abstraction. Không chỉ xóa số. Câu 4 phải giữ comparative significance 'greatest'; câu 5 giữ ranking; câu 6 đã là overview-ready vì thể hiện group pattern."}]}, {"id": "EX10", "number": 10, "title": "Find the main trend", "section": "Overview", "body": "[TABLE]\nYEAR | A | B | C\n2000 | 20 | 60 | 40\n2010 | 35 | 50 | 42\n2020 | 60 | 30 | 45\nInstructions: Choose the best Overview statement, then write a second main feature.\nA. A was 20 in 2000.\nB. A increased considerably, while B followed the opposite trend.\nC. C was 45 in 2020.\nD. B fell by 30 units.\nSecond main feature:\n________________________________________________________________________________", "key": "ANSWER / MODEL: Best choice: B. Possible second feature: C remained relatively stable compared with the marked changes in A and B.\nGIẢI THÍCH CHI TIẾT: B khái quát quan hệ đối nghịch giữa A và B. A/C/D chỉ là data point hoặc exact change. Feature thứ hai nên nêu stability của C vì đó là pattern nổi bật khác.", "model": "Best choice: B. Possible second feature: C remained relatively stable compared with the marked changes in A and B.", "explanation": "B khái quát quan hệ đối nghịch giữa A và B. A/C/D chỉ là data point hoặc exact change. Feature thứ hai nên nêu stability của C vì đó là pattern nổi bật khác.", "qaNote": "", "mode": "writing", "count": 2, "labels": ["Best Overview statement", "Second main feature"], "choices": [], "expected": [], "objective": false, "objectiveCount": 0, "answers": [{"answer": "Best choice: B. Possible second feature: C remained relatively stable compared with the marked changes in A and B.", "why": "B khái quát quan hệ đối nghịch giữa A và B. A/C/D chỉ là data point hoặc exact change. Feature thứ hai nên nêu stability của C vì đó là pattern nổi bật khác."}]}, {"id": "EX11", "number": 11, "title": "Highest / Lowest without numbers", "section": "Overview", "body": "[TABLE]\nCOUNTRY | 2000 | 2020\nFrance | 60 | 75\nGermany | 45 | 55\nItaly | 30 | 50\nSpain | 20 | 35\nHighest overall feature:\n________________________________________________________________________________\nLowest overall feature:\n________________________________________________________________________________\nOne combined Overview sentence:\n________________________________________________________________________________", "key": "ANSWER / MODEL: Possible answers: France remained the highest of the four countries throughout the period. Spain recorded the lowest figures in both years. Combined: Overall, France consistently had the highest values, whereas Spain remained the lowest.\nGIẢI THÍCH CHI TIẾT: Không dùng 60/75/20/35 trong Overview. 'Throughout' hợp lý vì bảng chỉ cho hai mốc? Cẩn thận: nếu chart thực tế chỉ có 2000 và 2020, không thể suy ra mọi năm giữa hai mốc. Với bảng hai mốc, an toàn hơn: 'France had the highest figures in both years, while Spain had the lowest.' Đây là model ưu tiên data integrity.", "model": "Possible answers: France remained the highest of the four countries throughout the period. Spain recorded the lowest figures in both years. Combined: Overall, France consistently had the highest values, whereas Spain remained the lowest.", "explanation": "Không dùng 60/75/20/35 trong Overview. 'Throughout' hợp lý vì bảng chỉ cho hai mốc? Cẩn thận: nếu chart thực tế chỉ có 2000 và 2020, không thể suy ra mọi năm giữa hai mốc. Với bảng hai mốc, an toàn hơn: 'France had the highest figures in both years, while Spain had the lowest.' Đây là model ưu tiên data integrity.", "qaNote": "Bảng chỉ có 2000 và 2020: viết “in both years”, không suy ra thứ hạng trong mọi năm ở giữa.", "mode": "writing", "count": 3, "labels": ["Highest", "Lowest", "Combined overview"], "choices": [], "expected": [], "objective": false, "objectiveCount": 0, "answers": [{"answer": "Possible answers: France remained the highest of the four countries throughout the period. Spain recorded the lowest figures in both years. Combined: Overall, France consistently had the highest values, whereas Spain remained the lowest.", "why": "Không dùng 60/75/20/35 trong Overview. 'Throughout' hợp lý vì bảng chỉ cho hai mốc? Cẩn thận: nếu chart thực tế chỉ có 2000 và 2020, không thể suy ra mọi năm giữa hai mốc. Với bảng hai mốc, an toàn hơn: 'France had the highest figures in both years, while Spain had the lowest.' Đây là model ưu tiên data integrity."}]}, {"id": "EX12", "number": 12, "title": "Greatest change", "section": "Overview", "body": "[TABLE]\nCATEGORY | START | END\nA | 20 | 70\nB | 50 | 60\nC | 80 | 40\nD | 35 | 40\nA changed by ____   B changed by ____   C changed by ____   D changed by ____\nGreatest absolute change: __________\nOverview feature:\n________________________________________________________________________________", "key": "ANSWER / MODEL: A=50; B=10; C=40; D=5. Greatest absolute change: A. Model: Overall, A experienced the greatest change, rising substantially over the period.\nGIẢI THÍCH CHI TIẾT: Absolute change = |end-start|. Không nhầm 'C started highest' với 'C changed most'. A thay đổi 50 units, lớn hơn C 40. Nếu đơn vị là percentage, gọi 50 percentage points chứ không mặc định 50% relative change.", "model": "A=50; B=10; C=40; D=5. Greatest absolute change: A. Model: Overall, A experienced the greatest change, rising substantially over the period.", "explanation": "Absolute change = |end-start|. Không nhầm 'C started highest' với 'C changed most'. A thay đổi 50 units, lớn hơn C 40. Nếu đơn vị là percentage, gọi 50 percentage points chứ không mặc định 50% relative change.", "qaNote": "", "mode": "writing", "count": 3, "labels": ["Changes for A/B/C/D", "Greatest absolute change", "Overview feature"], "choices": [], "expected": [], "objective": false, "objectiveCount": 0, "answers": [{"answer": "A=50; B=10; C=40; D=5. Greatest absolute change: A. Model: Overall, A experienced the greatest change, rising substantially over the period.", "why": "Absolute change = |end-start|. Không nhầm 'C started highest' với 'C changed most'. A thay đổi 50 units, lớn hơn C 40. Nếu đơn vị là percentage, gọi 50 percentage points chứ không mặc định 50% relative change."}]}, {"id": "EX13", "number": 13, "title": "Select the TWO best features", "section": "Overview", "body": "[TABLE]\nYEAR | CARS | TRAINS | BUSES | CYCLING\n2000 | 30 | 20 | 45 | 10\n2020 | 65 | 40 | 25 | 8\nA. Cars increased.\nB. Cars became the highest category.\nC. Trains increased by 20 units.\nD. Buses declined.\nE. Cycling fell slightly.\nF. Cars and trains rose, whereas buses and cycling fell.\nG. Cars showed the largest increase.\nFeature 1: ______    Feature 2: ______\nWhy are the other statements less suitable for the Overview?\n________________________________________________________________________________\n________________________________________________________________________________", "key": "ANSWER / MODEL: Best pair: F + G. F = cars and trains rose while buses and cycling fell; G = cars showed the largest increase. B is also defensible as an extreme/ranking feature, especially if teacher wants 'highest at end'.\nGIẢI THÍCH CHI TIẾT: F bao quát cả bốn series bằng một relationship. G nêu magnitude nổi bật. B cũng là strong overview feature; vì Overview selection không phải one-answer tuyệt đối, chấp nhận F+B nếu học sinh diễn đạt chính xác. A/C/D/E quá riêng lẻ hoặc quá chi tiết.", "model": "Best pair: F + G. F = cars and trains rose while buses and cycling fell; G = cars showed the largest increase. B is also defensible as an extreme/ranking feature, especially if teacher wants 'highest at end'.", "explanation": "F bao quát cả bốn series bằng một relationship. G nêu magnitude nổi bật. B cũng là strong overview feature; vì Overview selection không phải one-answer tuyệt đối, chấp nhận F+B nếu học sinh diễn đạt chính xác. A/C/D/E quá riêng lẻ hoặc quá chi tiết.", "qaNote": "F + G là lựa chọn ưu tiên; F + B cũng hợp lý nếu giải thích đúng thứ hạng cuối kỳ.", "mode": "writing", "count": 3, "labels": ["Feature 1", "Feature 2", "Why the other statements are less suitable"], "choices": [], "expected": [], "objective": false, "objectiveCount": 0, "answers": [{"answer": "Best pair: F + G. F = cars and trains rose while buses and cycling fell; G = cars showed the largest increase. B is also defensible as an extreme/ranking feature, especially if teacher wants 'highest at end'.", "why": "F bao quát cả bốn series bằng một relationship. G nêu magnitude nổi bật. B cũng là strong overview feature; vì Overview selection không phải one-answer tuyệt đối, chấp nhận F+B nếu học sinh diễn đạt chính xác. A/C/D/E quá riêng lẻ hoặc quá chi tiết."}]}, {"id": "EX14", "number": 14, "title": "Write TWO Overview sentences", "section": "Overview", "body": "Instructions: Use Exercise 13. Sentence 1 = main trend/relationship. Sentence 2 = extreme/greatest change/notable ranking. No specific numbers.\nSentence 1:\n________________________________________________________________________________\nSentence 2:\n________________________________________________________________________________", "key": "ANSWER / MODEL: Model: Overall, car and train use increased over the period, whereas the figures for buses and cycling declined. Cars experienced the most substantial rise and became the most widely used mode by the end.\nGIẢI THÍCH CHI TIẾT: Câu 1 = global pattern; câu 2 = magnitude + final ranking. Không có exact figures. 'became' hợp lý vì cars bắt đầu dưới buses nhưng kết thúc cao nhất.", "model": "Model: Overall, car and train use increased over the period, whereas the figures for buses and cycling declined. Cars experienced the most substantial rise and became the most widely used mode by the end.", "explanation": "Câu 1 = global pattern; câu 2 = magnitude + final ranking. Không có exact figures. 'became' hợp lý vì cars bắt đầu dưới buses nhưng kết thúc cao nhất.", "qaNote": "", "mode": "writing", "count": 2, "labels": ["Overview sentence 1", "Overview sentence 2"], "choices": [], "expected": [], "objective": false, "objectiveCount": 0, "answers": [{"answer": "Model: Overall, car and train use increased over the period, whereas the figures for buses and cycling declined. Cars experienced the most substantial rise and became the most widely used mode by the end.", "why": "Câu 1 = global pattern; câu 2 = magnitude + final ranking. Không có exact figures. 'became' hợp lý vì cars bắt đầu dưới buses nhưng kết thúc cao nhất."}]}, {"id": "EX15", "number": 15, "title": "Overview Error Clinic", "section": "Overview", "body": "Instructions: Write KEEP or REVISE. If revise, diagnose: too detailed / vague / listing / opinion / number / weak feature.\nOverall, cars increased from 30% to 65%.\nOverall, it can clearly be seen that the chart shows some interesting trends.\nOverall, cars rose, buses fell, trains rose and cycling fell.\nIt is clear that 65% of people used cars in 2020.\nOverall, all figures changed during the period.\nOverall, cars were 30%, trains 20%, buses 45% and cycling 10% initially.\nOverall, I think cars became more popular.\nIt is noticeable that cars increased by exactly 35 percentage points.\nOverall, the most important thing is that the graph changed a lot.\nOverall, cars and trains increased, while the other two modes declined. Cars also experienced the greatest rise.\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________", "key": "ANSWER / MODEL: 1 REVISE; 2 REVISE; 3 REVISE; 4 REVISE; 5 REVISE; 6 REVISE; 7 REVISE; 8 REVISE; 9 REVISE; 10 KEEP.\nGIẢI THÍCH CHI TIẾT: 1/4/6/8 có số cụ thể; 2/5/9 quá vague; 3 là listing thay vì grouping (nên 'cars and trains rose, while...'); 7 opinion marker 'I think'; 10 có main trend + greatest rise, đúng chức năng. Câu 10 có thể tinh gọn nhưng không cần sửa về nguyên tắc.", "model": "1 REVISE; 2 REVISE; 3 REVISE; 4 REVISE; 5 REVISE; 6 REVISE; 7 REVISE; 8 REVISE; 9 REVISE; 10 KEEP.", "explanation": "1/4/6/8 có số cụ thể; 2/5/9 quá vague; 3 là listing thay vì grouping (nên 'cars and trains rose, while...'); 7 opinion marker 'I think'; 10 có main trend + greatest rise, đúng chức năng. Câu 10 có thể tinh gọn nhưng không cần sửa về nguyên tắc.", "qaNote": "", "mode": "writing", "count": 10, "labels": ["Câu 1", "Câu 2", "Câu 3", "Câu 4", "Câu 5", "Câu 6", "Câu 7", "Câu 8", "Câu 9", "Câu 10"], "choices": [], "expected": [], "objective": false, "objectiveCount": 0, "answers": [{"answer": "REVISE", "why": "1/4/6/8 có số cụ thể; 2/5/9 quá vague; 3 là listing thay vì grouping (nên 'cars and trains rose, while...'); 7 opinion marker 'I think'; 10 có main trend + greatest rise, đúng chức năng. Câu 10 có thể tinh gọn nhưng không cần sửa về nguyên tắc."}, {"answer": "REVISE", "why": "1/4/6/8 có số cụ thể; 2/5/9 quá vague; 3 là listing thay vì grouping (nên 'cars and trains rose, while...'); 7 opinion marker 'I think'; 10 có main trend + greatest rise, đúng chức năng. Câu 10 có thể tinh gọn nhưng không cần sửa về nguyên tắc."}, {"answer": "REVISE", "why": "1/4/6/8 có số cụ thể; 2/5/9 quá vague; 3 là listing thay vì grouping (nên 'cars and trains rose, while...'); 7 opinion marker 'I think'; 10 có main trend + greatest rise, đúng chức năng. Câu 10 có thể tinh gọn nhưng không cần sửa về nguyên tắc."}, {"answer": "REVISE", "why": "1/4/6/8 có số cụ thể; 2/5/9 quá vague; 3 là listing thay vì grouping (nên 'cars and trains rose, while...'); 7 opinion marker 'I think'; 10 có main trend + greatest rise, đúng chức năng. Câu 10 có thể tinh gọn nhưng không cần sửa về nguyên tắc."}, {"answer": "REVISE", "why": "1/4/6/8 có số cụ thể; 2/5/9 quá vague; 3 là listing thay vì grouping (nên 'cars and trains rose, while...'); 7 opinion marker 'I think'; 10 có main trend + greatest rise, đúng chức năng. Câu 10 có thể tinh gọn nhưng không cần sửa về nguyên tắc."}, {"answer": "REVISE", "why": "1/4/6/8 có số cụ thể; 2/5/9 quá vague; 3 là listing thay vì grouping (nên 'cars and trains rose, while...'); 7 opinion marker 'I think'; 10 có main trend + greatest rise, đúng chức năng. Câu 10 có thể tinh gọn nhưng không cần sửa về nguyên tắc."}, {"answer": "REVISE", "why": "1/4/6/8 có số cụ thể; 2/5/9 quá vague; 3 là listing thay vì grouping (nên 'cars and trains rose, while...'); 7 opinion marker 'I think'; 10 có main trend + greatest rise, đúng chức năng. Câu 10 có thể tinh gọn nhưng không cần sửa về nguyên tắc."}, {"answer": "REVISE", "why": "1/4/6/8 có số cụ thể; 2/5/9 quá vague; 3 là listing thay vì grouping (nên 'cars and trains rose, while...'); 7 opinion marker 'I think'; 10 có main trend + greatest rise, đúng chức năng. Câu 10 có thể tinh gọn nhưng không cần sửa về nguyên tắc."}, {"answer": "REVISE", "why": "1/4/6/8 có số cụ thể; 2/5/9 quá vague; 3 là listing thay vì grouping (nên 'cars and trains rose, while...'); 7 opinion marker 'I think'; 10 có main trend + greatest rise, đúng chức năng. Câu 10 có thể tinh gọn nhưng không cần sửa về nguyên tắc."}, {"answer": "KEEP.", "why": "1/4/6/8 có số cụ thể; 2/5/9 quá vague; 3 là listing thay vì grouping (nên 'cars and trains rose, while...'); 7 opinion marker 'I think'; 10 có main trend + greatest rise, đúng chức năng. Câu 10 có thể tinh gọn nhưng không cần sửa về nguyên tắc."}]}, {"id": "EX16", "number": 16, "title": "Which Overview is better?", "section": "Overview", "body": "Version A: Overall, A rose from 20% to 60%, B declined from 60% to 30%, and C increased from 40% to 45%.\nVersion B: Overall, A increased markedly while B followed the opposite trend. C, by contrast, remained relatively stable.\nBetter overview: ______\nWhy? □ identifies patterns  □ avoids specific figures  □ prioritises main features  □ all of the above", "key": "ANSWER / MODEL: Version B; all of the above.\nGIẢI THÍCH CHI TIẾT: B nêu patterns và relative stability, không data dump. Version A chính xác nhưng giống Body vì liệt kê exact start/end values.", "model": "Version B; all of the above.", "explanation": "B nêu patterns và relative stability, không data dump. Version A chính xác nhưng giống Body vì liệt kê exact start/end values.", "qaNote": "", "mode": "writing", "count": 2, "labels": ["Better version", "Why?"], "choices": [], "expected": [], "objective": false, "objectiveCount": 0, "answers": [{"answer": "Version B; all of the above.", "why": "B nêu patterns và relative stability, không data dump. Version A chính xác nhưng giống Body vì liệt kê exact start/end values."}]}, {"id": "EX17", "number": 17, "title": "Body or Overview?", "section": "Body organisation", "body": "Instructions: Write O (Overview) or B (Body).\nFrance remained the highest throughout. _____\nFrance rose from 45% to 68%. _____\nA and B followed opposite trends. _____\nB declined to 35% in 2020. _____\nC showed the greatest overall change. _____\nC increased by 25 percentage points. _____\nAll three categories rose overall. _____\nA reached 50% in 2015 before climbing further. _____", "key": "ANSWER / MODEL: 1 O; 2 B; 3 O; 4 B; 5 O; 6 B; 7 O; 8 B.\nGIẢI THÍCH CHI TIẾT: Overview = general pattern/extreme/change; Body = exact values, time points, detailed movement. Câu 8 có exact midpoint và sequence nên Body.", "model": "1 O; 2 B; 3 O; 4 B; 5 O; 6 B; 7 O; 8 B.", "explanation": "Overview = general pattern/extreme/change; Body = exact values, time points, detailed movement. Câu 8 có exact midpoint và sequence nên Body.", "qaNote": "", "mode": "choice", "count": 8, "labels": ["Câu 1", "Câu 2", "Câu 3", "Câu 4", "Câu 5", "Câu 6", "Câu 7", "Câu 8"], "choices": ["O", "B"], "expected": ["O", "B", "O", "B", "O", "B", "O", "B"], "objective": true, "objectiveCount": 8, "answers": [{"answer": "O", "why": "Highest throughout là cực trị chung."}, {"answer": "B", "why": "45%→68% là dữ liệu cụ thể."}, {"answer": "O", "why": "Opposite trends là quan hệ khái quát."}, {"answer": "B", "why": "35% ở 2020 thuộc Body."}, {"answer": "O", "why": "Greatest change là đặc điểm chính."}, {"answer": "B", "why": "25 percentage points là số cụ thể."}, {"answer": "O", "why": "All three rose là xu hướng tổng quan."}, {"answer": "B", "why": "50% ở 2015 là mốc chi tiết."}]}, {"id": "EX18", "number": 18, "title": "Group by TIME", "section": "Body organisation", "body": "[TABLE]\nCATEGORY | 2000 | 2010 | 2020\nA | 70 | 60 | 50\nB | 50 | 55 | 65\nC | 30 | 45 | 60\nD | 20 | 25 | 30\nBody 1 – information / comparison focus:\n________________________________________________________________________________\n________________________________________________________________________________\nBody 2 – information / trend focus:\n________________________________________________________________________________\n________________________________________________________________________________", "key": "ANSWER / MODEL: Model plan: Body 1 focuses on the initial and middle years, comparing the ranking in 2000 and notable convergence/change by 2010. Body 2 focuses on the final year and the overall directions: A declines, while B, C and D rise.\nGIẢI THÍCH CHI TIẾT: Time-based grouping hợp lệ nhưng phải có purpose. Không nên Body 1 chỉ chép 2000 và Body 2 chỉ chép 2020 nếu bỏ mất meaningful midpoint. 2010 đáng dùng vì C gần B và A vẫn dẫn đầu.", "model": "Model plan: Body 1 focuses on the initial and middle years, comparing the ranking in 2000 and notable convergence/change by 2010. Body 2 focuses on the final year and the overall directions: A declines, while B, C and D rise.", "explanation": "Time-based grouping hợp lệ nhưng phải có purpose. Không nên Body 1 chỉ chép 2000 và Body 2 chỉ chép 2020 nếu bỏ mất meaningful midpoint. 2010 đáng dùng vì C gần B và A vẫn dẫn đầu.", "qaNote": "", "mode": "writing", "count": 2, "labels": ["Body 1 focus", "Body 2 focus"], "choices": [], "expected": [], "objective": false, "objectiveCount": 0, "answers": [{"answer": "Model plan: Body 1 focuses on the initial and middle years, comparing the ranking in 2000 and notable convergence/change by 2010. Body 2 focuses on the final year and the overall directions: A declines, while B, C and D rise.", "why": "Time-based grouping hợp lệ nhưng phải có purpose. Không nên Body 1 chỉ chép 2000 và Body 2 chỉ chép 2020 nếu bỏ mất meaningful midpoint. 2010 đáng dùng vì C gần B và A vẫn dẫn đầu."}]}, {"id": "EX19", "number": 19, "title": "Group by TREND", "section": "Body organisation", "body": "Instructions: Use the same data as Exercise 18.\nBody 1 – declining/stable group: ____________________\nBody 2 – increasing group: _________________________\nWhich grouping is clearer for this data: TIME or TREND? Why?\n________________________________________________________________________________\n________________________________________________________________________________", "key": "ANSWER / MODEL: Body 1: A (declining). Body 2: B, C and D (increasing). For this data, TREND grouping is generally clearer because three variables share an upward direction while A moves oppositely.\nGIẢI THÍCH CHI TIẾT: Không có stable group thật sự. Grouping theo trend làm comparison tự nhiên hơn: A contrast với three risers. Tuy nhiên time grouping vẫn có thể đạt band cao nếu coherent và chọn detail tốt.", "model": "Body 1: A (declining). Body 2: B, C and D (increasing). For this data, TREND grouping is generally clearer because three variables share an upward direction while A moves oppositely.", "explanation": "Không có stable group thật sự. Grouping theo trend làm comparison tự nhiên hơn: A contrast với three risers. Tuy nhiên time grouping vẫn có thể đạt band cao nếu coherent và chọn detail tốt.", "qaNote": "", "mode": "writing", "count": 3, "labels": ["Body 1 group", "Body 2 group", "Which grouping is clearer? Why?"], "choices": [], "expected": [], "objective": false, "objectiveCount": 0, "answers": [{"answer": "Body 1: A (declining). Body 2: B, C and D (increasing). For this data, TREND grouping is generally clearer because three variables share an upward direction while A moves oppositely.", "why": "Không có stable group thật sự. Grouping theo trend làm comparison tự nhiên hơn: A contrast với three risers. Tuy nhiên time grouping vẫn có thể đạt band cao nếu coherent và chọn detail tốt."}]}, {"id": "EX20", "number": 20, "title": "Choose the better grouping", "section": "Body organisation", "body": "[TABLE]\nYEAR | A | B | C | D\n2000 | 20 | 25 | 70 | 65\n2010 | 40 | 45 | 50 | 48\n2020 | 65 | 70 | 30 | 25\nPlan A: Body 1 = A+B; Body 2 = C+D\nPlan B: Body 1 = all 2000 data; Body 2 = all 2020 data\nBetter plan: ______\nWhy? ______________________________\nRelationship connecting A+B: __________________\nRelationship connecting C+D: __________________\nContrast between the two bodies: __________________", "key": "ANSWER / MODEL: Plan A. A+B both rise strongly and remain close to each other; C+D both decline strongly and remain close. The two bodies therefore form a clear upward-vs-downward contrast.\nGIẢI THÍCH CHI TIẾT: Plan A tận dụng parallel trends. Plan B có thể dùng nhưng kém hiệu quả vì tách start/end khiến reader phải tự nối trend. Với dataset này trend-based grouping tạo coherence tốt hơn.", "model": "Plan A. A+B both rise strongly and remain close to each other; C+D both decline strongly and remain close. The two bodies therefore form a clear upward-vs-downward contrast.", "explanation": "Plan A tận dụng parallel trends. Plan B có thể dùng nhưng kém hiệu quả vì tách start/end khiến reader phải tự nối trend. Với dataset này trend-based grouping tạo coherence tốt hơn.", "qaNote": "", "mode": "writing", "count": 5, "labels": ["Better plan", "Why?", "A+B relationship", "C+D relationship", "Contrast between bodies"], "choices": [], "expected": [], "objective": false, "objectiveCount": 0, "answers": [{"answer": "Plan A. A+B both rise strongly and remain close to each other; C+D both decline strongly and remain close. The two bodies therefore form a clear upward-vs-downward contrast.", "why": "Plan A tận dụng parallel trends. Plan B có thể dùng nhưng kém hiệu quả vì tách start/end khiến reader phải tự nối trend. Với dataset này trend-based grouping tạo coherence tốt hơn."}]}, {"id": "EX21", "number": 21, "title": "Don't group randomly", "section": "Body organisation", "body": "Instructions: Data: A ↑ strongly; B ↑ moderately; C ↓ strongly; D ↓ slightly. Write GOOD or BAD and explain BAD plans.\nBody 1: A+B; Body 2: C+D. _____\nBody 1: A+C; Body 2: B+D. _____\nBody 1: A+D; Body 2: B+C. _____\nBody 1: all starting values; Body 2: all ending values. _____\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________", "key": "ANSWER / MODEL: 1 GOOD. 2 BAD. 3 BAD. 4 POSSIBLE but usually weaker for this pattern.\nGIẢI THÍCH CHI TIẾT: A+B share increases; C+D share decreases. Plans 2–3 trộn opposite trends nên mỗi paragraph thiếu unifying idea. Plan 4 có logic thời gian nhưng nếu chỉ start/end, nó làm comparison of change khó theo dõi; chỉ chọn khi time-based organisation thực sự giúp chart.", "model": "1 GOOD. 2 BAD. 3 BAD. 4 POSSIBLE but usually weaker for this pattern.", "explanation": "A+B share increases; C+D share decreases. Plans 2–3 trộn opposite trends nên mỗi paragraph thiếu unifying idea. Plan 4 có logic thời gian nhưng nếu chỉ start/end, nó làm comparison of change khó theo dõi; chỉ chọn khi time-based organisation thực sự giúp chart.", "qaNote": "", "mode": "writing", "count": 4, "labels": ["Plan 1", "Plan 2", "Plan 3", "Plan 4"], "choices": [], "expected": [], "objective": false, "objectiveCount": 0, "answers": [{"answer": "1 GOOD. 2 BAD. 3 BAD. 4 POSSIBLE but usually weaker for this pattern.", "why": "A+B share increases; C+D share decreases. Plans 2–3 trộn opposite trends nên mỗi paragraph thiếu unifying idea. Plan 4 có logic thời gian nhưng nếu chỉ start/end, nó làm comparison of change khó theo dõi; chỉ chọn khi time-based organisation thực sự giúp chart."}]}, {"id": "EX22", "number": 22, "title": "Select Body details", "section": "Body organisation", "body": "Instructions: Body focus: A and B both increased. Select the facts that support this paragraph.\nA. A = 20% initially.\nB. A = 65% finally.\nC. A's line is blue.\nD. B = 25% initially.\nE. B = 70% finally.\nF. The graph was published in 2025.\nG. A and B rose at similar rates.\nH. C declined.\nI. A overtook C in 2015.\nSelected facts: ______________________________", "key": "ANSWER / MODEL: Core selections: A, B, D, E, G. I may also be included if the overtaking point is a meaningful feature and space allows. Exclude C and F. H belongs to the other group/body.\nGIẢI THÍCH CHI TIẾT: Body A+B cần start/end values + shared pattern. Colour của line và publication date không phải data feature. C's decline không thuộc focus. Overtaking point là optional significant midpoint, không bắt buộc.", "model": "Core selections: A, B, D, E, G. I may also be included if the overtaking point is a meaningful feature and space allows. Exclude C and F. H belongs to the other group/body.", "explanation": "Body A+B cần start/end values + shared pattern. Colour của line và publication date không phải data feature. C's decline không thuộc focus. Overtaking point là optional significant midpoint, không bắt buộc.", "qaNote": "I (A overtook C) có thể đưa vào nếu đó là mốc quan trọng; không bắt buộc.", "mode": "writing", "count": 1, "labels": ["Bài làm"], "choices": [], "expected": [], "objective": false, "objectiveCount": 0, "answers": [{"answer": "Core selections: A, B, D, E, G. I may also be included if the overtaking point is a meaningful feature and space allows. Exclude C and F. H belongs to the other group/body.", "why": "Body A+B cần start/end values + shared pattern. Colour của line và publication date không phải data feature. C's decline không thuộc focus. Overtaking point là optional significant midpoint, không bắt buộc."}]}, {"id": "EX23", "number": 23, "title": "Order the details", "section": "Body organisation", "body": "Instructions: Put the sentences into a logical Body paragraph.\nA. By 2020, this figure had reached 65%.\nB. A stood at only 20% in 2000.\nC. B followed a similar pattern, rising from 25% to 70%.\nD. It then climbed steadily over the next two decades.\nOrder: _____ → _____ → _____ → _____\nReference: __________   Cohesion: __________   Comparison: __________", "key": "ANSWER / MODEL: Order: B → D → A → C. Reference: 'this figure' in A refers to A's value. Cohesion: 'It then' in D. Comparison: C introduces B as a similar pattern.\nGIẢI THÍCH CHI TIẾT: Start with baseline, describe movement, give endpoint, then compare the second series. This produces a readable information chain instead of switching subjects randomly.", "model": "Order: B → D → A → C. Reference: 'this figure' in A refers to A's value. Cohesion: 'It then' in D. Comparison: C introduces B as a similar pattern.", "explanation": "Start with baseline, describe movement, give endpoint, then compare the second series. This produces a readable information chain instead of switching subjects randomly.", "qaNote": "", "mode": "writing", "count": 2, "labels": ["Sentence order", "Reference, cohesion and comparison"], "choices": [], "expected": [], "objective": false, "objectiveCount": 0, "answers": [{"answer": "Order: B → D → A → C. Reference: 'this figure' in A refers to A's value. Cohesion: 'It then' in D. Comparison: C introduces B as a similar pattern.", "why": "Start with baseline, describe movement, give endpoint, then compare the second series. This produces a readable information chain instead of switching subjects randomly."}]}, {"id": "EX24", "number": 24, "title": "Write Body 1 from a plan", "section": "Body organisation", "body": "[TABLE]\nYEAR | A | B\n2000 | 20% | 25%\n2010 | 40% | 45%\n2020 | 65% | 70%\nInstructions: Body 1 = A+B because both increase similarly. Write 3–4 sentences with starting comparison, trend, ending data, similarity, and cohesive reference.\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________", "key": "ANSWER / MODEL: Model: A stood at 20% in 2000, slightly below B at 25%. The figure for A then rose steadily to 40% in 2010 before reaching 65% by 2020. B followed a very similar pattern, increasing from 25% to 45% and then to 70% over the same period.\nGIẢI THÍCH CHI TIẾT: Model uses start comparison, chronological detail and similarity. It does not need one sentence for every cell. 'The figure for A' and 'B followed...' create cohesion.", "model": "Model: A stood at 20% in 2000, slightly below B at 25%. The figure for A then rose steadily to 40% in 2010 before reaching 65% by 2020. B followed a very similar pattern, increasing from 25% to 45% and then to 70% over the same period.", "explanation": "Model uses start comparison, chronological detail and similarity. It does not need one sentence for every cell. 'The figure for A' and 'B followed...' create cohesion.", "qaNote": "", "mode": "writing", "count": 1, "labels": ["Bài làm"], "choices": [], "expected": [], "objective": false, "objectiveCount": 0, "answers": [{"answer": "Model: A stood at 20% in 2000, slightly below B at 25%. The figure for A then rose steadily to 40% in 2010 before reaching 65% by 2020. B followed a very similar pattern, increasing from 25% to 45% and then to 70% over the same period.", "why": "Model uses start comparison, chronological detail and similarity. It does not need one sentence for every cell. 'The figure for A' and 'B followed...' create cohesion."}]}, {"id": "EX25", "number": 25, "title": "Write Body 2 from a plan", "section": "Body organisation", "body": "[TABLE]\nYEAR | C | D\n2000 | 70% | 65%\n2010 | 50% | 48%\n2020 | 30% | 25%\nInstructions: Body 2 = C+D because both decline similarly. Write 3–4 sentences with initial values, shared decline, final values, comparison, and cohesion.\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________", "key": "ANSWER / MODEL: Model: C was the higher of the two categories initially, at 70%, compared with 65% for D. Both figures then declined steadily, with C falling to 50% in 2010 and D to 48%. By 2020, they had dropped further to 30% and 25%, respectively.\nGIẢI THÍCH CHI TIẾT: 'Respectively' maps C→30 and D→25 in the same order. The paragraph groups similar declines and uses exact figures as evidence.", "model": "Model: C was the higher of the two categories initially, at 70%, compared with 65% for D. Both figures then declined steadily, with C falling to 50% in 2010 and D to 48%. By 2020, they had dropped further to 30% and 25%, respectively.", "explanation": "'Respectively' maps C→30 and D→25 in the same order. The paragraph groups similar declines and uses exact figures as evidence.", "qaNote": "", "mode": "writing", "count": 1, "labels": ["Bài làm"], "choices": [], "expected": [], "objective": false, "objectiveCount": 0, "answers": [{"answer": "Model: C was the higher of the two categories initially, at 70%, compared with 65% for D. Both figures then declined steadily, with C falling to 50% in 2010 and D to 48%. By 2020, they had dropped further to 30% and 25%, respectively.", "why": "'Respectively' maps C→30 and D→25 in the same order. The paragraph groups similar declines and uses exact figures as evidence."}]}, {"id": "EX26", "number": 26, "title": "Introduction or Overview?", "section": "Introduction + Overview", "body": "Instructions: Write I (Introduction), O (Overview), or X (Neither).\nThe line graph compares the percentages of commuters using four forms of transport between 2000 and 2020. _____\nOverall, cars and trains became more widely used, whereas the other modes declined. _____\nCars accounted for exactly 65% in 2020. _____\nThe chart is very interesting. _____\nCars experienced the greatest increase overall. _____\nThe graph below gives information about transport. _____\nThe line graph illustrates changes in four transport categories over a twenty-year period. _____\nOverall, there were several changes. _____", "key": "ANSWER / MODEL: 1 I; 2 O; 3 X; 4 X; 5 O; 6 X; 7 I; 8 X.\nGIẢI THÍCH CHI TIẾT: 3 exact detail belongs Body. 4 opinion. 6 too vague to be a strong Introduction because object is underspecified. 8 vague Overview with no meaningful feature.", "model": "1 I; 2 O; 3 X; 4 X; 5 O; 6 X; 7 I; 8 X.", "explanation": "3 exact detail belongs Body. 4 opinion. 6 too vague to be a strong Introduction because object is underspecified. 8 vague Overview with no meaningful feature.", "qaNote": "", "mode": "choice", "count": 8, "labels": ["Câu 1", "Câu 2", "Câu 3", "Câu 4", "Câu 5", "Câu 6", "Câu 7", "Câu 8"], "choices": ["I", "O", "X"], "expected": ["I", "O", "X", "X", "O", "X", "I", "X"], "objective": true, "objectiveCount": 8, "answers": [{"answer": "I", "why": "Loại biểu đồ, đối tượng và thời gian là Introduction."}, {"answer": "O", "why": "Các nhóm tăng/giảm trái chiều là Overview."}, {"answer": "X", "why": "Exactly 65% là chi tiết Body."}, {"answer": "X", "why": "Interesting là ý kiến chủ quan."}, {"answer": "O", "why": "Greatest increase là đặc điểm Overview."}, {"answer": "X", "why": "Transport chưa xác định rõ đối tượng, quá mơ hồ."}, {"answer": "I", "why": "Loại biểu đồ, bốn nhóm và khoảng thời gian xác định task."}, {"answer": "X", "why": "Several changes không chỉ ra đặc điểm đáng chú ý."}]}, {"id": "EX27", "number": 27, "title": "Write Introduction + Overview", "section": "Introduction + Overview", "body": "Instructions: Task: line graph; percentage of commuters; cars, trains, buses, bicycles; 2000–2020; Australia. Patterns: cars+trains ↑; buses+bicycles ↓; cars largest increase; cars highest at end.\nIntroduction – ONE sentence:\n________________________________________________________________________________\nOverview – TWO sentences:\n________________________________________________________________________________\n________________________________________________________________________________", "key": "ANSWER / MODEL: Introduction: The line graph compares the percentages of commuters using cars, trains, buses and bicycles in Australia between 2000 and 2020.\nOverview: Overall, car and train use increased, whereas the proportions travelling by bus and bicycle declined. Cars recorded the largest rise and became the most widely used mode by the end of the period.\nGIẢI THÍCH CHI TIẾT: Introduction only paraphrases task. Overview gives group trend + strongest change/final extreme. No exact values.", "model": "Introduction: The line graph compares the percentages of commuters using cars, trains, buses and bicycles in Australia between 2000 and 2020.\nOverview: Overall, car and train use increased, whereas the proportions travelling by bus and bicycle declined. Cars recorded the largest rise and became the most widely used mode by the end of the period.", "explanation": "Introduction only paraphrases task. Overview gives group trend + strongest change/final extreme. No exact values.", "qaNote": "", "mode": "writing", "count": 2, "labels": ["Introduction", "Overview"], "choices": [], "expected": [], "objective": false, "objectiveCount": 0, "answers": [{"answer": "Introduction: The line graph compares the percentages of commuters using cars, trains, buses and bicycles in Australia between 2000 and 2020.\nOverview: Overall, car and train use increased, whereas the proportions travelling by bus and bicycle declined. Cars recorded the largest rise and became the most widely used mode by the end of the period.", "why": "Introduction only paraphrases task. Overview gives group trend + strongest change/final extreme. No exact values."}]}, {"id": "EX28", "number": 28, "title": "Bad Introduction + Overview Repair", "section": "Introduction + Overview", "body": "The line graph below shows that cars increased a lot in Australia from 2000 to 2020. In my opinion, cars were clearly the best transport. Overall, cars rose from 30% to 65%, while trains increased from 20% to 40%. Buses declined from 45% to 25%, and bicycles fell from 10% to 8%.\nInstructions: Rewrite as ONE Introduction sentence + TWO Overview sentences. Then identify detailed data, opinion, trend wrongly placed in Introduction, and over-detailed Overview.\nIntroduction:\n________________________________________________________________________________\nOverview:\n________________________________________________________________________________\n________________________________________________________________________________", "key": "ANSWER / MODEL: Introduction: The line graph compares the percentages of commuters using four forms of transport in Australia between 2000 and 2020.\nOverview: Overall, car and train use increased over the period, while bus and bicycle use declined. Cars showed the most substantial growth and became the leading mode by the end.\nGIẢI THÍCH CHI TIẾT: Original Introduction wrongly includes trend ('cars increased a lot') and the next sentence gives opinion. Original Overview contains all exact figures, so it functions as Body. Revised version separates paragraph functions.", "model": "Introduction: The line graph compares the percentages of commuters using four forms of transport in Australia between 2000 and 2020.\nOverview: Overall, car and train use increased over the period, while bus and bicycle use declined. Cars showed the most substantial growth and became the leading mode by the end.", "explanation": "Original Introduction wrongly includes trend ('cars increased a lot') and the next sentence gives opinion. Original Overview contains all exact figures, so it functions as Body. Revised version separates paragraph functions.", "qaNote": "", "mode": "writing", "count": 2, "labels": ["Introduction", "Overview and error diagnosis"], "choices": [], "expected": [], "objective": false, "objectiveCount": 0, "answers": [{"answer": "Introduction: The line graph compares the percentages of commuters using four forms of transport in Australia between 2000 and 2020.\nOverview: Overall, car and train use increased over the period, while bus and bicycle use declined. Cars showed the most substantial growth and became the leading mode by the end.", "why": "Original Introduction wrongly includes trend ('cars increased a lot') and the next sentence gives opinion. Original Overview contains all exact figures, so it functions as Body. Revised version separates paragraph functions."}]}, {"id": "EX29", "number": 29, "title": "Build the four-paragraph map", "section": "Full organisation", "body": "[TABLE]\nYEAR | A | B | C | D\n2000 | 20 | 25 | 70 | 65\n2010 | 40 | 45 | 50 | 48\n2020 | 65 | 70 | 30 | 25\nParagraph 1 – INTRODUCTION: What does the chart show?\n________________________________________________________________________________\n________________________________________________________________________________\nParagraph 2 – OVERVIEW: Main feature 1 / Main feature 2\n________________________________________________________________________________\n________________________________________________________________________________\nParagraph 3 – BODY 1: Variables / reason for grouping / details\n________________________________________________________________________________\n________________________________________________________________________________\nParagraph 4 – BODY 2: Variables / reason for grouping / details\n________________________________________________________________________________\n________________________________________________________________________________", "key": "ANSWER / MODEL: Introduction: paraphrase a chart comparing A–D from 2000 to 2020. Overview: A+B rise; C+D fall; the two pairs converge/cross in relative ranking. Body 1: A+B because both increase similarly; report 20/25 → 40/45 → 65/70. Body 2: C+D because both decline similarly; report 70/65 → 50/48 → 30/25.\nGIẢI THÍCH CHI TIẾT: The best map creates two internally coherent data groups. Overview stays number-free; Bodies carry evidence. Midpoint is useful because it shows continued parallel movement.", "model": "Introduction: paraphrase a chart comparing A–D from 2000 to 2020. Overview: A+B rise; C+D fall; the two pairs converge/cross in relative ranking. Body 1: A+B because both increase similarly; report 20/25 → 40/45 → 65/70. Body 2: C+D because both decline similarly; report 70/65 → 50/48 → 30/25.", "explanation": "The best map creates two internally coherent data groups. Overview stays number-free; Bodies carry evidence. Midpoint is useful because it shows continued parallel movement.", "qaNote": "", "mode": "writing", "count": 4, "labels": ["Paragraph 1 · Introduction", "Paragraph 2 · Overview", "Paragraph 3 · Body 1", "Paragraph 4 · Body 2"], "choices": [], "expected": [], "objective": false, "objectiveCount": 0, "answers": [{"answer": "Introduction: paraphrase a chart comparing A–D from 2000 to 2020. Overview: A+B rise; C+D fall; the two pairs converge/cross in relative ranking. Body 1: A+B because both increase similarly; report 20/25 → 40/45 → 65/70. Body 2: C+D because both decline similarly; report 70/65 → 50/48 → 30/25.", "why": "The best map creates two internally coherent data groups. Overview stays number-free; Bodies carry evidence. Midpoint is useful because it shows continued parallel movement."}]}, {"id": "EX30", "number": 30, "title": "Find the bad plan", "section": "Full organisation", "body": "Plan A: Introduction = paraphrase task; Overview = A+B rise, C+D fall; Body 1 = A+B; Body 2 = C+D.\nPlan B: Introduction = paraphrase + all starting figures; Overview = list all final figures; Body 1 = A+C; Body 2 = B+D.\nPlan C: Introduction = paraphrase; Overview = main trends + biggest change; Body 1 = starting and midpoint comparisons; Body 2 = final values and overall movements.\nPlan A: ______   Plan B: ______   Plan C: ______\nBest plan for the data and why:\n________________________________________________________________________________\n________________________________________________________________________________", "key": "ANSWER / MODEL: Plan A = GOOD/very strong. Plan B = BAD. Plan C = POSSIBLE, but for this dataset Plan A is usually clearer. Best: Plan A.\nGIẢI THÍCH CHI TIẾT: Plan B violates section functions: exact figures in Introduction and list-like Overview, plus random grouping. Plan C is structurally valid time-based organisation, but A+B versus C+D gives stronger within-paragraph comparison because trends are parallel.", "model": "Plan A = GOOD/very strong. Plan B = BAD. Plan C = POSSIBLE, but for this dataset Plan A is usually clearer. Best: Plan A.", "explanation": "Plan B violates section functions: exact figures in Introduction and list-like Overview, plus random grouping. Plan C is structurally valid time-based organisation, but A+B versus C+D gives stronger within-paragraph comparison because trends are parallel.", "qaNote": "Plan C có logic thời gian và có thể chấp nhận; Plan A rõ hơn với bộ dữ liệu này.", "mode": "writing", "count": 4, "labels": ["Plan A", "Plan B", "Plan C", "Best plan and reason"], "choices": [], "expected": [], "objective": false, "objectiveCount": 0, "answers": [{"answer": "Plan A = GOOD/very strong. Plan B = BAD. Plan C = POSSIBLE, but for this dataset Plan A is usually clearer. Best: Plan A.", "why": "Plan B violates section functions: exact figures in Introduction and list-like Overview, plus random grouping. Plan C is structurally valid time-based organisation, but A+B versus C+D gives stronger within-paragraph comparison because trends are parallel."}]}, {"id": "EX31", "number": 31, "title": "Information Selection Test", "section": "Full organisation", "body": "Instructions: Use I / O / B1 / B2 for data where A+B increase and C+D decline.\nChart type _____\nTime period _____\nA and B increased overall _____\nA started at 20 _____\nB ended at 70 _____\nC and D declined _____\nC started at 70 _____\nD ended at 25 _____\nA showed one of the strongest rises _____\nExact midpoint figures for C and D _____", "key": "ANSWER / MODEL: 1 I; 2 I; 3 O; 4 B1; 5 B1; 6 O; 7 B2; 8 B2; 9 O; 10 B2.\nGIẢI THÍCH CHI TIẾT: Chart type/time identify task. General direction and strongest rise belong Overview. Exact values belong the corresponding Body. Midpoint values for C/D are Body detail, included only if useful.", "model": "1 I; 2 I; 3 O; 4 B1; 5 B1; 6 O; 7 B2; 8 B2; 9 O; 10 B2.", "explanation": "Chart type/time identify task. General direction and strongest rise belong Overview. Exact values belong the corresponding Body. Midpoint values for C/D are Body detail, included only if useful.", "qaNote": "", "mode": "choice", "count": 10, "labels": ["Câu 1", "Câu 2", "Câu 3", "Câu 4", "Câu 5", "Câu 6", "Câu 7", "Câu 8", "Câu 9", "Câu 10"], "choices": ["I", "O", "B1", "B2"], "expected": ["I", "I", "O", "B1", "B1", "O", "B2", "B2", "O", "B2"], "objective": true, "objectiveCount": 10, "answers": [{"answer": "I", "why": "Chart type xác định task."}, {"answer": "I", "why": "Time period xác định task."}, {"answer": "O", "why": "A+B increased là xu hướng chung."}, {"answer": "B1", "why": "A started at 20 là số liệu nhóm tăng."}, {"answer": "B1", "why": "B ended at 70 là số liệu nhóm tăng."}, {"answer": "O", "why": "C+D declined là xu hướng chính."}, {"answer": "B2", "why": "C started at 70 là số liệu nhóm giảm."}, {"answer": "B2", "why": "D ended at 25 là số liệu nhóm giảm."}, {"answer": "O", "why": "Strongest rise là đặc điểm nổi bật."}, {"answer": "B2", "why": "Midpoint chính xác thuộc đoạn dữ liệu C/D."}]}, {"id": "EX32", "number": 32, "title": "Paragraph Boundary Test", "section": "Full organisation", "body": "The chart compares four categories from 2000 to 2020. A started at 20%, while C stood at 70%. Overall, A increased. B was 25% in 2000. C declined to 30% in 2020. B increased to 70%. Overall, C and D decreased. D began at 65%. A ended at 65%.\nInstructions: Label each sentence I/O/B1/B2, reorder, combine where useful, and rewrite as four functional paragraphs.\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________", "key": "ANSW
