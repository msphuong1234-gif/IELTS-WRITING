ER / MODEL: Model organisation:\nP1 Introduction: The chart compares four categories between 2000 and 2020.\nP2 Overview: Overall, A and B increased, whereas C and D declined.\nP3 Body 1: A and B started at 20% and 25%, respectively. Both rose over the period, ending at 65% and 70%.\nP4 Body 2: C and D began much higher, at 70% and 65%, respectively, but both declined, with C falling to 30% by 2020. [D's final value should only be added if supplied by the source.]\nGIẢI THÍCH CHI TIẾT: The original mixes Introduction, Overview and Body details. Reordering by paragraph function immediately improves coherence. Important QA point: do not invent D's final figure if it is not present in the exercise paragraph; if using the earlier dataset, 25% is available, but a standalone answer must respect only supplied data.", "model": "Model organisation:\nP1 Introduction: The chart compares four categories between 2000 and 2020.\nP2 Overview: Overall, A and B increased, whereas C and D declined.\nP3 Body 1: A and B started at 20% and 25%, respectively. Both rose over the period, ending at 65% and 70%.\nP4 Body 2: C and D began much higher, at 70% and 65%, respectively, but both declined, with C falling to 30% by 2020. [D's final value should only be added if supplied by the source.]", "explanation": "The original mixes Introduction, Overview and Body details. Reordering by paragraph function immediately improves coherence. Important QA point: do not invent D's final figure if it is not present in the exercise paragraph; if using the earlier dataset, 25% is available, but a standalone answer must respect only supplied data.", "qaNote": "Không tự thêm số cuối kỳ của D nếu chỉ sử dụng đoạn dữ liệu trong Exercise 32.", "mode": "writing", "count": 4, "labels": ["Introduction", "Overview", "Body 1", "Body 2"], "choices": [], "expected": [], "objective": false, "objectiveCount": 0, "answers": [{"answer": "Model organisation:\nP1 Introduction: The chart compares four categories between 2000 and 2020.\nP2 Overview: Overall, A and B increased, whereas C and D declined.\nP3 Body 1: A and B started at 20% and 25%, respectively. Both rose over the period, ending at 65% and 70%.\nP4 Body 2: C and D began much higher, at 70% and 65%, respectively, but both declined, with C falling to 30% by 2020. [D's final value should only be added if supplied by the source.]", "why": "The original mixes Introduction, Overview and Body details. Reordering by paragraph function immediately improves coherence. Important QA point: do not invent D's final figure if it is not present in the exercise paragraph; if using the earlier dataset, 25% is available, but a standalone answer must respect only supplied data."}]}, {"id": "EX33", "number": 33, "title": "Plan in 3 minutes", "section": "Exam transfer", "body": "[TABLE]\nYEAR | X | Y | Z\n2000 | 15 | 60 | 35\n2010 | 35 | 50 | 36\n2020 | 70 | 30 | 38\nI – Chart/object/time/place:\n________________________________________________________________________________\nO1 – Main trend:\n________________________________________________________________________________\nO2 – Extreme/change:\n________________________________________________________________________________\nB1 – Group + key data:\n________________________________________________________________________________\nB2 – Group + key data:\n________________________________________________________________________________\nSpecific numbers in Overview? YES / NO     Body grouping has a reason? YES / NO", "key": "ANSWER / MODEL: Model notes: I = line graph comparing X, Y and Z from 2000 to 2020. O1 = X rises sharply while Y declines; Z is broadly stable/slightly upward. O2 = X shows the greatest change and ends highest; Y moves from highest to lowest. B1 = X+Y as opposite major trends, using 15→35→70 and 60→50→30. B2 = Z as stable/slight increase, 35→36→38, with comparison to X/Y where useful. Specific numbers in Overview? NO. Grouping reason? YES.\nGIẢI THÍCH CHI TIẾT: This planning format forces selection before writing. X/Y belong together because their strong opposite trends create the main story; Z is separated because its movement is minimal.", "model": "Model notes: I = line graph comparing X, Y and Z from 2000 to 2020. O1 = X rises sharply while Y declines; Z is broadly stable/slightly upward. O2 = X shows the greatest change and ends highest; Y moves from highest to lowest. B1 = X+Y as opposite major trends, using 15→35→70 and 60→50→30. B2 = Z as stable/slight increase, 35→36→38, with comparison to X/Y where useful. Specific numbers in Overview? NO. Grouping reason? YES.", "explanation": "This planning format forces selection before writing. X/Y belong together because their strong opposite trends create the main story; Z is separated because its movement is minimal.", "qaNote": "", "mode": "writing", "count": 7, "labels": ["Introduction notes", "Overview feature 1", "Overview feature 2", "Body 1 group + data", "Body 2 group + data", "Numbers in Overview?", "Reason for grouping?"], "choices": [], "expected": [], "objective": false, "objectiveCount": 0, "answers": [{"answer": "Model notes: I = line graph comparing X, Y and Z from 2000 to 2020. O1 = X rises sharply while Y declines; Z is broadly stable/slightly upward. O2 = X shows the greatest change and ends highest; Y moves from highest to lowest. B1 = X+Y as opposite major trends, using 15→35→70 and 60→50→30. B2 = Z as stable/slight increase, 35→36→38, with comparison to X/Y where useful. Specific numbers in Overview? NO. Grouping reason? YES.", "why": "This planning format forces selection before writing. X/Y belong together because their strong opposite trends create the main story; Z is separated because its movement is minimal."}]}, {"id": "EX34", "number": 34, "title": "From plan to FOUR paragraphs", "section": "Exam transfer", "body": "Instructions: Use Exercise 33. Introduction = 1 sentence; Overview = 2 sentences; Body 1 = 3–4 sentences; Body 2 = 3–4 sentences.\nINTRODUCTION\n________________________________________________________________________________\n________________________________________________________________________________\nOVERVIEW\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\nBODY 1\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\nBODY 2\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________", "key": "ANSWER / MODEL: Model:\nIntroduction: The line graph compares changes in three categories, X, Y and Z, between 2000 and 2020.\nOverview: Overall, X increased markedly while Y followed the opposite trend. Z changed very little, and X experienced the greatest overall movement, finishing as the highest category.\nBody 1: X began at 15 in 2000, far below Y at 60. Over the next decade, X more than doubled to 35, whereas Y fell to 50. By 2020, the two trends had diverged further, with X reaching 70 and Y dropping to 30.\nBody 2: Z, by contrast, remained comparatively stable. It stood at 35 in 2000 and edged up to 36 in 2010 before ending at 38 in 2020.\nGIẢI THÍCH CHI TIẾT: Introduction has no commentary. Overview abstracts patterns without exact data. Body 1 groups the dominant opposing movements; Body 2 handles the stable series. Note: if units are percentages, add %; this exercise table did not explicitly label the unit, so the model avoids inventing it.", "model": "Model:\nIntroduction: The line graph compares changes in three categories, X, Y and Z, between 2000 and 2020.\nOverview: Overall, X increased markedly while Y followed the opposite trend. Z changed very little, and X experienced the greatest overall movement, finishing as the highest category.\nBody 1: X began at 15 in 2000, far below Y at 60. Over the next decade, X more than doubled to 35, whereas Y fell to 50. By 2020, the two trends had diverged further, with X reaching 70 and Y dropping to 30.\nBody 2: Z, by contrast, remained comparatively stable. It stood at 35 in 2000 and edged up to 36 in 2010 before ending at 38 in 2020.", "explanation": "Introduction has no commentary. Overview abstracts patterns without exact data. Body 1 groups the dominant opposing movements; Body 2 handles the stable series. Note: if units are percentages, add %; this exercise table did not explicitly label the unit, so the model avoids inventing it.", "qaNote": "", "mode": "writing", "count": 4, "labels": ["Introduction", "Overview", "Body 1", "Body 2"], "choices": [], "expected": [], "objective": false, "objectiveCount": 0, "answers": [{"answer": "Model:\nIntroduction: The line graph compares changes in three categories, X, Y and Z, between 2000 and 2020.\nOverview: Overall, X increased markedly while Y followed the opposite trend. Z changed very little, and X experienced the greatest overall movement, finishing as the highest category.\nBody 1: X began at 15 in 2000, far below Y at 60. Over the next decade, X more than doubled to 35, whereas Y fell to 50. By 2020, the two trends had diverged further, with X reaching 70 and Y dropping to 30.\nBody 2: Z, by contrast, remained comparatively stable. It stood at 35 in 2000 and edged up to 36 in 2010 before ending at 38 in 2020.", "why": "Introduction has no commentary. Overview abstracts patterns without exact data. Body 1 groups the dominant opposing movements; Body 2 handles the stable series. Note: if units are percentages, add %; this exercise table did not explicitly label the unit, so the model avoids inventing it."}]}, {"id": "EX35", "number": 35, "title": "FINAL MASTERY TEST", "section": "Exam transfer", "body": "Task: The line graph shows the percentages of people using four forms of transport in a city between 2000 and 2020.\n[TABLE]\nYEAR | CAR | TRAIN | BUS | BICYCLE\n2000 | 25% | 20% | 50% | 15%\n2005 | 35% | 28% | 45% | 14%\n2010 | 45% | 35% | 38% | 12%\n2015 | 58% | 42% | 30% | 10%\n2020 | 70% | 50% | 25% | 8%\nStage 1 – Main trend:\n________________________________________________________________________________\nHighest/lowest:\n________________________________________________________________________________\nGreatest change:\n________________________________________________________________________________\nLogical groups:\n________________________________________________________________________________\nStage 2 – Introduction (ONE sentence):\n________________________________________________________________________________\nStage 3 – Overview (exactly TWO sentences):\n________________________________________________________________________________\nStage 4 – Body 1 plan + reason:\n________________________________________________________________________________\nStage 4 – Body 2 plan + reason:\n________________________________________________________________________________\nStage 5 – BODY 1 (3–5 sentences):\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\nStage 5 – BODY 2 (3–5 sentences):\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________\n________________________________________________________________________________", "key": "ANSWER / MODEL: Stage 1: Main trend = car/train rise; bus/bicycle fall. Highest/lowest = bus highest initially; car highest finally; bicycle lowest throughout. Greatest change = car +45 percentage points; bus -25; train +30; bicycle -7, so car changes most. Logical groups = car+train / bus+bicycle.\nIntroduction: The line graph compares the percentages of people using cars, trains, buses and bicycles in a city between 2000 and 2020.\nOverview: Overall, car and train use rose steadily, whereas the proportions using buses and bicycles declined. Cars experienced the largest change and became the most widely used mode by 2020, while bicycles remained the least common.\nBody 1: Cars were used by 25% of people in 2000, slightly more than trains at 20%. Both figures increased throughout the period, with car use reaching 45% in 2010 and 70% in 2020. Train use followed a similar but less pronounced pattern, rising to 35% and then 50% in the same years.\nBody 2: Buses were initially the dominant mode, at 50%, but their share fell steadily to 38% in 2010 and 25% by 2020. Bicycle use also declined, although more gradually, from 15% at the start to 12% in 2010 and just 8% at the end.\nGIẢI THÍCH CHI TIẾT: Data QA: Car change = 70−25=45 percentage points, Train = 30, Bus = 25 downward, Bicycle = 7 downward. Vì vậy car là greatest absolute change. Overview không đưa các số này; chúng chỉ dùng để quyết định feature. Body grouping theo direction giúp comparison rõ. 'percentage points' là đơn vị đúng khi lấy hiệu giữa hai percentages. Không viết 'cars increased by 45%' nếu đang nói absolute percentage-point change.", "model": "Stage 1: Main trend = car/train rise; bus/bicycle fall. Highest/lowest = bus highest initially; car highest finally; bicycle lowest throughout. Greatest change = car +45 percentage points; bus -25; train +30; bicycle -7, so car changes most. Logical groups = car+train / bus+bicycle.\nIntroduction: The line graph compares the percentages of people using cars, trains, buses and bicycles in a city between 2000 and 2020.\nOverview: Overall, car and train use rose steadily, whereas the proportions using buses and bicycles declined. Cars experienced the largest change and became the most widely used mode by 2020, while bicycles remained the least common.\nBody 1: Cars were used by 25% of people in 2000, slightly more than trains at 20%. Both figures increased throughout the period, with car use reaching 45% in 2010 and 70% in 2020. Train use followed a similar but less pronounced pattern, rising to 35% and then 50% in the same years.\nBody 2: Buses were initially the dominant mode, at 50%, but their share fell steadily to 38% in 2010 and 25% by 2020. Bicycle use also declined, although more gradually, from 15% at the start to 12% in 2010 and just 8% at the end.", "explanation": "Data QA: Car change = 70−25=45 percentage points, Train = 30, Bus = 25 downward, Bicycle = 7 downward. Vì vậy car là greatest absolute change. Overview không đưa các số này; chúng chỉ dùng để quyết định feature. Body grouping theo direction giúp comparison rõ. 'percentage points' là đơn vị đúng khi lấy hiệu giữa hai percentages. Không viết 'cars increased by 45%' nếu đang nói absolute percentage-point change.", "qaNote": "", "mode": "writing", "count": 10, "labels": ["Main trend", "Highest/lowest", "Greatest change", "Logical groups", "Introduction", "Overview", "Body 1 plan + reason", "Body 2 plan + reason", "Body 1 paragraph", "Body 2 paragraph"], "choices": [], "expected": [], "objective": false, "objectiveCount": 0, "answers": [{"answer": "Stage 1: Main trend = car/train rise; bus/bicycle fall. Highest/lowest = bus highest initially; car highest finally; bicycle lowest throughout. Greatest change = car +45 percentage points; bus -25; train +30; bicycle -7, so car changes most. Logical groups = car+train / bus+bicycle.\nIntroduction: The line graph compares the percentages of people using cars, trains, buses and bicycles in a city between 2000 and 2020.\nOverview: Overall, car and train use rose steadily, whereas the proportions using buses and bicycles declined. Cars experienced the largest change and became the most widely used mode by 2020, while bicycles remained the least common.\nBody 1: Cars were used by 25% of people in 2000, slightly more than trains at 20%. Both figures increased throughout the period, with car use reaching 45% in 2010 and 70% in 2020. Train use followed a similar but less pronounced pattern, rising to 35% and then 50% in the same years.\nBody 2: Buses were initially the dominant mode, at 50%, but their share fell steadily to 38% in 2010 and 25% by 2020. Bicycle use also declined, although more gradually, from 15% at the start to 12% in 2010 and just 8% at the end.", "why": "Data QA: Car change = 70−25=45 percentage points, Train = 30, Bus = 25 downward, Bicycle = 7 downward. Vì vậy car là greatest absolute change. Overview không đưa các số này; chúng chỉ dùng để quyết định feature. Body grouping theo direction giúp comparison rõ. 'percentage points' là đơn vị đúng khi lấy hiệu giữa hai percentages. Không viết 'cars increased by 45%' nếu đang nói absolute percentage-point change."}]}]}</script><script>
'use strict';const lesson=JSON.parse(document.querySelector('#data').textContent),app=document.querySelector('#app'),notice=document.querySelector('#notice'),key='writingPractice::'+lesson.id;const endpoint='https://script.google.com/macros/s/AKfycbzCX-jRyn28wS8lEQ-wtdM8qspFr-Ptj1c2r3ctxpi3hseVZ1UMBE8N4jXAx1-03pLn/exec';let state=load(),page=state.student?.name&&state.student?.class&&state.student?.id?'home':'login',active=null,submitting=false;
function load(){try{let o=JSON.parse(localStorage.getItem(key));if(o&&o.student&&o.exercises)return o}catch{}return {student:{},exercises:{}}}function persist(){try{localStorage.setItem(key,JSON.stringify(state));notice.textContent='';return true}catch{notice.textContent='Không lưu được bài trên thiết bị. Kiểm tra cài đặt hoặc dung lượng trình duyệt trước khi rời trang.';return false}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function st(id){return state.exercises[id]||(state.exercises[id]={responses:{},submitted:false,send:'',attempt:1,history:[]})}function go(p,id){page=p;active=id||null;render();window.scrollTo(0,0)}function html(s){app.innerHTML=s}
function format(source){return source.split('\n').reduce((a,line)=>{if(line==='[TABLE]')return a;if(line.includes(' | ')){let cells=line.split(' | ');if(!a.length||a[a.length-1].type!=='table')a.push({type:'table',rows:[]});a[a.length-1].rows.push(cells)}else a.push({type:'text',line});return a},[]).map(z=>z.type==='table'?`<div class="tablewrap"><table>${z.rows.map(row=>`<tr>${row.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table></div>`:`<div>${esc(z.line)||'&nbsp;'}</div>`).join('')}
function nav(){return '<div class="toolbar"><button class="alt" data-action="home">← Trở lại Lesson</button></div>'}
function render(){if(page==='login'){html(`<section class="card"><h2>Thông tin học sinh</h2><p class="muted">Nhập đủ thông tin để bắt đầu Lesson. Có thể sửa lại sau.</p><form id="identity"><label for="studentName">Họ và tên</label><input id="studentName" required value="${esc(state.student.name)}"><label for="studentClass">Lớp</label><input id="studentClass" required value="${esc(state.student.class)}"><label for="studentId">Mã học sinh</label><input id="studentId" required value="${esc(state.student.id)}"><div class="actions"><button type="submit">Vào bài học</button></div></form></section>`);return}
if(page==='home'){let done=lesson.exercises.filter(e=>st(e.id).submitted).length;html(`<section class="card"><div class="eyebrow">Lesson overview</div><h2>${esc(lesson.title)}</h2><p>${esc(state.student.name)} · ${esc(state.student.class)} · ${esc(state.student.id)}</p><p class="status">Đã nộp ${done}/${lesson.exercises.length} Exercise</p><p class="muted">Học lý thuyết trước, sau đó có thể chọn Exercise bất kỳ. Bài đang làm được lưu trên trình duyệt này.</p><div class="actions"><button data-action="theory">Học lý thuyết</button><button class="alt" data-action="edit">Sửa thông tin</button><button class="warn" data-action="reset">Reset toàn bộ Lesson</button></div></section><h2>Practice</h2><div class="grid">${lesson.exercises.map(e=>{let a=st(e.id),status=a.submitted?'ĐÃ NỘP':Object.values(a.responses).some(Boolean)?'ĐANG LÀM':'CHƯA LÀM';return `<section class="card"><span class="badge">${status}</span><h3>Exercise ${e.number}. ${esc(e.title)}</h3><p class="muted">${e.objectiveCount?`${e.objectiveCount} mục chấm tự động${e.count>e.objectiveCount?' · bài viết tự đối chiếu':''}`:'Viết và tự đối chiếu bài mẫu'}</p>${a.submitted&&e.objectiveCount?`<strong>${a.score}/${e.objectiveCount} mục khách quan</strong>`:''}<div class="actions"><button data-action="exercise" data-id="${e.id}">${a.submitted?'Xem bài đã nộp':'Mở Exercise'}</button></div></section>`}).join('')}</div>`);return}
if(page==='theory'){let chunks=lesson.theory.split(/(?=\n9\.[123]\. |\n10\. )/);html(`${nav()}<h2>Kiến thức cần học trước khi luyện tập</h2><section class="card">${format(lesson.intro)}</section>${chunks.map(c=>`<section class="card">${format(c.trim())}</section>`).join('')}`);return}
let e=lesson.exercises.find(z=>z.id===active),a=st(e.id),sent=a.submitted;let inputs=e.labels.map((label,i)=>{let value=a.responses['q'+i]||'';let control=e.mode==='mixed'?`<select id="q${i}" data-answer="q${i}" ${sent?'disabled':''}><option value="">Chọn ✓ hoặc ✕</option>${['✓','✕'].map(o=>`<option ${value===o?'selected':''}>${o}</option>`).join('')}</select><label for="q${i}fix">Nếu sai, sửa từ nối hoặc câu</label><textarea id="q${i}fix" data-answer="q${i}fix" ${sent?'readonly':''} placeholder="Viết cách sửa nếu cần">${esc(a.responses['q'+i+'fix']||'')}</textarea>`:e.mode==='dual'?`<div class="grid"><div><label for="q${i}a">Quan hệ</label><select id="q${i}a" data-answer="q${i}a" ${sent?'disabled':''}><option value="">Chọn</option>${['TIME','CONTRAST','CONTRAST/CONCESSION','SIMILARITY'].map(o=>`<option ${a.responses['q'+i+'a']===o?'selected':''}>${o}</option>`).join('')}</select></div><div><label for="q${i}b">Cấp độ</label><select id="q${i}b" data-answer="q${i}b" ${sent?'disabled':''}><option value="">Chọn</option>${['C','S'].map(o=>`<option ${a.responses['q'+i+'b']===o?'selected':''}>${o}</option>`).join('')}</select></div></div>`:e.objective&&i<e.objectiveCount?`<select id="q${i}" data-answer="q${i}" ${sent?'disabled':''}><option value="">Chọn đáp án</option>${e.choices.map(o=>`<option value="${esc(o)}" ${value===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<textarea id="q${i}" data-answer="q${i}" ${sent?'readonly':''} class="${e.count===1?'long':''}" placeholder="Viết câu trả lời của em; các cách diễn đạt hợp lý đều được xem xét.">${esc(value)}</textarea>`;return `<div class="item"><label for="${e.mode==='dual'?'q'+i+'a':'q'+i}">${esc(label)}</label>${control}</div>`}).join('');
let review=sent?`<section class="review"><h2>Kết quả và giải thích</h2>${e.objectiveCount?`<p class="status">${a.score}/${e.objectiveCount} mục khách quan. ${e.count>e.objectiveCount?'Các câu viết bổ sung không nằm trong điểm tự động.':''}</p>`:'<p class="status">Bài viết tự đối chiếu; hệ thống không gán điểm IELTS hoặc đánh sai câu khác bài mẫu.</p>'}${e.labels.map((label,i)=>{let ans=e.answers.length===e.count?e.answers[i]:null,raw=e.mode==='mixed'?`${a.responses['q'+i]||'—'} · Sửa: ${a.responses['q'+i+'fix']||'—'}`:e.mode==='dual'?`${a.responses['q'+i+'a']||'—'} + ${a.responses['q'+i+'b']||'—'}`:a.responses['q'+i]||'—';let checked=e.objective&&i<e.objectiveCount,ok=checked&&(e.mode==='dual'?a.responses['q'+i+'a']===e.expected[i][0]&&a.responses['q'+i+'b']===e.expected[i][1]:String(a.responses['q'+i]||'').toLowerCase()===String(e.expected[i]).toLowerCase());return `<div class="item"><h3>${esc(label)} ${checked?(ok?'· ✓ Đúng':'· ✗ Xem lại'):''}</h3><p><strong>Bài của em:</strong></p><div class="source">${esc(raw)}</div>${ans&&e.answers.length===e.count?`<p><strong>Đáp án/bài mẫu:</strong> ${esc(ans.answer)}</p><p><strong>Giải thích:</strong> ${esc(ans.why)}</p>`:''}</div>`}).join('')}${e.qaNote?`<p class="status">Lưu ý kiểm định: ${esc(e.qaNote)}</p>`:''}<h3>Teacher Key và lời giải đầy đủ</h3><div class="source">${esc(e.key)}</div><h3>Kiến thức cần nhớ</h3><p>${esc(knowledge[e.number]||'Đối chiếu yêu cầu và lời giải từng câu; xác định đúng quan hệ giữa dữ liệu trước khi chọn cấu trúc nối câu.')}</p><p class="status" role="status">${a.send==='sent'?'Đã gửi kết quả.':a.send==='sending'?'Đang gửi kết quả…':a.send==='failed'?'Chưa xác nhận được việc gửi kết quả. Bài làm vẫn lưu trên thiết bị; kiểm tra Sheet trước khi thử gửi lại để tránh trùng.':a.send==='uncertain'?'Chưa xác nhận được trạng thái gửi. Bài vẫn lưu; kiểm tra Sheet trước khi gửi lại.':'Bài đã lưu trên thiết bị.'}</p></section>`:'';
html(`${nav()}<section class="card"><div class="eyebrow">Exercise ${e.number} / ${lesson.exercises.length}</div><h2>${esc(e.title)}</h2><div class="source">${format(e.body)}</div><p class="muted">${e.objectiveCount?'Phần lựa chọn được chấm tự động. ':''}Các bài viết có thể có nhiều cách diễn đạt đúng.</p>${inputs}${e.number===35?`<h3>Tự kiểm tra trước khi nộp</h3><div class="source">${esc(lesson.selfcheck)}</div>`:''}<div class="actions">${sent?`<button data-action="retry">Làm lại Exercise</button>${a.send==='failed'||a.send==='uncertain'?'<button class="alt" data-action="resend">Thử gửi lại</button>':''}`:'<button data-action="submit" id="submitButton">Nộp bài</button>'}<button class="alt" data-action="home">Trở lại Lesson</button></div>${review}</section>`)}
const knowledge=Object.fromEntries(lesson.exercises.map(e=>[e.number,e.explanation]));
document.addEventListener('submit',ev=>{if(ev.target.id!=='identity')return;ev.preventDefault();state.student={name:document.querySelector('#studentName').value.trim(),class:document.querySelector('#studentClass').value.trim(),id:document.querySelector('#studentId').value.trim()};if(!Object.values(state.student).every(Boolean))return;if(persist())go('home')});
for(let event of ['input','change'])document.addEventListener(event,ev=>{let id=ev.target.dataset.answer;if(!id||!active)return;st(active).responses[id]=ev.target.value;persist()});
document.addEventListener('click',async ev=>{let button=ev.target.closest('button[data-action]');if(!button)return;let act=button.dataset.action;if(act==='home'||act==='theory'){go(act);return}if(act==='edit'){go('login');return}if(act==='exercise'){go('exercise',button.dataset.id);return}if(act==='reset'){if(confirm('Xóa toàn bộ bài đang làm và kết quả trên thiết bị cho Lesson này?')&&confirm('Xác nhận lần hai: không thể khôi phục sau khi xóa.')){state.exercises={};persist();render()}return}let e=lesson.exercises.find(z=>z.id===active),a=st(e.id);if(act==='retry'){if(submitting)return;if(confirm('Làm lại Exercise này? Bài lần trước vẫn được lưu trong lịch sử cục bộ, phần trả lời hiện tại sẽ được làm mới.')){let history=a.history||[];history.push({attempt:a.attempt,responses:a.responses,score:a.score,send:a.send,submittedAt:a.submittedAt});state.exercises[e.id]={responses:{},submitted:false,attempt:(a.attempt||1)+1,send:'',history};persist();render()}return}if(act==='submit'){if(submitting||a.submitted)return;let has=Object.values(a.responses).some(v=>String(v).trim());if(!has&&!confirm('Bài còn trống. Em vẫn muốn nộp?'))return;submitting=true;button.disabled=true;a.submitted=true;a.submittedAt=new Date().toISOString();a.score=e.expected.reduce((sum,z,i)=>sum+(String(a.responses['q'+i]||'').toLowerCase()===String(z).toLowerCase()?1:0),0);a.send='sending';if(!persist()){a.submitted=false;a.send='';submitting=false;render();return}render();await send(e,a);submitting=false;render();return}if(act==='resend'){if(submitting||a.send==='sent')return;if(!confirm('Hãy kiểm tra Sheet trước: nếu kết quả đã có, gửi lại sẽ tạo dòng trùng. Vẫn gửi lại?'))return;submitting=true;button.disabled=true;a.send='sending';persist();render();await send(e,a);submitting=false;render()}});
async function send(e,a){let payload={skill:'WRITING',studentName:state.student.name,studentClass:state.student.class,studentId:state.student.id,testId:lesson.id,testName:lesson.title,score:a.score||0,total:e.objectiveCount,correct:a.score||0,wrong:e.objectiveCount-(a.score||0),duration:0,answers:JSON.stringify({exerciseId:e.id,exerciseName:e.title,attempt:a.attempt,submissionId:`${lesson.id}:${e.id}:${state.student.id}:${a.attempt}`,responses:a.responses,wordCount:Object.values(a.responses).join(' ').trim().split(/\s+/).filter(Boolean).length})};try{let response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});if(!response.ok)throw Error('HTTP '+response.status);let body=await response.text();if(/"(?:success|ok)"\s*:\s*false|"status"\s*:\s*"(?:error|failed)"/i.test(body))throw Error('Server error');a.send='sent'}catch{a.send='failed'}persist()}
if(page==='home'){for(let e of lesson.exercises){let a=st(e.id);if(a.send==='sending'){a.send='uncertain';persist()}}}render();
</script></body></html>
